name: simf_auth_pkg
description: SIMF mobile — the authentication feature (sign-in, sign-up, email OTP, refresh, sign-out, forgot/reset password, get-current-user). Depends on simf_data_pkg for the single dio client; never instantiates dio itself. See SIMF-MAA-001 v1.2 section 9.1 and DECISIONS_LOG D-003.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  meta: ^1.16.0
  # ES256 (ECDSA P-256) device-key crypto for biometric sign-in (D-172).
  pointycastle: ^3.9.1
  simf_data_pkg:
    path: ../simf_data_pkg

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
