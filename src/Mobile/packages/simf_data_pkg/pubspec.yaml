name: simf_data_pkg
description: SIMF mobile — centralised HTTP layer. The single dio client, the standard interceptors, ApiResult<T>, ApiFailure, secure and preferences storage. The only place in the codebase that knows about HTTP. See SIMF-MAA-001 v1.2 section 9.1.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
