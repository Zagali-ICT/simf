# analysis_options.yaml — SIMF Flutter App
# Strict analyzer config — the END-STATE target for the clean-code program.
#
# Base: very_good_analysis (industry-strict). To adopt:
#   flutter pub add --dev very_good_analysis
#   flutter pub get                       # then pin the EXACT version it resolved in pubspec
#   # remove flutter_lints from dev_dependencies — it conflicts/duplicates very_good
#
# ───────────────────────────────────────────────────────────────────────────
# ADOPTION - the ratchet, and where it currently stands (2026-08-09).
#
# The original note said an error-flip was impossible because the repo carried
# ~445 relative imports and 526 inline TextStyle. Both are now ZERO, so the
# rules below moved from "someday" to enforced. The reasoning behind the ratchet
# stands and is why the rest are still off:
#
#   Turn a rule to `error` ONLY when it already reports zero repo-wide. A gate
#   that fails every build gets switched off, and a switched-off gate protects
#   nothing - which is exactly what happened to the .NET test stage, disabled
#   for five weeks with 922 passing tests behind it.
#
# ENFORCED as errors below: 8 rules, each verified at zero before promotion.
# CI additionally treats WARNINGS as fatal (azure-pipelines.yml drops
# --no-fatal-warnings); `--no-fatal-infos` stays until the infos below clear.
#
# STILL OPEN, ~2100 infos, largest first:
#   avoid_positional_boolean_parameters       135
#   use_key_in_widget_constructors            113
#   avoid_redundant_argument_values           109
#   prefer_constructors_over_static_methods    75
#   comment_references                         55
#   lines_longer_than_80_chars               ~1580
# Each closes on its own, then gets promoted here. Do NOT promote one that is
# not already at zero.
# ───────────────────────────────────────────────────────────────────────────

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  # ENFORCED. Each of these reported ZERO repo-wide before being promoted
  # (2026-08-09); see the ADOPTION note above for the rule about that.
  errors:
    todo: warning                          # TODOs are visible, not silent - safe to keep on from day one
    always_use_package_imports: error      # was ~445, then 2032 after the extractions; now 0
    unused_import: error
    unused_local_variable: error
    unused_element: error
    unused_field: error
    dead_code: error
    avoid_print: error
    use_build_context_synchronously: error # async-gap BuildContext misuse - a real defect, not style
    avoid_dynamic_calls: error

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    # D-768 vendored `video_player_android` (patched for the faulty HiSilicon
    # decoder). It is upstream code we do not author, own the style of, or run
    # the tests of — and its checked-in generated mocks
    # (`test/*.mocks.dart`) were built against a different mockito, so they
    # alone contributed 325 analyzer errors + warnings: every real error in our
    # own code was buried, and "analyze clean" was unreachable by construction.
    # Excluding it makes `flutter analyze` report OUR code again. The plugin
    # still builds and ships; only static analysis of it is skipped.
    - "third_party/**"
    # NOTE: this repo uses hand-written Riverpod + a hand-written router (no codegen),
    # and has no `_legacy_mockup/` folder. Removed the *.gr.dart and _legacy_mockup
    # excludes (dead config). Re-add a codegen exclude only if codegen is introduced.

linter:
  rules:
    # --- correctness / safety ---
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_empty_else: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    discarded_futures: true
    no_adjacent_strings_in_list: true
    no_duplicate_case_values: true
    throw_in_finally: true
    unawaited_futures: true
    unnecessary_statements: true
    use_build_context_synchronously: true

    # OFF, with the measurement rather than a preference. 33 findings, and 32
    # of them are Riverpod provider declarations. `dart fix` satisfies those by
    # writing the internal type name —
    #     final AutoDisposeFutureProviderFamily<ArchiveEditionDetail?, String>
    #         archiveEditionDetailProvider = FutureProvider.autoDispose…
    # — which spells the type twice on one line, pushes most of them past 80
    # columns, and names a class nobody writes by hand. The type is already on
    # the right-hand side. The 33rd finding was real and is fixed.
    #
    # CQP-001 section 5.7: a gate that flags correct code is a gate that gets
    # switched off, so five rules were narrowed there for the same reason. This
    # is the same call, recorded the same way (2026-08-14).
    specify_nonobvious_property_types: false

    # --- Flutter performance / widgets ---
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    sized_box_for_whitespace: true
    sized_box_shrink_expand: true
    use_colored_box: true
    use_decorated_box: true
    avoid_unnecessary_containers: true
    use_key_in_widget_constructors: true
    use_full_hex_values_for_flutter_colors: true

    # --- structure / readability (clean code) ---
    always_use_package_imports: true        # NB: drives the eventual no-relative-imports error
    directives_ordering: true
    sort_constructors_first: true
    sort_unnamed_constructors_first: true
    cascade_invocations: true
    combinators_ordering: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    prefer_final_fields: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    unnecessary_late: true
    unnecessary_null_checks: true
    unnecessary_null_aware_assignments: true
    avoid_redundant_argument_values: true
    # `dart format` strips these (measured 0 -> 109 on 2026-08-14). It is
    # usable, but only followed by `dart fix --apply --code=require_trailing_commas`.
    # See CLAUDE.md section 11 - the end state is deliberately not format-stable.
    require_trailing_commas: true
    sort_child_properties_last: true

    # --- naming / API design ---
    camel_case_types: true
    camel_case_extensions: true
    library_names: true
    file_names: true
    non_constant_identifier_names: true
    constant_identifier_names: true
    avoid_positional_boolean_parameters: true
    use_named_constants: true
    avoid_setters_without_getters: true

    # --- docs / dead code ---
    public_member_api_docs: false          # full doc coverage is heavy; flip to true per-package if desired
    package_api_docs: false
    avoid_returning_this: true
    only_throw_errors: true

    # --- i18n / RTL discipline ---
    # (no built-in lint forbids left/right padding; CLAUDE.md §3 + §13 enforce it in review;
    #  use the grep pre-commit check in REFACTOR_PLAN.md to make it semi-mechanical)

    # --- misc hygiene ---
    avoid_print: true
    # avoid_relative_lib_imports — REMOVED: redundant with always_use_package_imports above
    prefer_single_quotes: true
    unnecessary_brace_in_string_interps: true
    use_string_buffers: true
    prefer_interpolation_to_compose_strings: true
    leading_newlines_in_multiline_strings: true
    join_return_with_assignment: true
    eol_at_end_of_file: true
