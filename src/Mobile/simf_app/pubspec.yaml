name: simf_app
description: SIMF Maritime Forum — the Flutter mobile application for Android and iOS. Routes the 41 mockup screens, applies localisation and theme, and hosts the auth and data packages. See SIMF-MAA-001 v1.2.
# D-736 — 1.0.0 matches the version the UI has always advertised; the About /
# More screens now display this real value via package_info_plus, and the
# server version-policy gate compares against it.
version: 1.0.1+5
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  intl: ^0.19.0
  # Biometric (Face/Touch) prompt for device-key sign-in (Page_003 L-2).
  # Native config (manifest / Info.plist / MainActivity) lands in the generated
  # android/ios folders (simf-run); absent in this source tree.
  local_auth: ^2.3.0
  # ID-document image picker for the visitor profile (Page_007). C7 (D-371):
  # camera-only capture → bytes → multipart upload via simf_data_pkg. Native
  # permission strings (Info.plist / manifest) land in the generated folders
  # (simf-run).
  image_picker: ^1.1.2
  # C7 (D-371) — on-device human-face check over the profile camera capture
  # (instant feedback; the server's offline FaceAiSharp gate is the
  # authority). Android/iOS only — web/test runtimes defer to the server.
  google_mlkit_face_detection: ^0.13.1
  # D-404 — live camera preview + frame stream for the guided face-capture /
  # liveness flow (التحقق من الهوية): ML Kit reads smilingProbability +
  # headEulerAngleY off the stream to verify Smile → turn-right → turn-left.
  # Android/iOS only; web/test runtimes degrade gracefully (no live preview).
  camera: ^0.11.0+2
  # Native OS share sheet for My-Area (Page_014): share the user's contact-card
  # (.vcf) and calendar (.ics) fetched from the App API. Native share config lands
  # in the generated folders (simf-run).
  share_plus: ^10.0.0
  # "Add to calendar" for the session detail (Page_017 E4) — opens the device
  # calendar's add-event editor pre-filled from the cached session (intent-based,
  # needs no Android permission). The local-notification "reminder" CTA is deferred
  # to the notifications platform pass (D-300); the server worker (D-217) is the
  # production reminder path.
  add_2_calendar: ^3.0.1
  # Entry-badge QR (Page_032) — pure-Dart QR painter (no native config) rendering
  # the account qrId from GET /app/account/dashboard.
  qr_flutter: ^4.1.0
  # Live-broadcast player (Page_025) — plays the session liveStreamUrl. Native
  # config (manifest / Info.plist) lands in the generated folders (simf-run);
  # the real stream provider is still a stub (D-211 D7).
  video_player: ^2.9.1
  # Live-broadcast YouTube player (Page 025, D-349) — plays a YouTube
  # liveStreamUrl / sign-language feed via the official IFrame Player API (rides
  # on webview_flutter; native config lands in the generated folders at
  # simf-run). YouTube is the POC live-video provider; HLS/MP4 (video_player
  # above) stays the fallback when the feed is not a YouTube link.
  youtube_player_iframe: ^6.0.2
  # Opens the OS dialer / mail app from the registration-success contact tiles
  # (Page_010, D-369). Tiles stay inert until BuildConfig.supportPhone/Email
  # are supplied via --dart-define; native queries config (Android 11+
  # <queries> for tel/mailto) lands in the generated folders (simf-run).
  url_launcher: ^6.3.0
  # QR scanner for the badge / contact / gate flows (Scan QR — FDS-014, D-286;
  # D-426). Uses the native ZXing C++ engine via FFI (flutter_zxing) over the
  # `camera` plugin — NO Google Play Services / ML Kit dependency, so the camera
  # works on Huawei / HMS devices where mobile_scanner showed a black preview
  # (D-426 research). A manual code-entry fallback stays available regardless.
  flutter_zxing: ^2.3.0
  # Renders the home tiles' exact iconify glyphs (KSA frame 758:1134) as bundled
  # SVGs tinted to the tile colour — the design uses iconify sets (solar/ph/
  # streamline/…) that have no 1:1 Material equivalent. Pure-Dart, no native config.
  flutter_svg: ^2.0.10
  # D-736 — the real installed version (About/More display + the launch
  # update-policy comparison). Federated plugin, no manual native config.
  package_info_plus: ^8.3.0
  # D-736 — semver parse/compare for the server version-policy check (never
  # string-compare versions: "1.10.0" < "1.9.0" lexically). Pure Dart.
  pub_semver: ^2.1.4

  simf_data_pkg:
    path: packages/simf_data_pkg
  simf_auth_pkg:
    path: packages/simf_auth_pkg
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # D-372 regression test only — drives the real SimfApiClient over a
  # header-recording adapter (same major as simf_data_pkg's pin).
  dio: ^5.7.0
  # D-373 — generates the SIMF launcher icon into the scaffolded native
  # folders. Run AFTER `flutter create --platforms=android .` (the folders
  # are generated, not committed): `dart run flutter_launcher_icons`.
  # D-699 — the launcher NAME is a manual post-scaffold step (not automated by
  # flutter_launcher_icons): in android/app/src/main/AndroidManifest.xml set
  # `android:label="@string/app_name"`, then add res/values/strings.xml
  # (app_name = SIMF) and res/values-ar/strings.xml (app_name = الملتقى البحري).
  # Without this the launcher shows the scaffold default "simf_app".
  flutter_launcher_icons: ^0.14.1
  # End-to-end harness: boots the assembled app (real router + screens) with
  # deterministic provider overrides and drives cross-screen flows. Runs headless
  # via `flutter test integration_test/`, or on a device with `-d <id>`.
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.3.0

# The SIMF app launcher icon (D-373 / D-388; icon art refreshed 2026-07-13).
# Dedicated 1024x1024 masters live in icon/ (NOT under assets/, so they are not
# bundled into the app at runtime — flutter_launcher_icons only reads them at
# build time):
#   icon/app_icon.png            — opaque brand-navy (#01132D) square with the
#                                  white compass/palm/anchor mark centred at ~70%
#                                  (iOS, web, and the legacy full-bleed Android icon).
#   icon/app_icon_foreground.png — the same mark on a TRANSPARENT canvas at ~60%
#                                  (Android adaptive foreground): the extra safe-
#                                  zone padding stops the circular/squircle mask
#                                  trimming the mark (the earlier full-bleed source
#                                  was cropped — this fixes that).
# The in-app brand mark stays assets/images/simf_logo.png (SimfLogo) — a separate
# asset, unchanged. Android/iOS icons are applied by `dart run
# flutter_launcher_icons` (android/ is gitignored and ios/ is generated at build,
# so neither is committed here); the same command regenerates the committed web
# icons (web/favicon.png + web/icons/*) from icon/app_icon.png. Run it after the
# native folders exist, then verify the launcher icon on a device.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon/app_icon.png"
  adaptive_icon_background: "#01132D"
  adaptive_icon_foreground: "icon/app_icon_foreground.png"
  # 0: app_icon_foreground.png already bakes in the ~20% safe-zone padding
  # (mark at ~60%), so the tool's default 16% inset would shrink it twice.
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "icon/app_icon.png"
    background_color: "#01132D"
    theme_color: "#01132D"

flutter:
  uses-material-design: true
  generate: false
  # Login v2 design-preview logo (Figma KSA-Project 168:2800 — D-358).
  # D-373: assets/videos/ carries the onboarding background clips
  # (onboard_01..03.mp4 — the same hero clip ×3 until the owner supplies
  # the real 2nd/3rd videos; replace in place).
  assets:
    - assets/images/
    - assets/videos/
    - assets/icons/
  # Mockup typography — IBM Plex Sans Arabic (the Mockup.html app font, OFL),
  # bundled as an asset so it renders offline + deterministically on every
  # platform incl. web (no runtime font fetch). Applied app-wide by SimfTheme
  # via `fontFamily` so the UI matches the approved design (D-329).
  fonts:
    # SIMF brand identity font (owner 2026-06-27): FS Albert Arabic — the same
    # type family the Website ships (wwwroot/assets/fonts). Bundled here so the
    # app's Arabic + Latin text matches the brand identity. Five weights ship
    # (100/300/400/700/800 — no 500/600; Flutter maps the nearest). Applied
    # app-wide by SimfTheme via `fontFamily`; Cairo stays the glyph fallback.
    - family: FSAlbertArabic
      fonts:
        - asset: assets/fonts/fs-albert-arabic-web-thin.ttf
          weight: 100
        - asset: assets/fonts/fs-albert-arabic-web-light.ttf
          weight: 300
        - asset: assets/fonts/fs-albert-arabic-web-regular.ttf
          weight: 400
        - asset: assets/fonts/fs-albert-arabic-web-bold.ttf
          weight: 700
        - asset: assets/fonts/fs-albert-arabic-web-extrabold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # KSA-Project Figma type (D-454): Inter for Latin, Cairo for Arabic. Both
    # are variable fonts (the wght axis) — Flutter maps fontWeight onto it.
    # SimfTheme uses Inter with Cairo as the fallback so Arabic glyphs (absent
    # from Inter) render in Cairo automatically.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
