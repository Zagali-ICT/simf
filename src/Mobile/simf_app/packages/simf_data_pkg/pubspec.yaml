name: simf_data_pkg
description: SIMF mobile — centralised HTTP layer. The single dio client, the standard interceptors, ApiResult<T>, ApiFailure, secure and preferences storage. The only place in the codebase that knows about HTTP. See SIMF-MAA-001 v1.2 section 9.1.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  # 5.10 is the floor, not a preference: simf_api_client.dart matches on
  # DioExceptionType.transformTimeout, which does not exist before it.
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^9.2.2
  meta: ^1.16.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.3.0

flutter:
