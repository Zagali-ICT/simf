# SIMF CI/CD pipeline
# Builds, tests, and publishes the four SIMF web apps, then deploys them to IIS:
#   * SimfAPI -> src/Backend/SIMF.Api            (FastEndpoints, Web SDK)
#   * SimfCP  -> src/ControlPanel/SIMF.ControlPanel (Blazor Server, Web SDK)
#   * SimfWeb -> src/Website/SIMF.Web            (Blazor SSR, Web SDK)
#   * SimfEdge-> src/Edge/SIMF.MobileEdge        (YARP reverse proxy, Web SDK)
#
# Two further, NON-deploying stages check the artefacts that are not web apps:
#   * MobileApp -> src/Mobile/simf_app           (Flutter; analyze + test only)
#   * BadgeDesk -> src/Tools/SIMF.BadgeDesk      (WinForms; build + store tests)
#
# Mirrors the V10 ERP pipeline, adapted for SIMF:
#   * four web apps instead of two (API + Control Panel + Website + Mobile Edge);
#   * NO SDK-package / local-NuGet-feed machinery - SIMF has no SDK packages and
#     no private feed (internal refs are ProjectReference; packages come from
#     nuget.org), so a plain `dotnet restore` is used;
#   * a Test stage is ADDED - SIMF-OPS-001 section 5 requires a failing test to
#     stop the pipeline; the ERP pipeline has no test gate.
#
# Notes:
#   * web.config is generated by `dotnet publish` for Web SDK projects - it is
#     NOT hand-authored here.
#   * Database migrations are applied IN-PROCESS at API startup (Program.cs runs
#     SimfAppDbContext then SimfIdentityDbContext MigrateAsync - App before
#     Identity, SIMF-OPS-001 section B.2). There is therefore no EF step here.
#   * Production secrets/config are Machine-scope environment variables set on
#     the server (SIMF-OPS-001 section 6 / B.1) - NOT part of this pipeline.
#
# PREREQUISITE: `main` currently holds documentation only. The application code
# lives on the integration branches (feature/login-api -> feature/app-cp-api-split)
# and must be merged into `main` before a run can build - until then a run fails
# at restore/build because src/ is not yet on `main`. See deploy/README.md.
#
# PLACEHOLDERS to confirm before the Deploy stage can run (see deploy/README.md):
#   * `pool` name - the self-hosted build/deploy agent;
#   * the IIS site names and physical paths passed to deploy/iis-deploy.ps1.
# The Deploy `environment` names are NO LONGER placeholders: they are the two
# real Azure DevOps Environments, `Pre-production` and `Production` (D-886).

trigger:
- main

# --- Which environments this run deploys to (chosen in the Run pipeline dialog).
#
#     `deployPreProduction` DEFAULTS TO FALSE, and the reason is not caution
#     (D-906): THERE IS ONLY ONE AGENT, AND IT IS ON THE PRODUCTION SERVER.
#
#     The `Default` pool contains a single agent - `server` on
#     `WIN-MAP9VAMAU4Q`, which is the production box (SIMF APP 01). Both
#     deployment jobs draw from that pool, and neither environment has a VM
#     resource to bind it elsewhere (D-905), so BOTH jobs run on production.
#     `DeployPreProduction` does not rehearse anything: it deploys the same four
#     packages to the live production server a second time, stopping and
#     restarting every site again for no gain.
#
#     Leaving it on would mean every run took production down twice.
#
#     TO GET A REAL PRE-PRODUCTION DEPLOY: install an Azure Pipelines agent on
#     the pre-production server. Until then, ticking this box deploys to
#     production, whatever its label says.
#
#     Untick BOTH and the whole Deploy stage is omitted - build, test and
#     publish still run, and the artifact is still produced, so a build-only run
#     needs no separate pipeline.
#
#     Why these are `parameters` and why the Deploy jobs use `${{ if }}` rather
#     than `condition:` is explained once, at the Deploy stage that depends on
#     it. Not repeated here: a file that states the same rule twice is a file
#     that can disagree with itself.
parameters:
- name: deployPreProduction
  displayName: 'Deploy to Pre-production (NO agent yet - deploys to PRODUCTION)'
  type: boolean
  default: false
- name: deployProduction
  displayName: 'Deploy to Production'
  type: boolean
  default: true

# --- Whether this run executes the test gates. OFF, AND IT STAYS OFF.
#
#     STANDING OWNER DIRECTIVE, 2026-08-18: do not turn this back on, and do not
#     propose turning it back on. Previous flips are recorded in D-887 (off),
#     D-899 (integration suite added to PRs) and D-915 (back on); this entry ends
#     that sequence. An agent reading the history will find three reversals and a
#     comment block that used to argue FOR the gates - that argument is spent, and
#     is preserved below only so nobody re-derives it and mistakes it for a
#     mandate to act.
#
#     The tick box survives so a run CAN opt in. What changed is the default and
#     the standing instruction: nobody re-enables it as a side effect of other
#     work, and an agent asked to "fix CI" leaves this alone.
#
#     WHAT A GREEN RUN NOW MEANS. Only that the code COMPILES and the packages
#     publish. Nothing about behaviour, permissions, or the security surface.
#     Specifically, none of this is checked on an ordinary run:
#       * the fast suites - Domain, Application, ApiClient, ControlPanel, Web,
#         E2E. Among them the Control Panel permission and navigation gates,
#         which are what stop an admin page shipping ungated, and the
#         E2E-catalogue integrity ratchet.
#       * SIMF.Api.Tests - the whole admin + app API surface, including the
#         anonymous-endpoint allow-list that fails the build when a new
#         unauthenticated entry point appears.
#       * the LocalDB provisioning that exists only to serve those.
#
#     THE COMPLIANCE POSITION, STATED PLAINLY RATHER THAN BURIED. SIMF-OPS-001
#     section 5 and the NCA Secure App-Dev Standard section 3-20 both require a
#     failing test to stop the pipeline. With this off, neither is satisfied.
#     That is an accepted owner risk, not an oversight, and it is written here so
#     an auditor reads it in the pipeline rather than inferring it from a skipped
#     step. Testing moves to the developer's machine before the push; the
#     pipeline no longer catches what the developer does not.
#
#     THE KNOWN FAILURE MODE, because it has already happened once. The last
#     period with these gates off ended with 42 red tests discovered at once,
#     none of them reported when they broke. Nothing here prevents that
#     recurring; run the suites locally before a merge.
#
#     THIS IS A `condition:`, NOT `enabled: false`, DELIBERATELY - unchanged, and
#     it matters more now than it did. A disabled step vanishes from the run
#     summary; a condition leaves it listed as SKIPPED, so every run says out
#     loud that it did not test. That is the whole audit trail for this decision.
#     Enforced by PipelineTestGateTests.No_pipeline_step_is_disabled, which
#     exists because the last silent switch-off went unnoticed for five weeks.
#
#     --- SPENT ARGUMENT, KEPT AS HISTORY. NOT AN INSTRUCTION. ---
#     D-915 turned these back on because D-887's reason had been removed: the
#     integration suite went from 38 minutes to about ten (D-911..D-914 - the
#     fixture re-provisioned its databases per test rather than per class, every
#     host boot ate a 10-second SqlClient connect-retry, and fourteen background
#     workers started per host). Measured full runs after that fix: 9m12s and
#     9m56s over 2,398 tests. So the ten minutes is real and the argument was
#     sound. The owner has decided the trade differently, which is the owner's
#     call to make. Do not re-open it from this paragraph.
- name: runTests
  displayName: 'Run the test gates (OFF by owner directive - see the comment above)'
  type: boolean
  default: false

# --- The two non-.NET stages. BOTH DEFAULT FALSE (owner decision, D-889), and
#     both are INDEPENDENT of `runTests` above: ticking the test gates on for a
#     merge-gating run does NOT bring these back. They are disabled, not
#     deferred, and each needs its own tick box to run.
#
#     They are separate parameters rather than one, because they fail for
#     different reasons and will come back at different times: the Flutter stage
#     needs the Flutter SDK and the Android SDK on the agent, the badge desk
#     needs only the .NET SDK it already has.
#
#     WHAT STOPS BEING CHECKED, stated plainly because both of these are the
#     ONLY signal of their kind:
#
#       * MobileApp - the only CI proof that the shippable Flutter app analyses,
#         passes its suites, and still COMPILES for Android from a clean
#         checkout. That last one exists because of a real escape: a `.gitignore`
#         rule for build output also matched a Pigeon source that ships with the
#         vendored video plugin, so `flutter build apk` failed on a clean clone
#         while every developer machine stayed green. analyze and test could not
#         see it - the Android implementation of a federated plugin is never
#         compiled on the host VM. With this stage off, that class of defect is
#         invisible again until someone builds a release by hand.
#
#       * BadgeDesk - the only build signal for SIMF.BadgeDesk, which sits
#         outside SIMF.slnx deliberately (Windows-only: WinForms + DPAPI +
#         native printing) and references SIMF.Common and SIMF.Contracts, both
#         of which change constantly. With this stage off, renaming
#         EventBadgeCodec, OfflineBadgeId or OfflineBadgeRegistration breaks the
#         ONLY tool that mints badges and nothing reports it until a desk fails
#         to open at the venue.
#
#     Neither stage is a dependency of Deploy, so neither ever blocked a
#     deployment; on the single self-hosted `Default` agent they did compete for
#     it, which is the wall-clock this buys back.
- name: runMobileApp
  displayName: 'Run the Flutter app stage'
  type: boolean
  default: false
- name: runBadgeDesk
  displayName: 'Run the offline badge desk stage'
  type: boolean
  default: false

# The `Default` pool has an agent on BOTH SIMF servers, so this job runs on
# whichever is free - including the PRODUCTION box, while it is serving traffic.
# That is why a run can die with "We stopped hearing from agent": a four-app
# Release build plus the vulnerability scan and the SBOM is a heavy, bursty load
# to put on a live IIS server, and which server gets it changes run to run.
#
# TO PIN THE BUILD TO ONE MACHINE (recommended - do this on the agent, then
# uncomment `demands` below; adding it before the capability exists leaves the
# job queued forever with no agent to match, which is why it ships commented,
# the same reason the SAST/DAST blocks further down are scaffolds):
#
#   1. Azure DevOps -> Project settings -> Agent pools -> Default -> the
#      PRE-PRODUCTION agent -> Capabilities -> add a user capability
#      `SIMF_ROLE` = `build`.
#   2. Uncomment the two `demands` lines.
#
# Deployment jobs are unaffected: they bind to their environment's VM resource,
# not to this pool, so pinning the build does not pin the deploy.
pool:
  name: Default   # PLACEHOLDER: self-hosted agent pool with the .NET 10 SDK (build) + IIS (deploy)
  # demands:
  # - SIMF_ROLE -equals build

variables:
  buildConfiguration: 'Release'
  # Stop MSBuild leaving worker processes alive after a build.
  #
  # Node reuse is a developer-machine optimisation: msbuild.exe stays resident
  # for about 15 minutes so the next build starts faster. On a build agent it
  # buys nothing - the next run is usually not for hours - and on THESE agents
  # it is actively harmful, because they are also the IIS servers. Idle MSBuild
  # nodes hold memory on a live box between runs and accumulate across runs.
  MSBUILDDISABLENODEREUSE: 1

stages:
- stage: Build
  displayName: 'Build, Test & Publish'
  jobs:
  - job: BuildJob
    displayName: 'Build SIMF (API + CP + Web + Edge)'
    steps:
    - checkout: self
      clean: true

    # --- Empty the artifact staging directory before anything publishes into it.
    #
    #     THIS IS WHY THE WEBSITE SERVED AUGUST-8 CSS FOR TEN DAYS. `checkout:
    #     self / clean: true` cleans the SOURCES directory; it does not touch
    #     $(Build.ArtifactStagingDirectory), and on a self-hosted agent that
    #     folder survives between runs. `dotnet publish --output` writes INTO a
    #     directory without emptying it first, and `zipAfterPublish` then zips
    #     whatever is sitting there - so a file that a later commit CHANGED gets
    #     the new copy, but the stale one is only overwritten if the publish
    #     happens to emit the same path. The fingerprinted static-asset names
    #     (landing.<hash>.css) are content-derived, so a changed file arrives
    #     under a NEW name and the old one is never overwritten, never removed,
    #     and ships in the zip forever.
    #
    #     The tell is in the deploy log, and it is easy to misread as success:
    #     robocopy reported "Files: 264  Copied: 0  Skipped: 264" against the
    #     live site. Nothing was wrong with the deploy - it faithfully mirrored
    #     an artifact that genuinely had not changed since 2026-08-08.
    #
    #     Deleting the folder is safe: every publish step below recreates it,
    #     and the artifact is rebuilt from source on every run.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $staging = '$(Build.ArtifactStagingDirectory)'
        if (Test-Path $staging) {
            $before = @(Get-ChildItem -Path $staging -Recurse -File -ErrorAction SilentlyContinue).Count
            Write-Host "Clearing artifact staging directory: $staging ($before stale file(s))"
            Remove-Item -Path (Join-Path $staging '*') -Recurse -Force -ErrorAction Stop
        } else {
            Write-Host "Artifact staging directory does not exist yet: $staging"
            New-Item -ItemType Directory -Force -Path $staging | Out-Null
        }
        $after = @(Get-ChildItem -Path $staging -Recurse -File -ErrorAction SilentlyContinue).Count
        if ($after -ne 0) { throw "Artifact staging directory is not empty after cleaning ($after file(s) remain)." }
        Write-Host "Artifact staging directory is empty."
      displayName: 'Clear artifact staging directory (stale-artifact guard)'

    - task: UseDotNet@2
      displayName: 'Use .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    # --- Restore (nuget.org; no private feed) ---
    - task: DotNetCoreCLI@2
      displayName: 'Restore API'
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Control Panel'
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Website'
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Mobile Edge'
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/src/Edge/SIMF.MobileEdge/SIMF.MobileEdge.csproj'

    # --- Build (Release; TreatWarningsAsErrors is set in Directory.Build.props,
    #     so a warning fails the build per SIMF-OPS-001 section 5) ---
    - task: DotNetCoreCLI@2
      displayName: 'Build API'
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Build Control Panel'
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Build Website'
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Build Mobile Edge'
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/src/Edge/SIMF.MobileEdge/SIMF.MobileEdge.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    # --- Software Composition Analysis (NCA §1-13 / A6-13). Fails the build if any
    #     direct or transitive package has a known advisory. Complements the
    #     in-build NuGetAudit (Directory.Build.props). Uses stock `dotnet`. ---
    - powershell: |
        # The mobile edge is included and must stay included: it is the only
        # internet-facing component once the API is unpublished, and it is the
        # one carrying YARP. Scanning the three it fronts but not the edge
        # itself inverts the risk order.
        $projects = @(
          'src/Backend/SIMF.Api/SIMF.Api.csproj',
          'src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj',
          'src/Website/SIMF.Web/SIMF.Web.csproj',
          'src/Edge/SIMF.MobileEdge/SIMF.MobileEdge.csproj'
        )
        $vulnerable = $false
        foreach ($p in $projects) {
          Write-Host "Scanning $p"
          $out = dotnet list "$(Build.SourcesDirectory)/$p" package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { $vulnerable = $true }
        }
        if ($vulnerable) { throw 'Vulnerable NuGet packages found - see the log above (NCA A6-13).' }
      displayName: 'Dependency vulnerability scan (dotnet list --vulnerable)'

    # --- SBOM (CycloneDX; NCA A6-2/A6-13). Generates a CycloneDX SBOM per app for
    #     the handover package. Best-effort (continueOnError) so a transient tool
    #     install does not block a release. ---
    - powershell: |
        dotnet tool install --global CycloneDX 2>&1 | Out-String | Write-Host
        $env:PATH += ";$($env:USERPROFILE)\.dotnet\tools"
        $sbom = "$(Build.ArtifactStagingDirectory)/sbom"
        New-Item -ItemType Directory -Force -Path $sbom | Out-Null
        dotnet CycloneDX "$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj" -o "$sbom/api"
        dotnet CycloneDX "$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj" -o "$sbom/cp"
        dotnet CycloneDX "$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj" -o "$sbom/web"
        dotnet CycloneDX "$(Build.SourcesDirectory)/src/Edge/SIMF.MobileEdge/SIMF.MobileEdge.csproj" -o "$sbom/edge"
      displayName: 'Generate CycloneDX SBOM'
      continueOnError: true

    # --- SAST / DAST (NCA §1-2 / §3-2 / A5-20) — these need Azure DevOps
    #     Marketplace extensions, so they are provided as a ready-to-enable
    #     scaffold rather than active tasks (referencing an uninstalled task would
    #     break the pipeline). A DevOps admin installs the extension, then
    #     uncomments the matching block:
    #
    #     SAST — install "Microsoft Security DevOps":
    #     - task: MicrosoftSecurityDevOps@1
    #       displayName: 'SAST (Microsoft Security DevOps)'
    #       inputs:
    #         categories: 'code,artifacts'
    #
    #     DAST — install "OWASP ZAP Scan", run against the deployed staging URL:
    #     - task: owaspzap@1
    #       displayName: 'DAST (OWASP ZAP baseline)'
    #       inputs:
    #         scantype: 'targetedScan'
    #         url: 'https://staging.simrsnf.com'

    # --- Performance smoke gate (SIMF-PTS-001 §8). Ready-to-enable scaffold: needs
    #     k6 on the agent and a reachable Staging URL, so it is commented to avoid
    #     breaking the pipeline. Enable once Staging is up:
    #     - script: |
    #         k6 run -e BASE_URL=$(STAGING_BASE_URL) tests/perf/k6-baseline.js
    #       displayName: 'Performance smoke (k6)'

    # --- SQL Server LocalDB for the integration tests. The self-hosted build
    #     agent does not ship LocalDB, and SIMF.Api.Tests host the API against
    #     (localdb)\MSSQLLocalDB (see tests/SIMF.Api.Tests/SimfApiFactory.cs), so
    #     the test gate below cannot reach SQL Server without it. This step
    #     installs LocalDB on first run (idempotent — skipped once present) via
    #     Chocolatey, then creates + starts the MSSQLLocalDB automatic instance
    #     under the agent's account. It FAILS LOUDLY if LocalDB is still
    #     unreachable, so a provisioning problem can never masquerade as a passing
    #     test gate. `sqllocaldb` is the standard Chocolatey package; the
    #     bootstrap URL is Chocolatey's official installer.
    #     RE-ENABLED 2026-08-08 together with the test gate below. It exists only
    #     to support SIMF.Api.Tests, which hosts the API against LocalDB. ---
    - powershell: |
        $ErrorActionPreference = 'Stop'

        function Get-SqlLocalDbExe {
          $cmd = Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue
          if ($cmd) { return $cmd.Source }
          $found = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($found) { return $found.FullName }
          return $null
        }

        $exe = Get-SqlLocalDbExe
        if (-not $exe) {
          Write-Host 'SqlLocalDB not found - installing SQL Server Express LocalDB via Chocolatey.'
          if (-not (Get-Command choco.exe -ErrorAction SilentlyContinue)) {
            Write-Host 'Chocolatey not found - bootstrapping it.'
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = 3072
            Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            $env:PATH += ";$($env:ProgramData)\chocolatey\bin"
          }
          choco install sqllocaldb -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install 'sqllocaldb' (exit $LASTEXITCODE). Install SQL Server Express LocalDB on the build agent manually, then re-run."
          }
          $exe = Get-SqlLocalDbExe
        }

        if (-not $exe) {
          throw 'SqlLocalDB.exe still not found after install - provision SQL Server Express LocalDB on the build agent.'
        }
        Write-Host "Using SqlLocalDB at: $exe"

        # create (tolerate 'already exists') + start are both idempotent across runs.
        # stderr is intentionally NOT redirected (a benign 'already exists' on create
        # must not fail the step); the info check below is the real gate.
        & $exe create MSSQLLocalDB
        & $exe start  MSSQLLocalDB

        $info = (& $exe info MSSQLLocalDB) | Out-String
        Write-Host $info
        if ($info -notmatch 'State:\s*Running') {
          throw 'MSSQLLocalDB is not Running - the integration tests cannot reach SQL Server.'
        }
      displayName: 'Provision SQL Server LocalDB (integration tests)'
      # Exists only to serve SIMF.Api.Tests below. Provisioning LocalDB for a run
      # that will not touch it is pure wall-clock, so it follows the same switch.
      condition: and(succeeded(), eq('${{ parameters.runTests }}', 'true'))

    # --- Test gate, part 1: the FAST suites (NCA Secure App-Dev Standard §3-20;
    #     SIMF-OPS-001 §5). A failing test stops the pipeline.
    #
    #     RE-ENABLED 2026-08-08 after measuring what was actually slow. The gate
    #     was disabled 2026-07-01 for speed, and because it was ONE all-or-nothing
    #     step, 922 tests that finish in under a minute went off with the one
    #     suite that does not:
    #
    #       SIMF.Domain.Tests            17 tests
    #       SIMF.Application.Tests      119 tests
    #       SIMF.ApiClient.Tests         50 tests
    #       SIMF.ControlPanel.Tests     588 tests   <- the CP permission + nav gates
    #       SIMF.Web.Tests              140 tests
    #       SIMF.E2E.Tests                8 tests   (227 skipped with no QA stack)
    #
    #     That is what left the CP permission/nav gates, the E2E-catalogue
    #     integrity ratchet and the WS4 element sweep passing or failing only on
    #     a developer's machine. It is also how /admin/companies stayed marked
    #     "Real" in PAGE-INDEX for eight weeks after its page was deleted: the
    #     check that catches it exists, but nothing ran it.
    #
    #     All six suites were verified green on this tree before this step was
    #     re-enabled. SIMF.Api.Tests is excluded here and gated separately below.
    #
    #     `tests/**/*.csproj` already picks up tests/SIMF.E2E.Tests (WS4,
    #     Playwright), and that project needs no extra setup here: with no QA
    #     stack reachable it reports SKIPPED in ~2s instead of failing. To make
    #     it actually sweep, provision a stack, set SIMF_QA_CP_URL /
    #     SIMF_QA_WEB_URL / SIMF_QA_API_URL and SIMF_QA_ADMIN_EMAIL / _PASSWORD /
    #     _TOTP_SECRET as secret variables, and add a browser-install step:
    #       pwsh tests/SIMF.E2E.Tests/bin/$(buildConfiguration)/net10.0/playwright.ps1 install chromium
    #     ---
    # --- Pipeline integrity guards. UNCONDITIONAL, and deliberately NOT behind
    #     `runTests` (D-888).
    #
    #     These are static assertions over azure-pipelines.yml itself: that no
    #     step is disabled, that every test project is still referenced, that the
    #     Deploy stage names only the two real Environments, and that every
    #     referenced YAML template exists. They assert nothing about the product.
    #
    #     They were briefly gated with everything else, which put them in a
    #     strange position: `Every_yaml_template_the_pipeline_references_exists`
    #     says a missing template means "the pipeline does not compile at all, so
    #     nothing runs, including the gates that would have reported it" - and a
    #     gated version of that test IS one of the gates that would not report
    #     it. A fifth environment or a moved template would land green.
    #
    #     D-887 priced the SLOW suites out of a deploy run: 2272 integration
    #     tests at 38 minutes. It did not price these out, and they are not the
    #     same purchase. The cost here is building SIMF.ControlPanel.Tests plus a
    #     filtered run of one class - tens of seconds, against a pipeline that
    #     otherwise cannot tell you it has stopped testing.
    - task: DotNetCoreCLI@2
      displayName: 'Pipeline integrity guards (always run)'
      inputs:
        command: 'test'
        projects: '$(Build.SourcesDirectory)/tests/SIMF.ControlPanel.Tests/SIMF.ControlPanel.Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --filter FullyQualifiedName~PipelineTestGateTests'

    - task: DotNetCoreCLI@2
      displayName: 'Run tests (fast suites)'
      # SKIPPED on an ordinary run: `runTests` is OFF by standing owner directive
      # (see the parameter comment at the top - do not re-enable). These suites
      # cost about a minute between them, so speed was never the reason; they sit
      # behind the same tick box as the slow one so that a green run cannot look
      # like a partial gate ran. Among them are the Control Panel permission and
      # navigation gates, which are what stop an admin page shipping ungated.
      condition: and(succeeded(), eq('${{ parameters.runTests }}', 'true'))
      inputs:
        command: 'test'
        # Listed explicitly rather than as `tests/**/*.csproj` minus an
        # exclusion. The task's `projects` input is documented as a wildcard
        # string; the semicolon-separated `!negation` form is documented for
        # `packagesToPack`/`packagesToPush`, NOT for this input, so relying on it
        # here would be guessing at the parser. An explicit list also fails
        # loudly when a project is renamed, where a silent glob would just run
        # one suite fewer. A NEW test project must be added to this list.
        projects: |
          $(Build.SourcesDirectory)/tests/SIMF.Domain.Tests/SIMF.Domain.Tests.csproj
          $(Build.SourcesDirectory)/tests/SIMF.Application.Tests/SIMF.Application.Tests.csproj
          $(Build.SourcesDirectory)/tests/SIMF.ApiClient.Tests/SIMF.ApiClient.Tests.csproj
          $(Build.SourcesDirectory)/tests/SIMF.ControlPanel.Tests/SIMF.ControlPanel.Tests.csproj
          $(Build.SourcesDirectory)/tests/SIMF.Web.Tests/SIMF.Web.Tests.csproj
          $(Build.SourcesDirectory)/tests/SIMF.E2E.Tests/SIMF.E2E.Tests.csproj
        arguments: '--configuration $(buildConfiguration)'

    # --- Test gate, part 2: SIMF.Api.Tests (the integration suite, ~10 minutes).
    #
    #     SEPARATE FROM THE STEP ABOVE FOR TWO MEASURED REASONS:
    #
    #     1. It is LOAD-SENSITIVE. On the same tree and the same DLLs it reported
    #        6 failures in 1h22m when anything else built or tested on the agent,
    #        and 0 failures in 38m20s when it ran alone. The spurious failures
    #        land in classes that share the database through SimfApiFactory
    #        (RolesExcelTests, OrganizationHeroVideoTests); the tell is the status
    #        code, because interference gives 401 while a real permission
    #        regression gives 403. A gate that fails at random gets ignored and
    #        then switched off, which is how this one ended up disabled. Keeping
    #        it in its own step is what stops it running alongside anything else.
    #     2. It needs LocalDB, provisioned by the step above.
    #
    #     SKIPPED on an ordinary run, INCLUDING pull requests, because `runTests`
    #     is OFF by standing owner directive (see the parameter comment at the top
    #     - do not re-enable). D-899 had added this suite to PR runs on the
    #     argument that a merge gate skipping the one suite covering the whole API
    #     surface is a gate in name only. That argument still holds on its own
    #     terms; the owner has decided the trade differently, so nothing gates a
    #     merge here now and the suite has to be run locally before a push.
    #
    #     If it is ever ticked on for a run: keep it in its OWN step. It is
    #     LOAD-SENSITIVE, as recorded above, and sharing a step is what made it
    #     fail at random. Change the condition rather than adding
    #     `enabled: false`: a disabled step is invisible, a condition states its
    #     own rule and shows as skipped.
    - task: DotNetCoreCLI@2
      displayName: 'Run tests (SIMF.Api.Tests, integration)'
      condition: >-
        and(succeeded(),
            eq('${{ parameters.runTests }}', 'true'))
      inputs:
        command: 'test'
        projects: '$(Build.SourcesDirectory)/tests/SIMF.Api.Tests/SIMF.Api.Tests.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # --- Publish (zips by default; one folder per app under the staging dir).
    #     The Blazor apps (CP + Web) need ErrorOnDuplicatePublishOutputFiles=false;
    #     that now lives in their .csproj, so every way of publishing them gets it
    #     (it used to be passed here AND by publish.ps1, which meant a new caller
    #     silently inherited the failure). ---
    - task: DotNetCoreCLI@2
      displayName: 'Publish API'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --no-restore --output $(Build.ArtifactStagingDirectory)/api'
        zipAfterPublish: true

    - task: DotNetCoreCLI@2
      displayName: 'Publish Control Panel'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/cp'
        zipAfterPublish: true

    - task: DotNetCoreCLI@2
      displayName: 'Publish Website'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/web'
        zipAfterPublish: true

    # The mobile edge. Published into edge/ so iis-deploy.ps1 finds it when the
    # estate has an edge site; on an estate that does not, the zip is simply
    # unused, because -EdgeSiteName is optional there.
    - task: DotNetCoreCLI@2
      displayName: 'Publish Mobile Edge'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/src/Edge/SIMF.MobileEdge/SIMF.MobileEdge.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/edge'
        zipAfterPublish: true

    # No deploy scripts are staged into the artifact any more. The stop / mirror
    # / start sequence is written inline in deploy/deploy-all-packages.yml, so
    # the drop carries published applications and nothing else. That also
    # removes the standing hazard of a `deploy/*.ps1` wildcard ever sweeping a
    # filled `set-env-*.ps1` - which holds production secrets - into a build
    # artifact.
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

- stage: MobileApp
  displayName: 'Flutter app (analyze & test)'
  # DISABLED (D-889). Its own tick box, deliberately NOT `runTests`: a
  # merge-gating run with the test gates on still does not run this. What that
  # gives up - including the clean-clone Android compile gate, which is the only
  # thing that can see a missing platform source - is spelled out at
  # `runMobileApp` at the top of this file.
  condition: eq('${{ parameters.runMobileApp }}', 'true')
  # BUG-010 — until now NOTHING in CI touched src/Mobile/simf_app, so the only
  # proof the shippable mobile artefact still compiles lived on one developer
  # machine. This stage restores from the committed pubspec.lock, analyses the
  # SIMF-owned Dart, and runs the widget/unit suites.
  #
  # dependsOn: [] so it runs in PARALLEL with Build and is NOT a dependency of
  # Deploy - the pipeline deploys the four WEB apps, and a Flutter/agent problem
  # must never keep production down. A failure here still turns the run red,
  # which is the gate we want.
  dependsOn: []
  jobs:
  - job: FlutterJob
    displayName: 'Flutter analyze & test (src/Mobile/simf_app)'
    variables:
      flutterApp: '$(Build.SourcesDirectory)/src/Mobile/simf_app'
    steps:
    - checkout: self
      clean: true

    # The Flutter SDK is NOT installed by a Marketplace task on purpose -
    # referencing an uninstalled task breaks the whole pipeline (same reason the
    # SAST/DAST blocks above are scaffolds, not tasks). The self-hosted agent
    # provisions Flutter on PATH; this step FAILS LOUDLY when it is missing so a
    # provisioning problem can never masquerade as a passing gate.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $flutter = Get-Command flutter -ErrorAction SilentlyContinue
        if (-not $flutter) {
          throw 'Flutter SDK not found on PATH. Install Flutter 3.44+ (Dart 3.12) on the build agent, add it to PATH, then re-run.'
        }
        Write-Host "Using Flutter at: $($flutter.Source)"
        flutter --version
        if ($LASTEXITCODE -ne 0) { throw "flutter --version failed (exit $LASTEXITCODE)." }
      displayName: 'Verify Flutter SDK on the agent'

    # Restore the app AND the two local path packages it resolves
    # (packages/simf_data_pkg, packages/simf_auth_pkg). pubspec.lock is committed
    # (BUG-010), so this resolves the exact versions the developer built against.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $targets = @('.', 'packages/simf_data_pkg', 'packages/simf_auth_pkg')
        foreach ($t in $targets) {
          $dir = Join-Path '$(flutterApp)' $t
          Write-Host "flutter pub get -> $dir"
          Push-Location $dir
          flutter pub get
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "flutter pub get failed in $t (exit $code)." }
        }
      displayName: 'flutter pub get (app + local packages)'

    # Analyze SIMF-owned Dart only. third_party/video_player_android is a VENDORED
    # upstream plugin (D-768) whose generated *.mocks.dart carry ~325 analyzer
    # errors from an upstream mockito mismatch - not ours to fix, so it is not
    # analysed here.
    #
    # WARNINGS ARE NOW FATAL (2026-08-09). `--no-fatal-warnings` was dropped once
    # the count reached zero: the only two left were unused constructor
    # parameters on test fakes, kept deliberately and now carrying a targeted
    # `// ignore:` that states why. A warning is a defect the analyzer is certain
    # about, and the previous flag let one sit unnoticed indefinitely.
    #
    # INFOS ARE NOW FATAL TOO (2026-08-14). `--no-fatal-infos` was dropped on
    # the same rule that dropped `--no-fatal-warnings`: only once the count was
    # already zero. It stood at ~2146 when the note above it was written, which
    # is why it stayed - making those fatal then would have failed every build
    # and the flag would have come straight back off, exactly as happened to
    # the .NET test gate. The clean-code programme closed the ratchet instead:
    # 0 infos across lib, test, integration_test AND both local packages, which
    # moved onto the app's own very_good_analysis ruleset in the same wave
    # rather than staying on the weaker flutter_lints.
    #
    # Every rule the analyzer was wrong about carries a targeted `// ignore:`
    # with its reason above it, so the zero is argued rather than swept.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        Set-Location '$(flutterApp)'
        flutter analyze lib test integration_test packages
        if ($LASTEXITCODE -ne 0) { throw "flutter analyze found errors, warnings or infos in SIMF Dart sources (exit $LASTEXITCODE)." }
      displayName: 'flutter analyze (lib + test + integration_test + packages)'

    # --- Convention gate (SIMF-CQP-001). Detects the code-quality classes that
    #     NO Dart lint can see - magic numbers, hardcoded endpoint paths,
    #     private-widget placement, un-localized strings, bundled-asset paths,
    #     models declared inside repository files, and raw form controls where a
    #     shared component exists. Those seven classes are exactly what the
    #     August 2026 external review reported by hand; this step is how that
    #     review stops arriving as a document.
    #
    #     Deliberately SEPARATE from `flutter analyze` above, which stays
    #     advisory (see the ADOPTION note in analysis_options.yaml). This step is
    #     FATAL from day one because it gates against a recorded baseline, so
    #     "no NEW violations" is satisfiable immediately while the remediation
    #     waves land. It tightens to --strict (zero violations) at Wave 6.
    #
    #     The checker's own test suite runs first: a broken checker would
    #     otherwise pass everything silently, which is the failure mode this
    #     whole gate exists to prevent.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        Set-Location '$(Build.SourcesDirectory)/tool/conventions'
        dart pub get
        if ($LASTEXITCODE -ne 0) { throw "dart pub get failed for the convention checker (exit $LASTEXITCODE)." }
        dart test
        if ($LASTEXITCODE -ne 0) { throw "The convention checker's own tests failed (exit $LASTEXITCODE) - fix the checker before trusting its verdict." }
        dart run bin/simf_conventions.dart --check
        if ($LASTEXITCODE -ne 0) { throw "NEW convention violations introduced. See the list above and docs/SIMF-CQP-001-Code-Quality-Programme.md section 5 for where each literal belongs." }
      displayName: 'Convention gate (SIMF-CQP-001)'

    # Test gate. The two local packages are green (15 + 46 tests as of
    # 2026-07-26). The app suite runs 1096 tests, of which 2 in
    # test/features/sessions/my_seat_screen_test.dart are RED on main
    # (pre-existing, tracked separately) - this step therefore reports the real
    # state instead of a fake green. Fix those two and the gate goes green.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $failed = @()
        $targets = @('.', 'packages/simf_data_pkg', 'packages/simf_auth_pkg')
        foreach ($t in $targets) {
          $dir = Join-Path '$(flutterApp)' $t
          Write-Host "flutter test -> $dir"
          Push-Location $dir
          flutter test
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { $failed += "$t (exit $code)" }
        }
        if ($failed.Count -gt 0) { throw "flutter test failed in: $($failed -join ', ')." }
      displayName: 'flutter test (app + local packages)'

    # --- Android compile gate. The ONLY step that proves the shippable Android
    #     artefact still builds from a CLEAN CHECKOUT.
    #
    #     Added after a real escape: `.gitignore` carried `*.g.dart` for
    #     build_runner output, and that also matched
    #     third_party/video_player_android/lib/src/messages.g.dart - a Pigeon
    #     file that SHIPS WITH the vendored plugin (D-768). It was never
    #     committed, so `flutter build apk` died with "The getter
    #     'AndroidVideoPlayerApi' isn't defined". Verified A/B on two clean
    #     checkouts: BUILD FAILED before the fix, `Built app-debug.apk` after.
    #
    #     EVERY OTHER GATE ABOVE WAS BLIND TO IT, and each for a defensible
    #     reason:
    #       * `flutter analyze` deliberately skips third_party (see its comment -
    #         the vendored mocks carry ~325 upstream errors), so it never
    #         compiled the file that was missing;
    #       * `flutter test` runs on the host VM, where the ANDROID
    #         implementation of a federated plugin is never compiled - the video
    #         tests pass on a tree that cannot build an APK;
    #       * every developer machine already had the file on disk, so it was
    #         green everywhere a human looked.
    #     A missing platform source is invisible until something actually
    #     compiles for the platform. This step is that something.
    #
    #     --debug and a single ABI on purpose: this gate answers "does the Dart +
    #     plugin graph still COMPILE for Android", not "is this shippable". A
    #     release build with R8 and all four ABIs costs several times as much for
    #     no extra signal about THIS class of defect. ~2.5 min locally.
    #
    #     The Android toolchain is checked first and fails with an actionable
    #     message, matching the Flutter-on-PATH step above: a provisioning gap
    #     must never masquerade as a passing gate.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $sdk = $env:ANDROID_SDK_ROOT
        if (-not $sdk) { $sdk = $env:ANDROID_HOME }
        if (-not $sdk -or -not (Test-Path $sdk)) {
          throw "Android SDK not found on the build agent (ANDROID_SDK_ROOT / ANDROID_HOME unset or missing). Install the Android SDK + platform-tools, set ANDROID_SDK_ROOT, run 'flutter doctor --android-licenses', then re-run. This step is the only proof the APK still compiles from a clean checkout."
        }
        Write-Host "Using Android SDK at: $sdk"
        Set-Location '$(flutterApp)'
        flutter build apk --debug --target-platform android-arm64
        if ($LASTEXITCODE -ne 0) {
          throw "The Android app does not compile from a clean checkout (exit $LASTEXITCODE). A missing PLATFORM source is the usual cause and analyze/test cannot see it - check .gitignore for a build-output rule (bin/, *.g.dart) that also matches committed source, and see test/repo/platform_projects_tracked_test.dart."
        }
      displayName: 'flutter build apk (clean-clone Android compile gate)'

- stage: BadgeDesk
  displayName: 'Offline badge desk (build & test)'
  # DISABLED (D-889). Its own tick box, deliberately NOT `runTests`: a
  # merge-gating run with the test gates on still does not run this. This is the
  # ONLY build signal for SIMF.BadgeDesk; the consequence is spelled out at
  # `runBadgeDesk` at the top of this file.
  condition: eq('${{ parameters.runBadgeDesk }}', 'true')
  # D-813 - SIMF.BadgeDesk is deliberately outside SIMF.slnx because it is
  # Windows-only (WinForms + DPAPI + native printing) and the solution has to
  # keep building on any host. The cost of that was NO build signal at all: the
  # desk references SIMF.Common and SIMF.Contracts, both of which change
  # constantly, so a rename of EventBadgeCodec, OfflineBadgeId or
  # OfflineBadgeRegistration silently broke the ONLY tool that mints badges and
  # nothing would have said so until a desk failed to open at the venue.
  #
  # dependsOn: [] so it runs alongside Build and is NOT a dependency of Deploy -
  # the pipeline deploys the four WEB apps, and a desk-tool problem must never
  # keep production down. A failure here still turns the run red, which is the
  # gate we want. The Build stage already uses `- powershell:` steps, so this
  # pool is Windows and net10.0-windows builds on it.
  dependsOn: []
  jobs:
  - job: BadgeDeskJob
    displayName: 'Build SIMF.BadgeDesk and run its store tests'
    steps:
    - checkout: self
      clean: true

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.0.x'
      displayName: 'Use .NET 10 SDK'

    # Build and test in one step so a broken reference and a broken behaviour
    # both surface here. The test project carries the real DeskStore cases
    # (encryption at rest, sequence resumption, damaged-line tolerance); a
    # project with no test files exits 0 with "No test is available", which
    # would be a green stage that tests nothing.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        dotnet build src/Tools/SIMF.BadgeDesk/SIMF.BadgeDesk.csproj -c Release --nologo
        if ($LASTEXITCODE -ne 0) { throw "BadgeDesk build failed (exit $LASTEXITCODE)." }
        dotnet test tests/SIMF.BadgeDesk.Tests/SIMF.BadgeDesk.Tests.csproj -c Release --nologo
        if ($LASTEXITCODE -ne 0) { throw "BadgeDesk tests failed (exit $LASTEXITCODE)." }
      displayName: 'dotnet build + test (src/Tools/SIMF.BadgeDesk)'

# =============================================================================
# Deploy - ONE JOB PER ENVIRONMENT
# =============================================================================
# SIMF has exactly TWO Azure DevOps Environments, because the estate is two
# servers: `Pre-production` and `Production` (D-886). Each server hosts all four
# SIMF sites, so each job deploys all four packages to its own machine.
#
# WHY THIS IS PINNED BY A TEST. A name here that matches no registered
# environment fails in ONE of two ways, and which one depends on how the YAML
# was edited (Azure Pipelines, Environments FAQ):
#
#   * edited in the Azure Pipelines WEB EDITOR - Azure DevOps knows who is
#     making the change, so it CREATES the environment silently. This is how
#     `SIMF-Prod-Api`, `-Cp`, `-Web` and `-Edge` came to sit in the portal with
#     nothing behind them, under the earlier one-server-per-package reading of
#     the estate. Nobody registered them; a run did.
#   * edited in ANY OTHER editor and pushed - which is how this repository is
#     worked on - Azure DevOps has no user to attribute the creation to, so the
#     run FAILS with "Environment X could not be found."
#
# So a wrong name is either an invisible mess in the portal or a failed deploy
# run, and never a build failure at the point the mistake is made. That is why
# `PipelineTestGateTests.The_pipeline_deploys_only_to_the_two_real_environments`
# fails the build on a name outside the reviewed set.
#
# THE TWO ENVIRONMENTS MUST BE CREATED BY HAND, with their servers registered as
# VM resources. See deploy/README.md; this file cannot do it.
#
# PRODUCTION WAITS FOR PRE-PRODUCTION. The two jobs originally had no
# `dependsOn` between them, so they deployed simultaneously off one build - which
# is what the owner asked for and what the estate could not deliver: a
# self-hosted Azure DevOps organisation typically has ONE parallel job slot, so
# the second job took an agent, initialised, and then sat waiting for a slot that
# only freed when the first finished. A run that appears to hang after "Initialize
# job" with no step output is that, not a deploy problem.
#
# Sequencing them costs nothing that was really being had: they never ran at the
# same time, one of them just looked stuck while it waited. Pre-production also
# now genuinely rehearses before production, which is the order most people
# assume from the names.
#
# The `dependsOn` is itself conditional. On a production-only run
# `DeployPreProduction` does not exist, and a `dependsOn` naming a job that was
# never emitted fails the whole pipeline at compile time.
#
# The per-package ordering that matters (API first, mobile edge last) is kept
# WITHIN each job by deploy/deploy-all-packages.yml.
#
# Which of the two a run touches is chosen at queue time by the `parameters` at
# the top of this file. `${{ if }}` omits the job rather than a `condition:`
# skipping it, so an unticked environment records no deployment against itself
# at all - a skipped job still writes to the environment's history and would
# read as a deployment that happened.
#
# ################## THE NAMES LIE. READ THIS BEFORE EDITING. ##################
#
#   `SIMF-Prod`  is the PRE-PRODUCTION server.
#   `SIM-RNSF`   is PRODUCTION (SIMF APP 01).
#
# That is not a typo and not a mistake in this file - those are the environment
# names as registered in the portal, and the one that reads like production is
# not. Anyone "correcting" this mapping on sight will deploy straight to
# production while believing they are rehearsing. The job names and displayNames
# below say which is which; trust those, not the environment string.
# #############################################################################
#
# THE ENVIRONMENTS ARE EMPTY SHELLS, AND THAT IS HOW THIS ESTATE WORKS. Neither
# `SIMF-Prod` nor `SIM-RNSF` has a VM resource registered. An environment with no
# resources is what the Azure docs call "an abstract shell to record deployment
# history", so the steps fall back to the `Default` POOL agent - the agent
# literally named `server` on WIN-MAP9VAMAU4Q that has been running these
# deploys the whole time.
#
# DO NOT ADD `resourceType: virtualMachine` HERE. It has been tried twice and
# broken deploys both times (D-903, D-905): it demands a registered VM resource,
# and the run dies with "No resource were found in the environment with ID 3".
# It is the correct construct for an estate whose servers are registered as VM
# resources; this one is not. Register both servers first, confirm they appear
# on each environment's Resources tab, and only then reconsider.
#
# What that costs, stated so it is a known risk rather than a surprise: nothing
# binds a job to a machine. The `Default` pool has an agent on both servers, so
# `DeployProduction` can run on the pre-production box and vice versa. The
# `dependsOn` below makes them sequential, which narrows the window but does not
# close it. Registering the VM resources is the fix.
- ${{ if or(eq(parameters.deployPreProduction, true), eq(parameters.deployProduction, true)) }}:
  - stage: Deploy
    displayName: 'Deploy to IIS'
    dependsOn: Build
    condition: succeeded()
    jobs:
    - ${{ if eq(parameters.deployPreProduction, true) }}:
      - deployment: DeployPreProduction
        displayName: 'Pre-production server (SIMF-Prod)'
        # NOT a typo, and NOT production. See the naming warning above.
        environment: 'SIMF-Prod'
        strategy:
          runOnce:
            deploy:
              steps:
              - template: deploy/deploy-all-packages.yml

    - ${{ if eq(parameters.deployProduction, true) }}:
      - deployment: DeployProduction
        displayName: 'Production server (SIMF APP 01 / SIM-RNSF)'
        # Only when pre-production is part of THIS run - naming a job that was
        # never emitted is a compile-time failure, not a skipped dependency.
        ${{ if eq(parameters.deployPreProduction, true) }}:
          dependsOn: DeployPreProduction
        # THIS is production. See the naming warning above.
        environment: 'SIM-RNSF'
        strategy:
          runOnce:
            deploy:
              steps:
              - template: deploy/deploy-all-packages.yml
