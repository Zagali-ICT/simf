# SIMF CI/CD pipeline
# Builds, tests, and publishes the three SIMF web apps, then deploys them to IIS:
#   * SimfAPI -> src/Backend/SIMF.Api            (FastEndpoints, Web SDK)
#   * SimfCP  -> src/ControlPanel/SIMF.ControlPanel (Blazor Server, Web SDK)
#   * SimfWeb -> src/Website/SIMF.Web            (Blazor SSR, Web SDK)
#
# Mirrors the V10 ERP pipeline, adapted for SIMF:
#   * three web apps instead of two (API + Control Panel + Website);
#   * NO SDK-package / local-NuGet-feed machinery - SIMF has no SDK packages and
#     no private feed (internal refs are ProjectReference; packages come from
#     nuget.org), so a plain `dotnet restore` is used;
#   * a Test stage is ADDED - SIMF-OPS-001 section 5 requires a failing test to
#     stop the pipeline; the ERP pipeline has no test gate.
#
# Notes:
#   * web.config is generated by `dotnet publish` for Web SDK projects - it is
#     NOT hand-authored here.
#   * Database migrations are applied IN-PROCESS at API startup (Program.cs runs
#     SimfAppDbContext then SimfIdentityDbContext MigrateAsync - App before
#     Identity, SIMF-OPS-001 section B.2). There is therefore no EF step here.
#   * Production secrets/config are Machine-scope environment variables set on
#     the server (SIMF-OPS-001 section 6 / B.1) - NOT part of this pipeline.
#
# PREREQUISITE: `main` currently holds documentation only. The application code
# lives on the integration branches (feature/login-api -> feature/app-cp-api-split)
# and must be merged into `main` before a run can build - until then a run fails
# at restore/build because src/ is not yet on `main`. See deploy/README.md.
#
# PLACEHOLDERS to confirm before the Deploy stage can run (see deploy/README.md):
#   * `pool` name - the self-hosted build/deploy agent;
#   * the Deploy `environment` name;
#   * the IIS site names and physical paths passed to deploy/iis-deploy.ps1.

trigger:
- main

pool:
  name: Default   # PLACEHOLDER: self-hosted agent pool with the .NET 10 SDK (build) + IIS (deploy)

variables:
  buildConfiguration: 'Release'

stages:
- stage: Build
  displayName: 'Build, Test & Publish'
  jobs:
  - job: BuildJob
    displayName: 'Build SIMF (API + CP + Web)'
    steps:
    - checkout: self
      clean: true

    - task: UseDotNet@2
      displayName: 'Use .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    # --- Restore (nuget.org; no private feed) ---
    - task: DotNetCoreCLI@2
      displayName: 'Restore API'
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Control Panel'
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Website'
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj'

    # --- Build (Release; TreatWarningsAsErrors is set in Directory.Build.props,
    #     so a warning fails the build per SIMF-OPS-001 section 5) ---
    - task: DotNetCoreCLI@2
      displayName: 'Build API'
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Build Control Panel'
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Build Website'
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    # --- Software Composition Analysis (NCA §1-13 / A6-13). Fails the build if any
    #     direct or transitive package has a known advisory. Complements the
    #     in-build NuGetAudit (Directory.Build.props). Uses stock `dotnet`. ---
    - powershell: |
        $projects = @(
          'src/Backend/SIMF.Api/SIMF.Api.csproj',
          'src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj',
          'src/Website/SIMF.Web/SIMF.Web.csproj'
        )
        $vulnerable = $false
        foreach ($p in $projects) {
          Write-Host "Scanning $p"
          $out = dotnet list "$(Build.SourcesDirectory)/$p" package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { $vulnerable = $true }
        }
        if ($vulnerable) { throw 'Vulnerable NuGet packages found - see the log above (NCA A6-13).' }
      displayName: 'Dependency vulnerability scan (dotnet list --vulnerable)'

    # --- SBOM (CycloneDX; NCA A6-2/A6-13). Generates a CycloneDX SBOM per app for
    #     the handover package. Best-effort (continueOnError) so a transient tool
    #     install does not block a release. ---
    - powershell: |
        dotnet tool install --global CycloneDX 2>&1 | Out-String | Write-Host
        $env:PATH += ";$($env:USERPROFILE)\.dotnet\tools"
        $sbom = "$(Build.ArtifactStagingDirectory)/sbom"
        New-Item -ItemType Directory -Force -Path $sbom | Out-Null
        dotnet CycloneDX "$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj" -o "$sbom/api"
        dotnet CycloneDX "$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj" -o "$sbom/cp"
        dotnet CycloneDX "$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj" -o "$sbom/web"
      displayName: 'Generate CycloneDX SBOM'
      continueOnError: true

    # --- SAST / DAST (NCA §1-2 / §3-2 / A5-20) — these need Azure DevOps
    #     Marketplace extensions, so they are provided as a ready-to-enable
    #     scaffold rather than active tasks (referencing an uninstalled task would
    #     break the pipeline). A DevOps admin installs the extension, then
    #     uncomments the matching block:
    #
    #     SAST — install "Microsoft Security DevOps":
    #     - task: MicrosoftSecurityDevOps@1
    #       displayName: 'SAST (Microsoft Security DevOps)'
    #       inputs:
    #         categories: 'code,artifacts'
    #
    #     DAST — install "OWASP ZAP Scan", run against the deployed staging URL:
    #     - task: owaspzap@1
    #       displayName: 'DAST (OWASP ZAP baseline)'
    #       inputs:
    #         scantype: 'targetedScan'
    #         url: 'https://simf-staging.zagali-ict.com'

    # --- Performance smoke gate (SIMF-PTS-001 §8). Ready-to-enable scaffold: needs
    #     k6 on the agent and a reachable Staging URL, so it is commented to avoid
    #     breaking the pipeline. Enable once Staging is up:
    #     - script: |
    #         k6 run -e BASE_URL=$(STAGING_BASE_URL) tests/perf/k6-baseline.js
    #       displayName: 'Performance smoke (k6)'

    # --- SQL Server LocalDB for the integration tests. The self-hosted build
    #     agent does not ship LocalDB, and SIMF.Api.Tests host the API against
    #     (localdb)\MSSQLLocalDB (see tests/SIMF.Api.Tests/SimfApiFactory.cs), so
    #     the test gate below cannot reach SQL Server without it. This step
    #     installs LocalDB on first run (idempotent — skipped once present) via
    #     Chocolatey, then creates + starts the MSSQLLocalDB automatic instance
    #     under the agent's account. It FAILS LOUDLY if LocalDB is still
    #     unreachable, so a provisioning problem can never masquerade as a passing
    #     test gate. `sqllocaldb` is the standard Chocolatey package; the
    #     bootstrap URL is Chocolatey's official installer.
    #     DISABLED 2026-07-01 (enabled:false) together with the test gate below —
    #     it exists only to support the integration tests. Re-enable both together. ---
    - powershell: |
        $ErrorActionPreference = 'Stop'

        function Get-SqlLocalDbExe {
          $cmd = Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue
          if ($cmd) { return $cmd.Source }
          $found = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($found) { return $found.FullName }
          return $null
        }

        $exe = Get-SqlLocalDbExe
        if (-not $exe) {
          Write-Host 'SqlLocalDB not found - installing SQL Server Express LocalDB via Chocolatey.'
          if (-not (Get-Command choco.exe -ErrorAction SilentlyContinue)) {
            Write-Host 'Chocolatey not found - bootstrapping it.'
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = 3072
            Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            $env:PATH += ";$($env:ProgramData)\chocolatey\bin"
          }
          choco install sqllocaldb -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install 'sqllocaldb' (exit $LASTEXITCODE). Install SQL Server Express LocalDB on the build agent manually, then re-run."
          }
          $exe = Get-SqlLocalDbExe
        }

        if (-not $exe) {
          throw 'SqlLocalDB.exe still not found after install - provision SQL Server Express LocalDB on the build agent.'
        }
        Write-Host "Using SqlLocalDB at: $exe"

        # create (tolerate 'already exists') + start are both idempotent across runs.
        # stderr is intentionally NOT redirected (a benign 'already exists' on create
        # must not fail the step); the info check below is the real gate.
        & $exe create MSSQLLocalDB
        & $exe start  MSSQLLocalDB

        $info = (& $exe info MSSQLLocalDB) | Out-String
        Write-Host $info
        if ($info -notmatch 'State:\s*Running') {
          throw 'MSSQLLocalDB is not Running - the integration tests cannot reach SQL Server.'
        }
      displayName: 'Provision SQL Server LocalDB (integration tests)'
      enabled: false

    # --- Test gate (NCA Secure App-Dev Standard §3-20; SIMF-OPS-001 §5) — a
    #     failing test stops the pipeline. RE-ENABLED 2026-06-21 (had been
    #     temporarily disabled 2026-06-05 for speed). SIMF.Api.Tests runs ~13 min.
    #     TEMPORARILY DISABLED 2026-07-01 (enabled:false) by owner request. Flip
    #     `enabled` back to true to restore the gate. ---
    - task: DotNetCoreCLI@2
      displayName: 'Run all tests'
      enabled: false
      inputs:
        command: 'test'
        projects: '$(Build.SourcesDirectory)/tests/**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # --- Publish (zips by default; one folder per app under the staging dir).
    #     Blazor apps (CP + Web) set ErrorOnDuplicatePublishOutputFiles=false. ---
    - task: DotNetCoreCLI@2
      displayName: 'Publish API'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --no-restore --output $(Build.ArtifactStagingDirectory)/api'
        zipAfterPublish: true

    - task: DotNetCoreCLI@2
      displayName: 'Publish Control Panel'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/cp -p:ErrorOnDuplicatePublishOutputFiles=false'
        zipAfterPublish: true

    - task: DotNetCoreCLI@2
      displayName: 'Publish Website'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/web -p:ErrorOnDuplicatePublishOutputFiles=false'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

- stage: Deploy
  displayName: 'Deploy to IIS'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: IISDeploy
    displayName: 'IIS Deployment'
    environment: 'SIMF-Prod'   # PLACEHOLDER: the Azure DevOps Environment registered on the SIMF server
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - powershell: |
              $drop = "$(Pipeline.Workspace)\drop"
              $root = "$(Pipeline.Workspace)\drop_root"

              Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $root | Out-Null

              $apiZip = Join-Path $drop "api\SIMF.Api.zip"
              $cpZip  = Join-Path $drop "cp\SIMF.ControlPanel.zip"
              $webZip = Join-Path $drop "web\SIMF.Web.zip"

              if (!(Test-Path $apiZip)) { throw "API zip not found: $apiZip" }
              if (!(Test-Path $cpZip))  { throw "CP zip not found: $cpZip" }
              if (!(Test-Path $webZip)) { throw "WEB zip not found: $webZip" }

              $apiOut = Join-Path $root "api"
              $cpOut  = Join-Path $root "cp"
              $webOut = Join-Path $root "web"

              New-Item -ItemType Directory -Force -Path $apiOut | Out-Null
              New-Item -ItemType Directory -Force -Path $cpOut  | Out-Null
              New-Item -ItemType Directory -Force -Path $webOut | Out-Null

              Write-Host "Extracting API: $apiZip -> $apiOut"
              Expand-Archive -Path $apiZip -DestinationPath $apiOut -Force
              Write-Host "Extracting CP:  $cpZip -> $cpOut"
              Expand-Archive -Path $cpZip -DestinationPath $cpOut -Force
              Write-Host "Extracting WEB: $webZip -> $webOut"
              Expand-Archive -Path $webZip -DestinationPath $webOut -Force

              Write-Host "drop_root ready:"
              Get-ChildItem $root | Select-Object Name
            displayName: 'Extract app zips to drop_root'

          # Stop the three IIS sites + their app pools BEFORE the publish so no
          # file is locked while the files are mirrored. (iis-deploy.ps1 also
          # stops/starts each app internally; this explicit pair adds a
          # pipeline-level guard, and the matching start step below runs even
          # if the deploy step fails — condition: always().)
          - powershell: |
              Import-Module WebAdministration
              foreach ($s in 'SIMF.API','SIMF.CP','SIMF.WEB') {
                $site = Get-Website -Name $s -ErrorAction SilentlyContinue
                if ($null -ne $site) {
                  Write-Host "Stopping site: $s"
                  Stop-Website -Name $s -ErrorAction SilentlyContinue
                  $pool = $site.applicationPool
                  if ($pool) { Write-Host "Stopping app pool: $pool"; Stop-WebAppPool -Name $pool -ErrorAction SilentlyContinue }
                } else { Write-Warning "IIS site not found (skip stop): $s" }
              }
            displayName: 'Stop IIS sites (before publish)'

          - powershell: |
              ./deploy/iis-deploy.ps1 `
                -ArtifactRoot "$(Pipeline.Workspace)\drop_root" `
                -ApiSiteName  "SIMF.API"  -ApiPath  "D:\SIMF\API" `
                -CpSiteName   "SIMF.CP"   -CpPath   "D:\SIMF\CP" `
                -WebSiteName  "SIMF.WEB"  -WebPath  "D:\SIMF\WEB"
            displayName: 'Deploy to IIS'
            # PLACEHOLDERS above: confirm the IIS site names and physical paths
            # for the SIMF server before this stage runs. See deploy/README.md.

          # Start the three IIS sites + their app pools AFTER the publish.
          # condition: always() so the sites are brought back up even if the
          # deploy step above failed part-way (don't leave production down).
          - powershell: |
              Import-Module WebAdministration
              foreach ($s in 'SIMF.API','SIMF.CP','SIMF.WEB') {
                $site = Get-Website -Name $s -ErrorAction SilentlyContinue
                if ($null -ne $site) {
                  $pool = $site.applicationPool
                  if ($pool) { Write-Host "Starting app pool: $pool"; Start-WebAppPool -Name $pool -ErrorAction SilentlyContinue }
                  Write-Host "Starting site: $s"
                  Start-Website -Name $s -ErrorAction SilentlyContinue
                } else { Write-Warning "IIS site not found (skip start): $s" }
              }
            displayName: 'Start IIS sites (after publish)'
            condition: always()
