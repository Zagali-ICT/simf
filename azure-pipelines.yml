# SIMF CI/CD pipeline
# Builds, tests, and publishes the three SIMF web apps, then deploys them to IIS:
#   * SimfAPI -> src/Backend/SIMF.Api            (FastEndpoints, Web SDK)
#   * SimfCP  -> src/ControlPanel/SIMF.ControlPanel (Blazor Server, Web SDK)
#   * SimfWeb -> src/Website/SIMF.Web            (Blazor SSR, Web SDK)
#
# Two further, NON-deploying stages check the artefacts that are not web apps:
#   * MobileApp -> src/Mobile/simf_app           (Flutter; analyze + test only)
#   * BadgeDesk -> src/Tools/SIMF.BadgeDesk      (WinForms; build + store tests)
#
# Mirrors the V10 ERP pipeline, adapted for SIMF:
#   * three web apps instead of two (API + Control Panel + Website);
#   * NO SDK-package / local-NuGet-feed machinery - SIMF has no SDK packages and
#     no private feed (internal refs are ProjectReference; packages come from
#     nuget.org), so a plain `dotnet restore` is used;
#   * a Test stage is ADDED - SIMF-OPS-001 section 5 requires a failing test to
#     stop the pipeline; the ERP pipeline has no test gate.
#
# Notes:
#   * web.config is generated by `dotnet publish` for Web SDK projects - it is
#     NOT hand-authored here.
#   * Database migrations are applied IN-PROCESS at API startup (Program.cs runs
#     SimfAppDbContext then SimfIdentityDbContext MigrateAsync - App before
#     Identity, SIMF-OPS-001 section B.2). There is therefore no EF step here.
#   * Production secrets/config are Machine-scope environment variables set on
#     the server (SIMF-OPS-001 section 6 / B.1) - NOT part of this pipeline.
#
# PREREQUISITE: `main` currently holds documentation only. The application code
# lives on the integration branches (feature/login-api -> feature/app-cp-api-split)
# and must be merged into `main` before a run can build - until then a run fails
# at restore/build because src/ is not yet on `main`. See deploy/README.md.
#
# PLACEHOLDERS to confirm before the Deploy stage can run (see deploy/README.md):
#   * `pool` name - the self-hosted build/deploy agent;
#   * the Deploy `environment` name;
#   * the IIS site names and physical paths passed to deploy/iis-deploy.ps1.

trigger:
- main

pool:
  name: Default   # PLACEHOLDER: self-hosted agent pool with the .NET 10 SDK (build) + IIS (deploy)

variables:
  buildConfiguration: 'Release'

stages:
- stage: Build
  displayName: 'Build, Test & Publish'
  jobs:
  - job: BuildJob
    displayName: 'Build SIMF (API + CP + Web)'
    steps:
    - checkout: self
      clean: true

    - task: UseDotNet@2
      displayName: 'Use .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    # --- Restore (nuget.org; no private feed) ---
    - task: DotNetCoreCLI@2
      displayName: 'Restore API'
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Control Panel'
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Website'
      inputs:
        command: 'restore'
        projects: '$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj'

    # --- Build (Release; TreatWarningsAsErrors is set in Directory.Build.props,
    #     so a warning fails the build per SIMF-OPS-001 section 5) ---
    - task: DotNetCoreCLI@2
      displayName: 'Build API'
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Build Control Panel'
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Build Website'
      inputs:
        command: 'build'
        projects: '$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    # --- Software Composition Analysis (NCA §1-13 / A6-13). Fails the build if any
    #     direct or transitive package has a known advisory. Complements the
    #     in-build NuGetAudit (Directory.Build.props). Uses stock `dotnet`. ---
    - powershell: |
        $projects = @(
          'src/Backend/SIMF.Api/SIMF.Api.csproj',
          'src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj',
          'src/Website/SIMF.Web/SIMF.Web.csproj'
        )
        $vulnerable = $false
        foreach ($p in $projects) {
          Write-Host "Scanning $p"
          $out = dotnet list "$(Build.SourcesDirectory)/$p" package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { $vulnerable = $true }
        }
        if ($vulnerable) { throw 'Vulnerable NuGet packages found - see the log above (NCA A6-13).' }
      displayName: 'Dependency vulnerability scan (dotnet list --vulnerable)'

    # --- SBOM (CycloneDX; NCA A6-2/A6-13). Generates a CycloneDX SBOM per app for
    #     the handover package. Best-effort (continueOnError) so a transient tool
    #     install does not block a release. ---
    - powershell: |
        dotnet tool install --global CycloneDX 2>&1 | Out-String | Write-Host
        $env:PATH += ";$($env:USERPROFILE)\.dotnet\tools"
        $sbom = "$(Build.ArtifactStagingDirectory)/sbom"
        New-Item -ItemType Directory -Force -Path $sbom | Out-Null
        dotnet CycloneDX "$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj" -o "$sbom/api"
        dotnet CycloneDX "$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj" -o "$sbom/cp"
        dotnet CycloneDX "$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj" -o "$sbom/web"
      displayName: 'Generate CycloneDX SBOM'
      continueOnError: true

    # --- SAST / DAST (NCA §1-2 / §3-2 / A5-20) — these need Azure DevOps
    #     Marketplace extensions, so they are provided as a ready-to-enable
    #     scaffold rather than active tasks (referencing an uninstalled task would
    #     break the pipeline). A DevOps admin installs the extension, then
    #     uncomments the matching block:
    #
    #     SAST — install "Microsoft Security DevOps":
    #     - task: MicrosoftSecurityDevOps@1
    #       displayName: 'SAST (Microsoft Security DevOps)'
    #       inputs:
    #         categories: 'code,artifacts'
    #
    #     DAST — install "OWASP ZAP Scan", run against the deployed staging URL:
    #     - task: owaspzap@1
    #       displayName: 'DAST (OWASP ZAP baseline)'
    #       inputs:
    #         scantype: 'targetedScan'
    #         url: 'https://staging.simrsnf.com'

    # --- Performance smoke gate (SIMF-PTS-001 §8). Ready-to-enable scaffold: needs
    #     k6 on the agent and a reachable Staging URL, so it is commented to avoid
    #     breaking the pipeline. Enable once Staging is up:
    #     - script: |
    #         k6 run -e BASE_URL=$(STAGING_BASE_URL) tests/perf/k6-baseline.js
    #       displayName: 'Performance smoke (k6)'

    # --- SQL Server LocalDB for the integration tests. The self-hosted build
    #     agent does not ship LocalDB, and SIMF.Api.Tests host the API against
    #     (localdb)\MSSQLLocalDB (see tests/SIMF.Api.Tests/SimfApiFactory.cs), so
    #     the test gate below cannot reach SQL Server without it. This step
    #     installs LocalDB on first run (idempotent — skipped once present) via
    #     Chocolatey, then creates + starts the MSSQLLocalDB automatic instance
    #     under the agent's account. It FAILS LOUDLY if LocalDB is still
    #     unreachable, so a provisioning problem can never masquerade as a passing
    #     test gate. `sqllocaldb` is the standard Chocolatey package; the
    #     bootstrap URL is Chocolatey's official installer.
    #     RE-ENABLED 2026-08-08 together with the test gate below. It exists only
    #     to support SIMF.Api.Tests, which hosts the API against LocalDB. ---
    - powershell: |
        $ErrorActionPreference = 'Stop'

        function Get-SqlLocalDbExe {
          $cmd = Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue
          if ($cmd) { return $cmd.Source }
          $found = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($found) { return $found.FullName }
          return $null
        }

        $exe = Get-SqlLocalDbExe
        if (-not $exe) {
          Write-Host 'SqlLocalDB not found - installing SQL Server Express LocalDB via Chocolatey.'
          if (-not (Get-Command choco.exe -ErrorAction SilentlyContinue)) {
            Write-Host 'Chocolatey not found - bootstrapping it.'
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = 3072
            Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            $env:PATH += ";$($env:ProgramData)\chocolatey\bin"
          }
          choco install sqllocaldb -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install 'sqllocaldb' (exit $LASTEXITCODE). Install SQL Server Express LocalDB on the build agent manually, then re-run."
          }
          $exe = Get-SqlLocalDbExe
        }

        if (-not $exe) {
          throw 'SqlLocalDB.exe still not found after install - provision SQL Server Express LocalDB on the build agent.'
        }
        Write-Host "Using SqlLocalDB at: $exe"

        # create (tolerate 'already exists') + start are both idempotent across runs.
        # stderr is intentionally NOT redirected (a benign 'already exists' on create
        # must not fail the step); the info check below is the real gate.
        & $exe create MSSQLLocalDB
        & $exe start  MSSQLLocalDB

        $info = (& $exe info MSSQLLocalDB) | Out-String
        Write-Host $info
        if ($info -notmatch 'State:\s*Running') {
          throw 'MSSQLLocalDB is not Running - the integration tests cannot reach SQL Server.'
        }
      displayName: 'Provision SQL Server LocalDB (integration tests)'

    # --- Test gate, part 1: the FAST suites (NCA Secure App-Dev Standard §3-20;
    #     SIMF-OPS-001 §5). A failing test stops the pipeline.
    #
    #     RE-ENABLED 2026-08-08 after measuring what was actually slow. The gate
    #     was disabled 2026-07-01 for speed, and because it was ONE all-or-nothing
    #     step, 922 tests that finish in under a minute went off with the one
    #     suite that does not:
    #
    #       SIMF.Domain.Tests            17 tests
    #       SIMF.Application.Tests      119 tests
    #       SIMF.ApiClient.Tests         50 tests
    #       SIMF.ControlPanel.Tests     588 tests   <- the CP permission + nav gates
    #       SIMF.Web.Tests              140 tests
    #       SIMF.E2E.Tests                8 tests   (227 skipped with no QA stack)
    #
    #     That is what left the CP permission/nav gates, the E2E-catalogue
    #     integrity ratchet and the WS4 element sweep passing or failing only on
    #     a developer's machine. It is also how /admin/companies stayed marked
    #     "Real" in PAGE-INDEX for eight weeks after its page was deleted: the
    #     check that catches it exists, but nothing ran it.
    #
    #     All six suites were verified green on this tree before this step was
    #     re-enabled. SIMF.Api.Tests is excluded here and gated separately below.
    #
    #     `tests/**/*.csproj` already picks up tests/SIMF.E2E.Tests (WS4,
    #     Playwright), and that project needs no extra setup here: with no QA
    #     stack reachable it reports SKIPPED in ~2s instead of failing. To make
    #     it actually sweep, provision a stack, set SIMF_QA_CP_URL /
    #     SIMF_QA_WEB_URL / SIMF_QA_API_URL and SIMF_QA_ADMIN_EMAIL / _PASSWORD /
    #     _TOTP_SECRET as secret variables, and add a browser-install step:
    #       pwsh tests/SIMF.E2E.Tests/bin/$(buildConfiguration)/net10.0/playwright.ps1 install chromium
    #     ---
    - task: DotNetCoreCLI@2
      displayName: 'Run tests (fast suites)'
      inputs:
        command: 'test'
        # Listed explicitly rather than as `tests/**/*.csproj` minus an
        # exclusion. The task's `projects` input is documented as a wildcard
        # string; the semicolon-separated `!negation` form is documented for
        # `packagesToPack`/`packagesToPush`, NOT for this input, so relying on it
        # here would be guessing at the parser. An explicit list also fails
        # loudly when a project is renamed, where a silent glob would just run
        # one suite fewer. A NEW test project must be added to this list.
        projects: |
          $(Build.SourcesDirectory)/tests/SIMF.Domain.Tests/SIMF.Domain.Tests.csproj
          $(Build.SourcesDirectory)/tests/SIMF.Application.Tests/SIMF.Application.Tests.csproj
          $(Build.SourcesDirectory)/tests/SIMF.ApiClient.Tests/SIMF.ApiClient.Tests.csproj
          $(Build.SourcesDirectory)/tests/SIMF.ControlPanel.Tests/SIMF.ControlPanel.Tests.csproj
          $(Build.SourcesDirectory)/tests/SIMF.Web.Tests/SIMF.Web.Tests.csproj
          $(Build.SourcesDirectory)/tests/SIMF.E2E.Tests/SIMF.E2E.Tests.csproj
        arguments: '--configuration $(buildConfiguration)'

    # --- Test gate, part 2: SIMF.Api.Tests (2272 integration tests).
    #
    #     SEPARATE FROM THE STEP ABOVE FOR TWO MEASURED REASONS:
    #
    #     1. It is LOAD-SENSITIVE. On the same tree and the same DLLs it reports
    #        6 failures in 1h22m when anything else builds or tests on the agent,
    #        and 0 failures in 38m20s when it runs alone. The spurious failures
    #        land in classes that share the database through SimfApiFactory
    #        (RolesExcelTests, OrganizationHeroVideoTests); the tell is the status
    #        code, because interference gives 401 while a real permission
    #        regression gives 403. A gate that fails at random gets ignored and
    #        then switched off, which is how this one ended up disabled.
    #     2. It needs LocalDB, provisioned by the step above.
    #
    #     `condition` keeps it off pull-request validation, so nobody waits ~38
    #     minutes on every push, and ON for the branch builds that gate a merge.
    #     Change the condition rather than adding `enabled: false`: a disabled
    #     step is invisible, a condition states its own rule.
    - task: DotNetCoreCLI@2
      displayName: 'Run tests (SIMF.Api.Tests, integration)'
      condition: >-
        and(succeeded(),
            ne(variables['Build.Reason'], 'PullRequest'))
      inputs:
        command: 'test'
        projects: '$(Build.SourcesDirectory)/tests/SIMF.Api.Tests/SIMF.Api.Tests.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # --- Publish (zips by default; one folder per app under the staging dir).
    #     The Blazor apps (CP + Web) need ErrorOnDuplicatePublishOutputFiles=false;
    #     that now lives in their .csproj, so every way of publishing them gets it
    #     (it used to be passed here AND by publish.ps1, which meant a new caller
    #     silently inherited the failure). ---
    - task: DotNetCoreCLI@2
      displayName: 'Publish API'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/src/Backend/SIMF.Api/SIMF.Api.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --no-restore --output $(Build.ArtifactStagingDirectory)/api'
        zipAfterPublish: true

    - task: DotNetCoreCLI@2
      displayName: 'Publish Control Panel'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/src/ControlPanel/SIMF.ControlPanel/SIMF.ControlPanel.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/cp'
        zipAfterPublish: true

    - task: DotNetCoreCLI@2
      displayName: 'Publish Website'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Build.SourcesDirectory)/src/Website/SIMF.Web/SIMF.Web.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/web'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

- stage: MobileApp
  displayName: 'Flutter app (analyze & test)'
  # BUG-010 — until now NOTHING in CI touched src/Mobile/simf_app, so the only
  # proof the shippable mobile artefact still compiles lived on one developer
  # machine. This stage restores from the committed pubspec.lock, analyses the
  # SIMF-owned Dart, and runs the widget/unit suites.
  #
  # dependsOn: [] so it runs in PARALLEL with Build and is NOT a dependency of
  # Deploy - the pipeline deploys the three WEB apps, and a Flutter/agent problem
  # must never keep production down. A failure here still turns the run red,
  # which is the gate we want.
  dependsOn: []
  jobs:
  - job: FlutterJob
    displayName: 'Flutter analyze & test (src/Mobile/simf_app)'
    variables:
      flutterApp: '$(Build.SourcesDirectory)/src/Mobile/simf_app'
    steps:
    - checkout: self
      clean: true

    # The Flutter SDK is NOT installed by a Marketplace task on purpose -
    # referencing an uninstalled task breaks the whole pipeline (same reason the
    # SAST/DAST blocks above are scaffolds, not tasks). The self-hosted agent
    # provisions Flutter on PATH; this step FAILS LOUDLY when it is missing so a
    # provisioning problem can never masquerade as a passing gate.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $flutter = Get-Command flutter -ErrorAction SilentlyContinue
        if (-not $flutter) {
          throw 'Flutter SDK not found on PATH. Install Flutter 3.44+ (Dart 3.12) on the build agent, add it to PATH, then re-run.'
        }
        Write-Host "Using Flutter at: $($flutter.Source)"
        flutter --version
        if ($LASTEXITCODE -ne 0) { throw "flutter --version failed (exit $LASTEXITCODE)." }
      displayName: 'Verify Flutter SDK on the agent'

    # Restore the app AND the two local path packages it resolves
    # (packages/simf_data_pkg, packages/simf_auth_pkg). pubspec.lock is committed
    # (BUG-010), so this resolves the exact versions the developer built against.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $targets = @('.', 'packages/simf_data_pkg', 'packages/simf_auth_pkg')
        foreach ($t in $targets) {
          $dir = Join-Path '$(flutterApp)' $t
          Write-Host "flutter pub get -> $dir"
          Push-Location $dir
          flutter pub get
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "flutter pub get failed in $t (exit $code)." }
        }
      displayName: 'flutter pub get (app + local packages)'

    # Analyze SIMF-owned Dart only. third_party/video_player_android is a VENDORED
    # upstream plugin (D-768) whose generated *.mocks.dart carry ~325 analyzer
    # errors from an upstream mockito mismatch - not ours to fix, so it is not
    # analysed here.
    #
    # WARNINGS ARE NOW FATAL (2026-08-09). `--no-fatal-warnings` was dropped once
    # the count reached zero: the only two left were unused constructor
    # parameters on test fakes, kept deliberately and now carrying a targeted
    # `// ignore:` that states why. A warning is a defect the analyzer is certain
    # about, and the previous flag let one sit unnoticed indefinitely.
    #
    # `--no-fatal-infos` STAYS. The very_good_analysis ratchet is still open at
    # ~2146 infos, most of them style preferences (avoid_positional_boolean_parameters,
    # prefer_constructors_over_static_methods, comment_references). Making those
    # fatal today would fail every build and the flag would come straight back
    # off, which is what happened to the .NET test gate. The ratchet closes in
    # its own increments; see analysis_options.yaml.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        Set-Location '$(flutterApp)'
        flutter analyze --no-fatal-infos lib test integration_test packages
        if ($LASTEXITCODE -ne 0) { throw "flutter analyze found errors or warnings in SIMF Dart sources (exit $LASTEXITCODE)." }
      displayName: 'flutter analyze (lib + test + integration_test + packages)'

    # --- Convention gate (SIMF-CQP-001). Detects the code-quality classes that
    #     NO Dart lint can see - magic numbers, hardcoded endpoint paths,
    #     private-widget placement, un-localized strings, bundled-asset paths,
    #     models declared inside repository files, and raw form controls where a
    #     shared component exists. Those seven classes are exactly what the
    #     August 2026 external review reported by hand; this step is how that
    #     review stops arriving as a document.
    #
    #     Deliberately SEPARATE from `flutter analyze` above, which stays
    #     advisory (see the ADOPTION note in analysis_options.yaml). This step is
    #     FATAL from day one because it gates against a recorded baseline, so
    #     "no NEW violations" is satisfiable immediately while the remediation
    #     waves land. It tightens to --strict (zero violations) at Wave 6.
    #
    #     The checker's own test suite runs first: a broken checker would
    #     otherwise pass everything silently, which is the failure mode this
    #     whole gate exists to prevent.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        Set-Location '$(Build.SourcesDirectory)/tool/conventions'
        dart pub get
        if ($LASTEXITCODE -ne 0) { throw "dart pub get failed for the convention checker (exit $LASTEXITCODE)." }
        dart test
        if ($LASTEXITCODE -ne 0) { throw "The convention checker's own tests failed (exit $LASTEXITCODE) - fix the checker before trusting its verdict." }
        dart run bin/simf_conventions.dart --check
        if ($LASTEXITCODE -ne 0) { throw "NEW convention violations introduced. See the list above and docs/SIMF-CQP-001-Code-Quality-Programme.md section 5 for where each literal belongs." }
      displayName: 'Convention gate (SIMF-CQP-001)'

    # Test gate. The two local packages are green (15 + 46 tests as of
    # 2026-07-26). The app suite runs 1096 tests, of which 2 in
    # test/features/sessions/my_seat_screen_test.dart are RED on main
    # (pre-existing, tracked separately) - this step therefore reports the real
    # state instead of a fake green. Fix those two and the gate goes green.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $failed = @()
        $targets = @('.', 'packages/simf_data_pkg', 'packages/simf_auth_pkg')
        foreach ($t in $targets) {
          $dir = Join-Path '$(flutterApp)' $t
          Write-Host "flutter test -> $dir"
          Push-Location $dir
          flutter test
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { $failed += "$t (exit $code)" }
        }
        if ($failed.Count -gt 0) { throw "flutter test failed in: $($failed -join ', ')." }
      displayName: 'flutter test (app + local packages)'

- stage: BadgeDesk
  displayName: 'Offline badge desk (build & test)'
  # D-813 - SIMF.BadgeDesk is deliberately outside SIMF.slnx because it is
  # Windows-only (WinForms + DPAPI + native printing) and the solution has to
  # keep building on any host. The cost of that was NO build signal at all: the
  # desk references SIMF.Common and SIMF.Contracts, both of which change
  # constantly, so a rename of EventBadgeCodec, OfflineBadgeId or
  # OfflineBadgeRegistration silently broke the ONLY tool that mints badges and
  # nothing would have said so until a desk failed to open at the venue.
  #
  # dependsOn: [] so it runs alongside Build and is NOT a dependency of Deploy -
  # the pipeline deploys the three WEB apps, and a desk-tool problem must never
  # keep production down. A failure here still turns the run red, which is the
  # gate we want. The Build stage already uses `- powershell:` steps, so this
  # pool is Windows and net10.0-windows builds on it.
  dependsOn: []
  jobs:
  - job: BadgeDeskJob
    displayName: 'Build SIMF.BadgeDesk and run its store tests'
    steps:
    - checkout: self
      clean: true

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.0.x'
      displayName: 'Use .NET 10 SDK'

    # Build and test in one step so a broken reference and a broken behaviour
    # both surface here. The test project carries the real DeskStore cases
    # (encryption at rest, sequence resumption, damaged-line tolerance); a
    # project with no test files exits 0 with "No test is available", which
    # would be a green stage that tests nothing.
    - powershell: |
        $ErrorActionPreference = 'Stop'
        dotnet build src/Tools/SIMF.BadgeDesk/SIMF.BadgeDesk.csproj -c Release --nologo
        if ($LASTEXITCODE -ne 0) { throw "BadgeDesk build failed (exit $LASTEXITCODE)." }
        dotnet test tests/SIMF.BadgeDesk.Tests/SIMF.BadgeDesk.Tests.csproj -c Release --nologo
        if ($LASTEXITCODE -ne 0) { throw "BadgeDesk tests failed (exit $LASTEXITCODE)." }
      displayName: 'dotnet build + test (src/Tools/SIMF.BadgeDesk)'

- stage: Deploy
  displayName: 'Deploy to IIS'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: IISDeploy
    displayName: 'IIS Deployment'
    environment: 'SIMF-Prod'   # PLACEHOLDER: the Azure DevOps Environment registered on the SIMF server
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - powershell: |
              $drop = "$(Pipeline.Workspace)\drop"
              $root = "$(Pipeline.Workspace)\drop_root"

              Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $root | Out-Null

              $apiZip = Join-Path $drop "api\SIMF.Api.zip"
              $cpZip  = Join-Path $drop "cp\SIMF.ControlPanel.zip"
              $webZip = Join-Path $drop "web\SIMF.Web.zip"

              if (!(Test-Path $apiZip)) { throw "API zip not found: $apiZip" }
              if (!(Test-Path $cpZip))  { throw "CP zip not found: $cpZip" }
              if (!(Test-Path $webZip)) { throw "WEB zip not found: $webZip" }

              $apiOut = Join-Path $root "api"
              $cpOut  = Join-Path $root "cp"
              $webOut = Join-Path $root "web"

              New-Item -ItemType Directory -Force -Path $apiOut | Out-Null
              New-Item -ItemType Directory -Force -Path $cpOut  | Out-Null
              New-Item -ItemType Directory -Force -Path $webOut | Out-Null

              Write-Host "Extracting API: $apiZip -> $apiOut"
              Expand-Archive -Path $apiZip -DestinationPath $apiOut -Force
              Write-Host "Extracting CP:  $cpZip -> $cpOut"
              Expand-Archive -Path $cpZip -DestinationPath $cpOut -Force
              Write-Host "Extracting WEB: $webZip -> $webOut"
              Expand-Archive -Path $webZip -DestinationPath $webOut -Force

              Write-Host "drop_root ready:"
              Get-ChildItem $root | Select-Object Name
            displayName: 'Extract app zips to drop_root'

          # Stop the three IIS sites + their app pools BEFORE the publish so no
          # file is locked while the files are mirrored. (iis-deploy.ps1 also
          # stops/starts each app internally; this explicit pair adds a
          # pipeline-level guard, and the matching start step below runs even
          # if the deploy step fails — condition: always().)
          - powershell: |
              Import-Module WebAdministration
              foreach ($s in 'SIMF.API','SIMF.CP','SIMF.WEB') {
                $site = Get-Website -Name $s -ErrorAction SilentlyContinue
                if ($null -ne $site) {
                  Write-Host "Stopping site: $s"
                  Stop-Website -Name $s -ErrorAction SilentlyContinue
                  $pool = $site.applicationPool
                  if ($pool) { Write-Host "Stopping app pool: $pool"; Stop-WebAppPool -Name $pool -ErrorAction SilentlyContinue }
                } else { Write-Warning "IIS site not found (skip stop): $s" }
              }
            displayName: 'Stop IIS sites (before publish)'

          - powershell: |
              ./deploy/iis-deploy.ps1 `
                -ArtifactRoot "$(Pipeline.Workspace)\drop_root" `
                -ApiSiteName  "SIMF.API"  -ApiPath  "D:\System\v1.0.1\api" `
                -CpSiteName   "SIMF.CP"   -CpPath   "D:\System\v1.0.1\cp" `
                -WebSiteName  "SIMF.WEB"  -WebPath  "D:\System\v1.0.1\web"
            displayName: 'Deploy to IIS'
            # PLACEHOLDERS above: confirm the IIS site names and physical paths
            # for the SIMF server before this stage runs. See deploy/README.md.

          # Start the three IIS sites + their app pools AFTER the publish.
          # condition: always() so the sites are brought back up even if the
          # deploy step above failed part-way (don't leave production down).
          - powershell: |
              Import-Module WebAdministration
              foreach ($s in 'SIMF.API','SIMF.CP','SIMF.WEB') {
                $site = Get-Website -Name $s -ErrorAction SilentlyContinue
                if ($null -ne $site) {
                  $pool = $site.applicationPool
                  if ($pool) { Write-Host "Starting app pool: $pool"; Start-WebAppPool -Name $pool -ErrorAction SilentlyContinue }
                  Write-Host "Starting site: $s"
                  Start-Website -Name $s -ErrorAction SilentlyContinue
                } else { Write-Warning "IIS site not found (skip start): $s" }
              }
            displayName: 'Start IIS sites (after publish)'
            condition: always()
