# =============================================================================
# SIMF - deploy ALL FOUR packages to THIS server.
#
# Both deployment jobs in azure-pipelines.yml run these same steps. The estate is
# TWO environments (D-886): `SIMF-Prod` is PRE-production and `SIM-RNSF` is
# production. Each server hosts all four SIMF sites, so the two jobs differ only
# in which machine the environment binds them to.
#
# ORDER IS EXPLICIT, NOT INCIDENTAL. The API goes first because everything else
# calls it; the Control Panel and the Website follow; the mobile edge goes LAST
# because it is the public front door and should only start accepting traffic
# once the API behind it is already answering.
#
# THE IIS LOGIC IS INLINE HERE, NOT IN A SCRIPT. It used to live in
# deploy/pipeline-deploy-one.ps1 (extract one zip) calling deploy/iis-deploy.ps1
# (stop, mirror, start). Both were deleted so that deploy/ holds only the
# set-env scripts and clean-env.ps1. Nothing else changed: the sequence below is
# the same one, per package, and the artifact no longer has to carry scripts.
#
# A deployment job does NOT clone the repository - "A deployment job doesn't
# automatically clone the source repo" (Azure Pipelines, Deployment jobs) - which
# is why nothing here calls a file from the repo.
# =============================================================================
parameters:
# The deploy root is VERSIONED. Bump it here when the version changes, and
# repoint the IIS sites' physical paths to match.
- name: sitePathRoot
  type: string
  default: 'D:\System\v1.0.1'

# One entry per package, in deploy order. Written once and expanded below, so
# the stop/mirror/start sequence exists in exactly one place.
- name: packages
  type: object
  default:
  - { key: api,  zip: SIMF.Api.zip,          site: SIMF.API,  label: 'the API' }
  - { key: cp,   zip: SIMF.ControlPanel.zip, site: SIMF.CP,   label: 'the Control Panel' }
  - { key: web,  zip: SIMF.Web.zip,          site: SIMF.WEB,  label: 'the Website' }
  - { key: edge, zip: SIMF.MobileEdge.zip,   site: SIMF.EDGE, label: 'the mobile edge' }

steps:
# `deploy` auto-injects an artifact download, but naming it keeps the pipeline
# readable and pins WHICH artifact lands in $(Pipeline.Workspace).
- download: current
  artifact: drop

- ${{ each pkg in parameters.packages }}:
  - powershell: |
      $ErrorActionPreference = 'Stop'

      $package  = '${{ pkg.key }}'
      $zipName  = '${{ pkg.zip }}'
      $siteName = '${{ pkg.site }}'
      $sitePath = '${{ parameters.sitePathRoot }}\${{ pkg.key }}'
      $drop     = '$(Pipeline.Workspace)\drop'
      $outDir   = '$(Pipeline.Workspace)\drop_root\' + $package

      # --- Elevation, checked FIRST ------------------------------------------
      # Without it the failure is unreadable: Import-Module dies with "Process
      # should have elevated status to access IIS configuration data", naming the
      # module rather than the cause, after the artifact is already extracted so
      # the deploy looks underway. The Azure Pipelines agent installs as a
      # service under a NON-admin account by default, so this hits on a machine
      # where the same steps have always worked by hand in an elevated console.
      $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
      $elevated = (New-Object Security.Principal.WindowsPrincipal($identity)).IsInRole(
          [Security.Principal.WindowsBuiltInRole]::Administrator)
      if (-not $elevated) {
          throw ("The deploy needs elevation to read IIS configuration, and is running as " +
                 "'$($identity.Name)' without it. Set the agent's Windows service to log on " +
                 "as an account in the local Administrators group and restart the service.")
      }

      Import-Module WebAdministration

      # --- Extract ------------------------------------------------------------
      $zipPath = Join-Path (Join-Path $drop $package) $zipName
      if (!(Test-Path $zipPath)) {
          throw ("$package zip not found: $zipPath. The Build stage publishes one zip per " +
                 "package into the drop; a missing one means the build did not produce this " +
                 "package rather than that the server is misconfigured.")
      }

      # Extracted fresh every run: Expand-Archive -Force overwrites files but does
      # not remove ones the new build dropped, and a stale DLL left behind is
      # exactly the kind of thing that runs fine until it does not.
      Remove-Item $outDir -Recurse -Force -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path $outDir | Out-Null
      Write-Host "Extracting $package : $zipPath -> $outDir"
      Expand-Archive -Path $zipPath -DestinationPath $outDir -Force

      $fileCount = @(Get-ChildItem $outDir -Recurse -File).Count
      Write-Host "$package extracted: $fileCount file(s)."
      if ($fileCount -eq 0) {
          throw "$zipPath extracted to nothing. Refusing to mirror an empty folder over a live site."
      }

      # --- Stop the site + pool, release file locks ---------------------------
      $pool = $null
      try { $pool = (Get-Item "IIS:\Sites\$siteName").applications["/"].applicationPool } catch { }
      Write-Host "site=$siteName pool=$pool -> $sitePath"

      if (Get-Website -Name $siteName -ErrorAction SilentlyContinue) {
          Write-Host "Stopping IIS site: $siteName"
          Stop-Website -Name $siteName -ErrorAction SilentlyContinue
      } else {
          Write-Warning "IIS site not found (skip stop): $siteName"
      }

      if ($pool -and (Get-Item "IIS:\AppPools\$pool" -ErrorAction SilentlyContinue)) {
          Write-Host "Stopping AppPool: $pool"
          Stop-WebAppPool -Name $pool -ErrorAction SilentlyContinue
      }

      # Best-effort: terminate this pool's workers so file locks are released
      # before the mirror. A held lock is what makes robocopy fail on a live box.
      if ($pool) {
          try {
              $workers = Get-CimInstance -Namespace 'root\WebAdministration' -ClassName 'WorkerProcess' -ErrorAction Stop
              foreach ($w in $workers) {
                  if ($w.AppPoolName -eq $pool) {
                      Write-Warning "Killing w3wp PID $($w.ProcessId) for AppPool '$pool' (release file locks)"
                      Stop-Process -Id $w.ProcessId -Force -ErrorAction SilentlyContinue
                  }
              }
          } catch {
              Write-Warning "Could not query WorkerProcess via WMI (skip killing w3wp). Reason: $($_.Exception.Message)"
          }
      }

      Start-Sleep -Seconds 2

      # --- Mirror -------------------------------------------------------------
      if (!(Test-Path $sitePath)) { New-Item -ItemType Directory -Force -Path $sitePath | Out-Null }

      $mirrored = $false
      for ($attempt = 1; $attempt -le 3; $attempt++) {
          Write-Host "Robocopy: $outDir -> $sitePath (attempt $attempt/3)"
          $p = Start-Process -FilePath 'robocopy.exe' -Wait -PassThru -NoNewWindow -ArgumentList @(
              "`"$outDir`"", "`"$sitePath`"", '/MIR', '/R:10', '/W:3', '/NP', '/NFL', '/NDL')

          # robocopy exit codes 0-7 indicate success; 8+ means at least one failure.
          if ($p.ExitCode -lt 8) {
              Write-Host "Robocopy succeeded with exit code $($p.ExitCode)"
              $mirrored = $true
              break
          }

          Write-Warning "Robocopy attempt $attempt/3 failed with exit code $($p.ExitCode)."
          if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
      }
      if (-not $mirrored) { throw "Robocopy failed after 3 attempts for $package." }

      # --- Start the pool, then the site --------------------------------------
      if ($pool -and (Get-Item "IIS:\AppPools\$pool" -ErrorAction SilentlyContinue)) {
          Write-Host "Starting AppPool: $pool"
          Start-WebAppPool -Name $pool -ErrorAction SilentlyContinue
      }
      if (Get-Website -Name $siteName -ErrorAction SilentlyContinue) {
          Write-Host "Starting IIS site: $siteName"
          Start-Website -Name $siteName -ErrorAction SilentlyContinue
      }

      Write-Host "$package deployed to $sitePath"
    displayName: 'Deploy ${{ pkg.label }}'
