title: Delegation deactivated (base)
id: s-003-base-delegation-deactivated
status: experimental
description: >
  Base rule — single successful `Delegation.Deactivated` event.
references:
  - SIMF DECISIONS_LOG.md D-183, D-185
tags:
  - attack.impact
  - attack.t1098
  - attack.t1531
author: SIMF security review
date: 2026-05-30
logsource:
