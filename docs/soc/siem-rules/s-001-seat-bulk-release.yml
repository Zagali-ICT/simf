title: Admin bulk release of active seat reservations
id: s-001-seat-bulk-release
status: experimental
description: >
  Detects a single admin actor releasing many active seat
  reservations within a short window via the CP. Indicates
  accidental mass action, insider abuse, or session hijack of an
  admin account.
references:
  - SIMF DECISIONS_LOG.md D-182
tags:
  - attack.impact
  - attack.t1531
author: SIMF security review
date: 2026-05-30
logsource:
  product: simf
  service: audit
detection:
  selection:
    EventType|any:
      - 'SeatReservation.Released'
      - 'SeatReservation.RowAdminReleased'
    Outcome: 'Success'
  condition: selection | count() by ActorUserId > 10
  timeframe: 1m
falsepositives:
  - Legitimate end-of-event cleanup by a row admin; allowlist by
    event-close window tag.
level: medium
fields:
  - ActorUserId
  - Detail.reservationId
  - Detail.row
