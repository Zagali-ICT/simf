title: Seat reservation released (base)
id: s-001-base-seat-released
status: experimental
description: >
  Base rule — single successful seat-reservation release event,
  either visitor-initiated or row-admin-initiated.
references:
  - SIMF DECISIONS_LOG.md D-182, D-185
tags:
  - attack.impact
  - attack.t1531
author: SIMF security review
date: 2026-05-30
logsource:
  product: simf
  service: audit
detection:
  selection:
    EventType:
      - 'SeatReservation.Released'
      - 'SeatReservation.RowAdminReleased'
    Outcome: 'Success'
  condition: selection
fields:
  - ActorUserId
  - Detail.reservationId
  - Detail.row
falsepositives:
  - Routine single-seat release. Informational alone.
level: informational
---
title: Admin bulk release of active seat reservations
id: s-001-seat-bulk-release
status: experimental
description: >
  Detects a single admin actor releasing many active seat
  reservations within a short window via the CP. Indicates
  accidental mass action, insider abuse, or session hijack of an
  admin account.
references:
  - SIMF DECISIONS_LOG.md D-182, D-185
tags:
  - attack.impact
  - attack.t1531
author: SIMF security review
date: 2026-05-30
correlation:
  type: event_count
  rules:
    - s-001-base-seat-released
  group-by:
    - ActorUserId
  timespan: 1m
  condition:
    gte: 10
falsepositives:
  - Legitimate end-of-event cleanup by a row admin; allowlist by
    event-close window tag.
level: medium
