title: AI input with redacted secret/PII (base)
id: ai-005-base-redacted-input
status: experimental
description: >
  Base rule — successful AI invocation whose redactor masked one or
  more secret/PII tokens at write time. The D-181 redactor emits
  `Detail.redactionKinds` (string array of canonical kinds) and
  `Detail.redactionCount` (integer) on every `AiInvocation.Succeeded`
  event. The canonical kind set is: KEY, JWT, PAN, PEM, NID, PHONE,
  EMAIL, IBAN (8 markers; D-185 reconciled vs the D-184 README which
  listed only 4 — full set is restored here).
references:
  - SIMF DECISIONS_LOG.md D-179, D-181, D-185
tags:
  - attack.collection
  - attack.t1213
author: SIMF security review
date: 2026-05-30
logsource:
  product: simf
  service: audit
detection:
  selection:
    EventType: 'AiInvocation.Succeeded'
    Outcome: 'Success'
  hasRedaction:
    Detail.redactionCount|gte: 1
  condition: selection and hasRedaction
fields:
  - ActorUserId
  - Detail.callerKind
  - Detail.promptKey
  - Detail.redactionKinds
  - Detail.redactionCount
falsepositives:
  - Single accidental paste; informational alone.
level: informational
---
title: AI input redaction-trigger spike (secrets pasted into AI)
id: ai-005-redaction-trigger-rate
status: experimental
description: >
  Detects users pasting secrets into AI inputs at volume — the
  redactor markers prove the original input contained at least one
  secret/PII class. D-185 threshold tuned to >=5 events / 1h per
  caller to keep noise low while still catching scripted abuse.
references:
  - SIMF DECISIONS_LOG.md D-179, D-181, D-185
tags:
  - attack.collection
  - attack.t1213
author: SIMF security review
date: 2026-05-30
correlation:
  type: event_count
  rules:
    - ai-005-base-redacted-input
  group-by:
    - ActorUserId
  timespan: 1h
  condition:
    gte: 5
falsepositives:
  - Security-team test runs against the AI infra; allowlist by role.
level: medium
