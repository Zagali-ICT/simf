title: AI feature-kill via bulk prompt deactivate
id: ai-003-bulk-deactivate
status: experimental
description: >
  Detects a compromised admin silently disabling AI prompts to break
  the feature without an obvious error spike. Source: D-178 threat
  scenario (c).
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - SIMF DECISIONS_LOG.md D-178
tags:
  - attack.defense-evasion
  - attack.t1562.001
author: SIMF security review
date: 2026-05-30
logsource:
  product: simf
  service: audit
detection:
  selection:
    EventType: 'AiPrompt.Deactivated'
    Outcome: 'Success'
  condition: selection | count() by ActorUserId > 1
  timeframe: 5m
falsepositives:
  - Legitimate sprint cleanup deactivating retired prompts; require
    ticket-ref correlation before paging.
level: critical
fields:
  - ActorUserId
  - Detail.promptId
  - Detail.key
