title: Admin meeting-requests list call (base)
id: m-002-base-meeting-requests-listed
status: experimental
description: >
  Base rule — successful admin list call against the meeting-requests
  queue. The audit event Detail carries `{count, total, top, skip,
  statusFilter, sessionFilter}` so the correlation rule can
  distinguish a routine top-25 status-filtered triage view from a
  top-200 unfiltered scrape.
references:
  - SIMF DECISIONS_LOG.md D-185
tags:
  - attack.collection
  - attack.t1213
author: SIMF security review
date: 2026-05-30
logsource:
  product: simf
  service: audit
detection:
  selection:
    EventType: 'Admin.MeetingRequestsListed'
    Outcome: 'Success'
  condition: selection
fields:
  - ActorUserId
  - Detail.count
  - Detail.top
  - Detail.statusFilter
  - Detail.sessionFilter
falsepositives:
  - Routine top-25 status-filtered triage view. Informational alone.
level: informational
---
title: Meeting-requests bulk-list scrape
id: m-002-meeting-request-list-scrape
status: experimental
description: >
  Detects an admin pulling the meeting-requests list with a high
  `top` AND no filters applied — the curl-the-queue pattern. Each
  one of these calls broadcasts up to 200 requester names; without
  filters, the call returns the most recent requests across all
  sessions and statuses, which is exactly the bulk-PII shape the
  D-184 review-pass flagged.

  Note: the audit Detail does not currently include a top-level "is
  scrape-shaped?" boolean — the rule expresses the heuristic via
  three coupled conditions (`count >= 100` AND empty filters). SOCs
  with platform-side time-of-day enrichment can additionally key on
  weekend / off-hours buckets.
references:
  - SIMF DECISIONS_LOG.md D-185
tags:
  - attack.collection
  - attack.t1213
author: SIMF security review
date: 2026-05-30
logsource:
  product: simf
  service: audit
detection:
  selection:
    EventType: 'Admin.MeetingRequestsListed'
    Outcome: 'Success'
  scrapeShape:
    Detail.count|gte: 100
    Detail.statusFilter: ''
    Detail.sessionFilter: ''
  condition: selection and scrapeShape
falsepositives:
  - Genuine first-of-day operator triage with a deliberately wide
    sweep; allowlist via maintenance-window tag.
level: high
fields:
  - ActorUserId
  - Detail.count
  - Detail.top
---
title: Meeting-requests list call repeat scrape
id: m-002b-meeting-request-list-repeat
status: experimental
description: >
  Detects an admin repeatedly hitting the list endpoint (pagination
  or refresh storm) within a short window — the "page through the
  whole queue 25 rows at a time" pattern that escapes the m-002
  single-large-call signal.
references:
  - SIMF DECISIONS_LOG.md D-185
tags:
  - attack.collection
  - attack.t1213
author: SIMF security review
date: 2026-05-30
correlation:
  type: event_count
  rules:
    - m-002-base-meeting-requests-listed
  group-by:
    - ActorUserId
  timespan: 10m
  condition:
    gte: 5
falsepositives:
  - Real-time triage during a live session where an admin refreshes
    the queue every two minutes. Allowlist by event-window tag.
level: medium
