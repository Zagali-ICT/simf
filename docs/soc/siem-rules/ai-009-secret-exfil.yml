title: AI secret exfiltration via prompt
id: ai-009-secret-exfil
status: experimental
description: >
  Detects any redaction marker that maps to a non-PII secret class
  (`[REDACTED_PEM]`, AWS AKIA / ASIA, GitHub PAT, Google API key,
  Slack token). Near-zero benign paste rate — highest-fidelity rule.
references:
  - SIMF DECISIONS_LOG.md D-181
tags:
  - attack.exfiltration
  - attack.t1041
author: SIMF security review
date: 2026-05-30
logsource:
  product: simf
  service: ai-invocation
detection:
  selection:
    InputJson|contains|any:
      - '[REDACTED_PEM]'
      - '[REDACTED_KEY]'
  condition: selection
falsepositives:
  - None expected. Any hit is incident-worthy.
level: critical
fields:
  - CallerUserId
  - CallerKind
  - PromptKey
notes: |
  Pair with EDR signals if the same caller's source IP also shows
  outbound traffic to non-corporate destinations within the same
  5-minute window.
