title: AI secret exfiltration via prompt
id: ai-009-secret-exfil
status: experimental
description: >
  Detects any redaction marker that maps to a non-PII secret class
  (PEM, generic KEY, JWT). Near-zero benign paste rate — highest-
  fidelity rule. Any hit is incident-worthy; no correlation needed.

  The KEY kind includes AWS AKIA/ASIA, GitHub PAT (ghp_/gho_/ghu_),
  Google API key (AIza...), and Slack token (xoxb-/xoxa-/xoxp-)
  detected by the D-181 redactor's secret-pattern matcher.
references:
  - SIMF DECISIONS_LOG.md D-181, D-185
tags:
  - attack.exfiltration
  - attack.t1041
author: SIMF security review
date: 2026-05-30
logsource:
  product: simf
  service: audit
detection:
  selection:
    EventType: 'AiInvocation.Succeeded'
    Outcome: 'Success'
  hasSecret:
    Detail.redactionKinds|contains|any:
      - 'PEM'
      - 'KEY'
      - 'JWT'
  condition: selection and hasSecret
falsepositives:
  - None expected. Any hit is incident-worthy.
level: critical
fields:
  - ActorUserId
  - Detail.callerKind
  - Detail.promptKey
notes: |
  Pair with EDR signals if the same caller's source IP also shows
  outbound traffic to non-corporate destinations within the same
  5-minute window.
