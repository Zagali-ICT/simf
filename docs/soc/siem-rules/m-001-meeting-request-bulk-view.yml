title: Admin viewed meeting request (base)
id: m-001-base-meeting-request-viewed
status: experimental
description: >
  Base rule — single successful per-record drill-down on a meeting
  request. Emitted by `MeetingRequestService.GetAsync` (and the
  Respond path mirrors a Viewed event so the email-disclosure paper
  trail stays honest regardless of which endpoint exposed it).
  D-185 introduced the event explicitly so SOC can spot per-record
  PII (requester email) drill-downs.
references:
  - SIMF DECISIONS_LOG.md D-185
tags:
  - attack.collection
  - attack.t1213
author: SIMF security review
date: 2026-05-30
logsource:
  product: simf
  service: audit
detection:
  selection:
    EventType: 'Admin.MeetingRequestViewed'
    Outcome: 'Success'
  condition: selection
fields:
  - ActorUserId
  - Detail.meetingRequestId
falsepositives:
  - Routine per-record drill-down by an admin actioning one request.
    Informational alone.
level: informational
---
title: Meeting-request bulk-view (admin PII-funnel)
id: m-001-meeting-request-bulk-view
status: experimental
description: >
  Detects an admin drilling into many distinct meeting requests in a
  short window — the per-record email-exfiltration pattern that the
  D-185 contract split + GET-by-id endpoint specifically enabled
  detection of. Each Viewed event corresponds to one email
  disclosure to that admin, so the count is a hard upper bound on
  bulk PII access.
references:
  - SIMF DECISIONS_LOG.md D-185
tags:
  - attack.collection
  - attack.t1213
author: SIMF security review
date: 2026-05-30
correlation:
  type: value_count
  rules:
    - m-001-base-meeting-request-viewed
  group-by:
    - ActorUserId
  timespan: 10m
  field: Detail.meetingRequestId
  condition:
    gte: 20
falsepositives:
  - Genuine triage burst by an event-desk admin during a live
    session; allowlist by maintenance-window tag or the on-call rota.
level: high
