<circle cx="52" cy="489" r="11.5" fill="#B8860B"/>
<text x="52" y="493" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">12</text>
<text x="71" y="493" font-size="12.5" font-weight="bold" fill="#B8860B">Gate scan at the hall</text>
<text x="44" y="512" font-size="11" fill="#222">badge, approval state, gate profile</text>
