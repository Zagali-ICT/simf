<text x="655" y="313" font-size="12.5" font-weight="bold" fill="#C0504D">Rejected</text>
<text x="628" y="332" font-size="11" fill="#222">reason recorded, applicant notified</text>
<rect x="34" y="352" width="266" height="48" rx="3" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.8"/>
<circle cx="52" cy="369" r="11.5" fill="#2E7D46"/>
<text x="52" y="373" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">9</text>
<text x="71" y="373" font-size="12.5" font-weight="bold" fill="#2E7D46">Sign in</text>
<text x="44" y="392" font-size="11" fill="#222">password, then e-mailed OTP or TOTP</text>
