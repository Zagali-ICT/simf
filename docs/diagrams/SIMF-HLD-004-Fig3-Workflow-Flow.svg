<rect x="20" y="12" width="1160" height="34" fill="#1F3864"/>
<text x="600" y="35" font-size="17" font-weight="bold" fill="#FFF" text-anchor="middle">Figure 3. Key system workflows. Registration to approval, booking, hall entry, live session, minutes and feedback</text>
<rect x="24" y="56" width="286" height="46" fill="#2E7D46"/>
<text x="167" y="74" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Attendee</text>
<text x="167" y="91" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">(mobile app / public website)</text>
