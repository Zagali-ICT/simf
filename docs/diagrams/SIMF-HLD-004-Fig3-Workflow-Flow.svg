<circle cx="52" cy="549" r="11.5" fill="#2E7D46"/>
<text x="52" y="553" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">13</text>
<text x="71" y="553" font-size="12.5" font-weight="bold" fill="#2E7D46">Watch the live session</text>
<text x="44" y="572" font-size="11" fill="#222">video plays device-direct from YouTube</text>
