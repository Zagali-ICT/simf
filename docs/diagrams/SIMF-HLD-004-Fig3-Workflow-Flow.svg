<rect x="316" y="56" width="286" height="46" fill="#3B6EA5"/>
<text x="459" y="74" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">SIMF.Api</text>
<text x="459" y="91" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">(application tier)</text>
<rect x="316" y="102" width="286" height="728" fill="#F4F8FC" opacity="0.5" stroke="#C9CFD6" stroke-width="1"/>
<rect x="608" y="56" width="286" height="46" fill="#C0504D"/>
<text x="751" y="74" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Administrator / Scientific</text>
<text x="751" y="91" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Committee (Control Panel)</text>
<rect x="608" y="102" width="286" height="728" fill="#FBF3F3" opacity="0.5" stroke="#C9CFD6" stroke-width="1"/>
<rect x="900" y="56" width="276" height="46" fill="#5A6472"/>
<text x="1038" y="74" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Data and internal</text>
<text x="1038" y="91" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">services</text>
<rect x="900" y="102" width="276" height="728" fill="#EEF1F5" opacity="0.5" stroke="#C9CFD6" stroke-width="1"/>
<rect x="34" y="112" width="266" height="48" rx="3" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.8"/>
<circle cx="52" cy="129" r="11.5" fill="#2E7D46"/>
<text x="52" y="133" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">1</text>
<text x="71" y="133" font-size="12.5" font-weight="bold" fill="#2E7D46">Sign up</text>
<text x="44" y="152" font-size="11" fill="#222">e-mail and password, app or website</text>
<rect x="326" y="112" width="266" height="48" rx="3" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/>
<circle cx="344" cy="129" r="11.5" fill="#3B6EA5"/>
<text x="344" y="133" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">2</text>
<text x="363" y="133" font-size="12.5" font-weight="bold" fill="#3B6EA5">Account created</text>
<text x="336" y="152" font-size="11" fill="#222">state Registered, PBKDF2 password hash</text>
<rect x="910" y="112" width="256" height="48" rx="3" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.8"/>
<circle cx="928" cy="129" r="11.5" fill="#5A6472"/>
<text x="928" y="133" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">3</text>
<text x="947" y="133" font-size="12.5" font-weight="bold" fill="#5A6472">SMTP relay sends code</text>
<text x="920" y="152" font-size="11" fill="#222">six-digit code, queued by the worker</text>
<rect x="34" y="172" width="266" height="48" rx="3" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.8"/>
<circle cx="52" cy="189" r="11.5" fill="#2E7D46"/>
<text x="52" y="193" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">4</text>
<text x="71" y="193" font-size="12.5" font-weight="bold" fill="#2E7D46">Verify e-mail</text>
<text x="44" y="212" font-size="11" fill="#222">code compared in constant time</text>
<rect x="326" y="172" width="266" height="48" rx="3" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/>
<circle cx="344" cy="189" r="11.5" fill="#3B6EA5"/>
<text x="344" y="193" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">5</text>
<text x="363" y="193" font-size="12.5" font-weight="bold" fill="#3B6EA5">Profile stored</text>
<text x="336" y="212" font-size="11" fill="#222">encrypted, state PendingApproval</text>
<rect x="618" y="232" width="266" height="48" rx="3" fill="#FFF7E0" stroke="#B8860B" stroke-width="1.8"/>
<circle cx="636" cy="249" r="11.5" fill="#B8860B"/>
<text x="636" y="253" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">6</text>
<text x="655" y="253" font-size="12.5" font-weight="bold" fill="#B8860B">Administrator reviews</text>
<text x="628" y="272" font-size="11" fill="#222">approve or reject in the Control Panel</text>
<rect x="326" y="292" width="266" height="48" rx="3" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/>
<circle cx="344" cy="309" r="11.5" fill="#3B6EA5"/>
<text x="344" y="313" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">7</text>
<text x="363" y="313" font-size="12.5" font-weight="bold" fill="#3B6EA5">Badge issued on approval</text>
<text x="336" y="332" font-size="11" fill="#222">QR id minted, approval notice e-mailed</text>
<rect x="618" y="292" width="266" height="48" rx="3" fill="#FFFFFF" stroke="#C0504D" stroke-width="1.8"/>
<circle cx="636" cy="309" r="11.5" fill="#C0504D"/>
