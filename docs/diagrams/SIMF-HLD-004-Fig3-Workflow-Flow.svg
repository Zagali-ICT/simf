<circle cx="52" cy="429" r="11.5" fill="#2E7D46"/>
<text x="52" y="433" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">10</text>
<text x="71" y="433" font-size="12.5" font-weight="bold" fill="#2E7D46">Browse and reserve</text>
<text x="44" y="452" font-size="11" fill="#222">opens a session and reserves a seat</text>
<rect x="326" y="412" width="266" height="48" rx="3" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/>
<circle cx="344" cy="429" r="11.5" fill="#3B6EA5"/>
<text x="344" y="433" font-size="11.5" font-weight="bold" fill="#FFF" text-anchor="middle">11</text>
<text x="363" y="433" font-size="12.5" font-weight="bold" fill="#3B6EA5">Seat held</text>
<text x="336" y="452" font-size="11" fill="#222">one active reservation per seat</text>
