<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1372" viewBox="0 0 1660 1372" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F3864"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B2FA0"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C00000"/></marker></defs>
<rect width="1660" height="1372" fill="#FFFFFF"/>
<rect x="16" y="12" width="1628" height="34" fill="#1F3864"/>
<text x="830" y="35" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">Figure 3. Key system workflows, end to end</text>
<rect x="40" y="60" width="350" height="56" fill="#2E7D46"/>
<text x="215" y="82" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">Attendee</text>
<text x="215" y="99" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">(mobile app / website)</text>
<rect x="40" y="116" width="350" height="1222" fill="#F4FBF6" opacity="0.45" stroke="#C9CFD6" stroke-width="1"/>
<rect x="410" y="60" width="380" height="56" fill="#3B6EA5"/>
<text x="600" y="82" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">SIMF.Api</text>
<text x="600" y="99" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">(application tier)</text>
<rect x="410" y="116" width="380" height="1222" fill="#F4F8FC" opacity="0.45" stroke="#C9CFD6" stroke-width="1"/>
<rect x="820" y="60" width="360" height="56" fill="#C0504D"/>
<text x="1000" y="82" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">Administrator / Scientific</text>
<text x="1000" y="99" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">Committee (Control Panel)</text>
<rect x="820" y="116" width="360" height="1222" fill="#FBF3F3" opacity="0.45" stroke="#C9CFD6" stroke-width="1"/>
<rect x="1210" y="60" width="400" height="56" fill="#5A6472"/>
<text x="1410" y="82" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">Data and internal</text>
<text x="1410" y="99" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">services</text>
<rect x="1210" y="116" width="400" height="1222" fill="#EEF1F5" opacity="0.45" stroke="#C9CFD6" stroke-width="1"/>
<rect x="56" y="128" width="318" height="62" rx="4" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.8"/>
<circle cx="74" cy="146" r="12" fill="#2E7D46"/>
<text x="74" y="150" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">1</text>
<text x="94" y="150" font-size="11.5" font-weight="bold" fill="#2E7D46">Sign up</text>
<text x="68" y="170" font-size="10.5" fill="#222">e-mail + password submitted</text>
<text x="68" y="184" font-size="10.5" fill="#222">from the app or the website</text>
<rect x="426" y="128" width="348" height="62" rx="4" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/>
<circle cx="444" cy="146" r="12" fill="#3B6EA5"/>
<text x="444" y="150" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">2</text>
<text x="464" y="150" font-size="11.5" font-weight="bold" fill="#3B6EA5">Create account</text>
<text x="438" y="170" font-size="10.5" fill="#222">state Registered, PBKDF2 hash,</text>
<text x="438" y="184" font-size="10.5" fill="#222">hashed verification code stored</text>
<rect x="1226" y="128" width="368" height="62" rx="4" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.8"/>
<circle cx="1244" cy="146" r="12" fill="#5A6472"/>
<text x="1244" y="150" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">3</text>
<text x="1264" y="150" font-size="11.5" font-weight="bold" fill="#5A6472">SMTP relay</text>
<text x="1238" y="170" font-size="10.5" fill="#222">sends the six-digit code</text>
<text x="1238" y="184" font-size="10.5" fill="#222">queued, dispatched by the worker</text>
<polyline points="374,158 424,158" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<polyline points="774,158 1224,158" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<text x="1000" y="152" font-size="10" font-weight="bold" fill="#1F3864" text-anchor="middle">queue e-mail</text>
<polyline points="1560,190 1600,190 1600,248 60,248 60,224" fill="none" stroke="#5A6472" stroke-width="2"  marker-end="url(#a)"/>
<text x="800" y="242" font-size="10" font-weight="bold" fill="#5A6472" text-anchor="middle">six-digit code to the attendee</text>
<rect x="56" y="278" width="318" height="62" rx="4" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.8"/>
<circle cx="74" cy="296" r="12" fill="#2E7D46"/>
<text x="74" y="300" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">4</text>
<text x="94" y="300" font-size="11.5" font-weight="bold" fill="#2E7D46">Verify e-mail</text>
<text x="68" y="320" font-size="10.5" fill="#222">code compared in constant time,</text>
<text x="68" y="334" font-size="10.5" fill="#222">consumed, state EmailVerified</text>
<rect x="426" y="278" width="348" height="62" rx="4" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/>
<circle cx="444" cy="296" r="12" fill="#3B6EA5"/>
<text x="444" y="300" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">5</text>
<text x="464" y="300" font-size="11.5" font-weight="bold" fill="#3B6EA5">Profile stored</text>
<text x="438" y="320" font-size="10.5" fill="#222">PII encrypted at rest,</text>
<text x="438" y="334" font-size="10.5" fill="#222">state PendingApproval</text>
<polyline points="374,308 424,308" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<path d="M1000 374 L1160 413 L1000 452 L840 413 z" fill="#FFF7E0" stroke="#C9A227" stroke-width="1.9"/>
<text x="1000" y="407" font-size="11.5" font-weight="bold" fill="#7A5C00" text-anchor="middle">6. Approve?</text>
<text x="1000" y="424" font-size="10" fill="#7A5C00" text-anchor="middle">administrator reviews</text>
<text x="1000" y="437" font-size="10" fill="#7A5C00" text-anchor="middle">in the Control Panel</text>
<polyline points="774,322 900,322 900,374" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<text x="908" y="350" font-size="10" font-weight="bold" fill="#1F3864" text-anchor="start">review</text>
<rect x="426" y="482" width="348" height="62" rx="4" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/>
<circle cx="444" cy="500" r="12" fill="#3B6EA5"/>
<text x="444" y="504" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">7</text>
<text x="464" y="504" font-size="11.5" font-weight="bold" fill="#3B6EA5">Badge issued</text>
<text x="438" y="524" font-size="10.5" fill="#222">QR id minted, OperationLog entry,</text>
<text x="438" y="538" font-size="10.5" fill="#222">approval notice e-mailed</text>
<rect x="836" y="482" width="328" height="62" rx="4" fill="#FFFFFF" stroke="#C00000" stroke-width="1.8"/>
<circle cx="854" cy="500" r="12" fill="#C00000"/>
<text x="854" y="504" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">8</text>
<text x="874" y="504" font-size="11.5" font-weight="bold" fill="#C00000">Rejected</text>
<text x="848" y="524" font-size="10.5" fill="#222">reason recorded, applicant</text>
<text x="848" y="538" font-size="10.5" fill="#222">notified. Flow ends</text>
<polyline points="900,452 900,482 786,482 786,512 774,512" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<text x="830" y="474" font-size="10" font-weight="bold" fill="#1F3864" text-anchor="middle">approved</text>
<polyline points="996,452 996,482" fill="none" stroke="#C00000" stroke-width="2"  marker-end="url(#ar)"/>
<text x="1050" y="474" font-size="10" font-weight="bold" fill="#C00000" text-anchor="start">rejected</text>
<rect x="56" y="578" width="318" height="62" rx="4" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.8"/>
<circle cx="74" cy="596" r="12" fill="#2E7D46"/>
<text x="74" y="600" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">9</text>
<text x="94" y="600" font-size="11.5" font-weight="bold" fill="#2E7D46">Sign in</text>
<text x="68" y="620" font-size="10.5" fill="#222">password, then e-mailed OTP (visitor)</text>
<text x="68" y="634" font-size="10.5" fill="#222">or TOTP (administrator)</text>
<polyline points="424,564 390,564 390,608 374,608" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<text x="470" y="558" font-size="10" font-weight="bold" fill="#1F3864" text-anchor="start">account approved</text>
<rect x="56" y="666" width="318" height="62" rx="4" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.8"/>
<circle cx="74" cy="684" r="12" fill="#2E7D46"/>
<text x="74" y="688" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">10</text>
<text x="94" y="688" font-size="11.5" font-weight="bold" fill="#2E7D46">Browse and reserve</text>
<text x="68" y="708" font-size="10.5" fill="#222">opens a session, reserves a seat</text>
<rect x="426" y="666" width="348" height="62" rx="4" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/>
<circle cx="444" cy="684" r="12" fill="#3B6EA5"/>
<text x="444" y="688" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">11</text>
<text x="464" y="688" font-size="11.5" font-weight="bold" fill="#3B6EA5">Seat held</text>
<text x="438" y="708" font-size="10.5" fill="#222">filtered unique index enforces one</text>
<text x="438" y="722" font-size="10.5" fill="#222">active reservation per seat</text>
<polyline points="374,696 424,696" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<path d="M215 754 L370 793 L215 832 L60 793 z" fill="#FFF7E0" stroke="#C9A227" stroke-width="1.9"/>
<text x="215" y="787" font-size="11.5" font-weight="bold" fill="#7A5C00" text-anchor="middle">12. Gate scan</text>
<text x="215" y="804" font-size="10" fill="#7A5C00" text-anchor="middle">badge, approval state</text>
<text x="215" y="817" font-size="10" fill="#7A5C00" text-anchor="middle">and gate profile checked</text>
<polyline points="200,728 200,754" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<rect x="56" y="862" width="318" height="62" rx="4" fill="#FFFFFF" stroke="#6B2FA0" stroke-width="1.8"/>
<circle cx="74" cy="880" r="12" fill="#6B2FA0"/>
<text x="74" y="884" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">13</text>
<text x="94" y="884" font-size="11.5" font-weight="bold" fill="#6B2FA0">Live session</text>
<text x="68" y="904" font-size="10.5" fill="#222">video plays device-direct from YouTube;</text>
<text x="68" y="918" font-size="10.5" fill="#222">it never traverses SIMF</text>
<rect x="1226" y="862" width="368" height="62" rx="4" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.8"/>
<circle cx="1244" cy="880" r="12" fill="#5A6472"/>
<text x="1244" y="884" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">14</text>
<text x="1264" y="884" font-size="11.5" font-weight="bold" fill="#5A6472">YouTube (Internet)</text>
<text x="1238" y="904" font-size="10.5" fill="#222">stream delivered straight to the device</text>
<polyline points="200,832 200,862" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<text x="214" y="852" font-size="10" font-weight="bold" fill="#1F3864" text-anchor="start">entry allowed</text>
<polyline points="374,892 1224,892" fill="none" stroke="#6B2FA0" stroke-width="2"  stroke-dasharray="7,4" marker-end="url(#ap)"/>
<text x="800" y="886" font-size="10" font-weight="bold" fill="#6B2FA0" text-anchor="middle">client-direct playback, HTTPS 443</text>
<rect x="56" y="950" width="318" height="62" rx="4" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.8"/>
<circle cx="74" cy="968" r="12" fill="#2E7D46"/>
<text x="74" y="972" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">15</text>
<text x="94" y="972" font-size="11.5" font-weight="bold" fill="#2E7D46">Ask a question</text>
<text x="68" y="992" font-size="10.5" fill="#222">pre-session, or once live after a</text>
<text x="68" y="1006" font-size="10.5" fill="#222">hall-arrival record</text>
<rect x="426" y="950" width="348" height="62" rx="4" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/>
<circle cx="444" cy="968" r="12" fill="#3B6EA5"/>
<text x="444" y="972" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">16</text>
<text x="464" y="972" font-size="11.5" font-weight="bold" fill="#3B6EA5">Advisory AI filter</text>
<text x="438" y="992" font-size="10.5" fill="#222">question text only, sent to the</text>
<text x="438" y="1006" font-size="10.5" fill="#222">on-premises AI service</text>
<rect x="836" y="950" width="328" height="62" rx="4" fill="#FFFFFF" stroke="#C0504D" stroke-width="1.8"/>
<circle cx="854" cy="968" r="12" fill="#C0504D"/>
<text x="854" y="972" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">17</text>
<text x="874" y="972" font-size="11.5" font-weight="bold" fill="#C0504D">Committee moderates</text>
<text x="848" y="992" font-size="10.5" fill="#222">approve, hide or escalate;</text>
<text x="848" y="1006" font-size="10.5" fill="#222">moderator presents on stage</text>
<polyline points="374,980 424,980" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<polyline points="774,980 836,980" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<rect x="836" y="1038" width="328" height="62" rx="4" fill="#FFFFFF" stroke="#C0504D" stroke-width="1.8"/>
<circle cx="854" cy="1056" r="12" fill="#C0504D"/>
<text x="854" y="1060" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">18</text>
<text x="874" y="1060" font-size="11.5" font-weight="bold" fill="#C0504D">Subtitle import</text>
<text x="848" y="1080" font-size="10.5" fill="#222">administrator imports captions,</text>
<text x="848" y="1094" font-size="10.5" fill="#222">or pastes / uploads them</text>
<rect x="1226" y="1038" width="368" height="62" rx="4" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.8"/>
<circle cx="1244" cy="1056" r="12" fill="#5A6472"/>
<text x="1244" y="1060" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">19</text>
<text x="1264" y="1060" font-size="11.5" font-weight="bold" fill="#5A6472">Egress point to YouTube</text>
<text x="1238" y="1080" font-size="10.5" fill="#222">video id only, via the edge firewall.</text>
<text x="1238" y="1094" font-size="10.5" fill="#222">Optional: degrades to paste or upload</text>
<polyline points="1164,1068 1224,1068" fill="none" stroke="#E07B00" stroke-width="2"  marker-end="url(#a)"/>
<rect x="426" y="1126" width="348" height="62" rx="4" fill="#FFFFFF" stroke="#6B2FA0" stroke-width="1.8"/>
<circle cx="444" cy="1144" r="12" fill="#6B2FA0"/>
<text x="444" y="1148" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">20</text>
<text x="464" y="1148" font-size="11.5" font-weight="bold" fill="#6B2FA0">AI drafts the minutes</text>
<text x="438" y="1168" font-size="10.5" fill="#222">on-premises inference. No content</text>
<text x="438" y="1182" font-size="10.5" fill="#222">leaves the ministry network</text>
<rect x="836" y="1126" width="328" height="62" rx="4" fill="#FFFFFF" stroke="#C0504D" stroke-width="1.8"/>
<circle cx="854" cy="1144" r="12" fill="#C0504D"/>
<text x="854" y="1148" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">21</text>
<text x="874" y="1148" font-size="11.5" font-weight="bold" fill="#C0504D">Committee approves</text>
<text x="848" y="1168" font-size="10.5" fill="#222">edits, approves, then an administrator</text>
<text x="848" y="1182" font-size="10.5" fill="#222">publishes after the session starts</text>
<polyline points="774,1156 836,1156" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<rect x="56" y="1214" width="318" height="62" rx="4" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.8"/>
<circle cx="74" cy="1232" r="12" fill="#2E7D46"/>
<text x="74" y="1236" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">22</text>
<text x="94" y="1236" font-size="11.5" font-weight="bold" fill="#2E7D46">Rating and feedback</text>
<text x="68" y="1256" font-size="10.5" fill="#222">per-session, end-of-day and</text>
<text x="68" y="1270" font-size="10.5" fill="#222">end-of-programme prompts</text>
<rect x="426" y="1214" width="348" height="62" rx="4" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/>
<circle cx="444" cy="1232" r="12" fill="#3B6EA5"/>
<text x="444" y="1236" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">23</text>
<text x="464" y="1236" font-size="11.5" font-weight="bold" fill="#3B6EA5">Prompts scheduled</text>
<text x="438" y="1256" font-size="10.5" fill="#222">background worker prompts by</text>
<text x="438" y="1270" font-size="10.5" fill="#222">recorded attendance</text>
<polyline points="424,1244 374,1244" fill="none" stroke="#1F3864" stroke-width="2"  marker-end="url(#a)"/>
<rect x="40" y="1320" width="1580" height="34" fill="#F9FAFB" stroke="#9AA6B2" stroke-width="1"/>
<text x="830" y="1342" font-size="11" fill="#C00000" font-weight="bold" text-anchor="middle">All AI inference (steps 16 and 20) runs on-premises inside the SSA zone. The only outbound flow is the optional caption import at step 19.</text>
</svg>