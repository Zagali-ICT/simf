<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F3864"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B2FA0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E07B00"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C00000"/></marker></defs>
<rect width="1400" height="960" fill="#FFFFFF"/>
<rect x="14" y="10" width="1372" height="34" fill="#1F3864"/>
<text x="700" y="33" font-size="17" font-weight="bold" fill="#FFF" text-anchor="middle">Figure 3. Key system workflows, part 1 of 2: registration to hall entry</text>
<rect x="28" y="56" width="300" height="54" fill="#2E7D46"/>
<text x="178" y="80" font-size="13.5" font-weight="bold" fill="#FFF" text-anchor="middle">Attendee</text>
<text x="178" y="97" font-size="13.5" font-weight="bold" fill="#FFF" text-anchor="middle">(mobile app / website)</text>
<rect x="28" y="110" width="300" height="824" fill="#F4FBF6" opacity="0.45" stroke="#C9CFD6" stroke-width="1"/>
<rect x="348" y="56" width="320" height="54" fill="#3B6EA5"/>
<text x="508" y="80" font-size="13.5" font-weight="bold" fill="#FFF" text-anchor="middle">SIMF.Api</text>
<text x="508" y="97" font-size="13.5" font-weight="bold" fill="#FFF" text-anchor="middle">(application tier)</text>
<rect x="348" y="110" width="320" height="824" fill="#F4F8FC" opacity="0.45" stroke="#C9CFD6" stroke-width="1"/>
<rect x="688" y="56" width="320" height="54" fill="#C0504D"/>
<text x="848" y="80" font-size="13.5" font-weight="bold" fill="#FFF" text-anchor="middle">Administrator / Scientific</text>
<text x="848" y="97" font-size="13.5" font-weight="bold" fill="#FFF" text-anchor="middle">Committee (Control Panel)</text>
<rect x="688" y="110" width="320" height="824" fill="#FBF3F3" opacity="0.45" stroke="#C9CFD6" stroke-width="1"/>
<rect x="1028" y="56" width="330" height="54" fill="#5A6472"/>
<text x="1193" y="88" font-size="13.5" font-weight="bold" fill="#FFF" text-anchor="middle">Data and internal services</text>
<rect x="1028" y="110" width="330" height="824" fill="#EEF1F5" opacity="0.45" stroke="#C9CFD6" stroke-width="1"/>
<rect x="42" y="126" width="272" height="64" rx="4" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.9"/>
<circle cx="61" cy="145" r="13" fill="#2E7D46"/>
<text x="61" y="150" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">1</text>
<text x="82" y="150" font-size="13" font-weight="bold" fill="#2E7D46">Sign up</text>
<text x="54" y="171" font-size="12" fill="#222">e-mail + password submitted</text>
<text x="54" y="187" font-size="12" fill="#222">from the app or the website</text>
<rect x="362" y="126" width="292" height="64" rx="4" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.9"/>
<circle cx="381" cy="145" r="13" fill="#3B6EA5"/>
<text x="381" y="150" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">2</text>
<text x="402" y="150" font-size="13" font-weight="bold" fill="#3B6EA5">Create account</text>
<text x="374" y="171" font-size="12" fill="#222">state Registered, PBKDF2 hash,</text>
<text x="374" y="187" font-size="12" fill="#222">hashed verification code stored</text>
<rect x="1042" y="126" width="302" height="64" rx="4" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.9"/>
<circle cx="1061" cy="145" r="13" fill="#5A6472"/>
<text x="1061" y="150" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">3</text>
<text x="1082" y="150" font-size="13" font-weight="bold" fill="#5A6472">SMTP relay</text>
<text x="1054" y="171" font-size="12" fill="#222">sends the six-digit code,</text>
<text x="1054" y="187" font-size="12" fill="#222">dispatched by the worker</text>
<polyline points="314,158 362,158" fill="none" stroke="#1F3864" stroke-width="2.1" marker-end="url(#a)"/>
<polyline points="654,158 1040,158" fill="none" stroke="#1F3864" stroke-width="2.1" marker-end="url(#a)"/>
<text x="850" y="151" font-size="11.5" font-weight="bold" fill="#1F3864" text-anchor="middle">queue e-mail</text>
<polyline points="1344,190 1372,190 1372,244 44,244 44,222" fill="none" stroke="#5A6472" stroke-width="2.1" marker-end="url(#a)"/>
<text x="700" y="238" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">six-digit code returned to the attendee</text>
<rect x="42" y="282" width="272" height="64" rx="4" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.9"/>
<circle cx="61" cy="301" r="13" fill="#2E7D46"/>
<text x="61" y="306" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">4</text>
<text x="82" y="306" font-size="13" font-weight="bold" fill="#2E7D46">Verify e-mail</text>
<text x="54" y="327" font-size="12" fill="#222">code compared in constant time,</text>
<text x="54" y="343" font-size="12" fill="#222">consumed, state EmailVerified</text>
<rect x="362" y="282" width="292" height="64" rx="4" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.9"/>
<circle cx="381" cy="301" r="13" fill="#3B6EA5"/>
<text x="381" y="306" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">5</text>
<text x="402" y="306" font-size="13" font-weight="bold" fill="#3B6EA5">Profile stored</text>
<text x="374" y="327" font-size="12" fill="#222">PII encrypted at rest,</text>
<text x="374" y="343" font-size="12" fill="#222">state PendingApproval</text>
<polyline points="314,314 362,314" fill="none" stroke="#1F3864" stroke-width="2.1" marker-end="url(#a)"/>
<path d="M848 382 L993 425 L848 468 L703 425 z" fill="#FFF7E0" stroke="#C9A227" stroke-width="2"/>
<text x="848" y="417" font-size="13" font-weight="bold" fill="#7A5C00" text-anchor="middle">6. Approve?</text>
<text x="848" y="435" font-size="11.5" fill="#7A5C00" text-anchor="middle">administrator reviews</text>
<text x="848" y="450" font-size="11.5" fill="#7A5C00" text-anchor="middle">in the Control Panel</text>
<polyline points="654,332 790,332 790,382" fill="none" stroke="#1F3864" stroke-width="2.1" marker-end="url(#a)"/>
<text x="800" y="360" font-size="11.5" font-weight="bold" fill="#1F3864" text-anchor="start">review</text>
<rect x="362" y="494" width="292" height="64" rx="4" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.9"/>
<circle cx="381" cy="513" r="13" fill="#3B6EA5"/>
<text x="381" y="518" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">7</text>
<text x="402" y="518" font-size="13" font-weight="bold" fill="#3B6EA5">Badge issued</text>
<text x="374" y="539" font-size="12" fill="#222">QR id minted, OperationLog entry,</text>
<text x="374" y="555" font-size="12" fill="#222">approval notice e-mailed</text>
<rect x="702" y="494" width="292" height="64" rx="4" fill="#FFFFFF" stroke="#C00000" stroke-width="1.9"/>
<circle cx="721" cy="513" r="13" fill="#C00000"/>
<text x="721" y="518" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">8</text>
<text x="742" y="518" font-size="13" font-weight="bold" fill="#C00000">Rejected</text>
<text x="714" y="539" font-size="12" fill="#222">reason recorded, applicant</text>
<text x="714" y="555" font-size="12" fill="#222">notified. Flow ends</text>
<polyline points="790,466 790,494 676,494 676,526 654,526" fill="none" stroke="#1F3864" stroke-width="2.1" marker-end="url(#a)"/>
<text x="724" y="486" font-size="11.5" font-weight="bold" fill="#1F3864" text-anchor="middle">approved</text>
<polyline points="900,466 900,494" fill="none" stroke="#C00000" stroke-width="2.1" marker-end="url(#ar)"/>
<text x="912" y="486" font-size="11.5" font-weight="bold" fill="#C00000" text-anchor="start">rejected</text>
<rect x="42" y="596" width="272" height="64" rx="4" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.9"/>
<circle cx="61" cy="615" r="13" fill="#2E7D46"/>
<text x="61" y="620" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">9</text>
<text x="82" y="620" font-size="13" font-weight="bold" fill="#2E7D46">Sign in</text>
<text x="54" y="641" font-size="12" fill="#222">password, then e-mailed OTP (visitor)</text>
<text x="54" y="657" font-size="12" fill="#222">or TOTP (administrator)</text>
<polyline points="362,582 338,582 338,628 314,628" fill="none" stroke="#1F3864" stroke-width="2.1" marker-end="url(#a)"/>
<text x="352" y="576" font-size="11.5" font-weight="bold" fill="#1F3864" text-anchor="start">account approved</text>
<rect x="42" y="692" width="272" height="64" rx="4" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.9"/>
<circle cx="61" cy="711" r="13" fill="#2E7D46"/>
<text x="61" y="716" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">10</text>
<text x="82" y="716" font-size="13" font-weight="bold" fill="#2E7D46">Browse and reserve</text>
<text x="54" y="737" font-size="12" fill="#222">opens a session, reserves a seat</text>
<rect x="362" y="692" width="292" height="64" rx="4" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.9"/>
<circle cx="381" cy="711" r="13" fill="#3B6EA5"/>
<text x="381" y="716" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">11</text>
<text x="402" y="716" font-size="13" font-weight="bold" fill="#3B6EA5">Seat held</text>
<text x="374" y="737" font-size="12" fill="#222">filtered unique index enforces one</text>
<text x="374" y="753" font-size="12" fill="#222">active reservation per seat</text>
<polyline points="314,724 362,724" fill="none" stroke="#1F3864" stroke-width="2.1" marker-end="url(#a)"/>
<path d="M178 790 L313 833 L178 876 L43 833 z" fill="#FFF7E0" stroke="#C9A227" stroke-width="2"/>
<text x="178" y="825" font-size="13" font-weight="bold" fill="#7A5C00" text-anchor="middle">12. Gate scan</text>
<text x="178" y="843" font-size="11.5" fill="#7A5C00" text-anchor="middle">badge, approval state and</text>
<text x="178" y="858" font-size="11.5" fill="#7A5C00" text-anchor="middle">gate profile checked</text>
<polyline points="178,764 178,790" fill="none" stroke="#1F3864" stroke-width="2.1" marker-end="url(#a)"/>
<rect x="28" y="914" width="1344" height="32" fill="#F9FAFB" stroke="#9AA6B2" stroke-width="1"/>
<text x="700" y="935" font-size="12" fill="#C00000" font-weight="bold" text-anchor="middle">Continues in Figure 4. Entry allowed leads to the live session; a denial is recorded with its reason code.</text>
</svg>