<text x="1082" y="338" font-size="13" font-weight="bold" fill="#5A6472">Egress point to YouTube</text>
<text x="1054" y="359" font-size="12" fill="#222">video id only, via the edge firewall.</text>
<text x="1054" y="375" font-size="12" fill="#222">Optional: degrades to paste or upload</text>
