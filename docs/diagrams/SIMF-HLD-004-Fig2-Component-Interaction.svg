<text x="52" y="786" font-size="13" fill="#1F3864" font-weight="bold" text-anchor="start">Connector legend, protocol and port</text>
<text x="52" y="804.0" font-size="11.5" fill="#222" text-anchor="start">1   Mobile application to the load balancer, HTTPS 443</text>
<text x="52" y="817.5" font-size="11.5" fill="#222" text-anchor="start">2   Public website to the load balancer, HTTPS 443</text>
<text x="52" y="831.0" font-size="11.5" fill="#222" text-anchor="start">3   Control Panel to the load balancer, HTTPS 443, session affinity</text>
<text x="52" y="844.5" font-size="11.5" fill="#222" text-anchor="start">4   Load balancer to SIMF.Api, HTTPS 443. Website and Control Panel hold no database connection</text>
<text x="52" y="858.0" font-size="11.5" fill="#222" text-anchor="start">5   Layer calls inside one process, Api to Application to Infrastructure to Domain</text>
<text x="52" y="871.5" font-size="11.5" fill="#222" text-anchor="start">6   SIMF.Infrastructure to the configured AI endpoint. No provider is enabled in this delivery</text>
<text x="52" y="885.0" font-size="11.5" fill="#222" text-anchor="start">7   SIMF.Infrastructure to the internal SMTP relay, SMTP with STARTTLS, TCP 587</text>
<text x="620" y="804.0" font-size="11.5" fill="#222" text-anchor="start">8   SIMF.Infrastructure to the SIEM collector, TCP 6514, and to the controlled egress point, HTTPS 443</text>
<text x="620" y="817.5" font-size="11.5" fill="#222" text-anchor="start">9   SIMF.Infrastructure to SQL Server, TCP 1433, EF Core with two DbContexts</text>
<text x="620" y="831.0" font-size="11.5" fill="#222" text-anchor="start">10  SIMF.Infrastructure to the shared file store, SMB 445</text>
<text x="620" y="844.5" font-size="11.5" fill="#222" text-anchor="start">11  Live video, attendee device direct to YouTube, HTTPS 443. It never enters any SIMF component</text>
<text x="620" y="858.0" font-size="11.5" fill="#222" text-anchor="start">12  Controlled egress point to the YouTube caption API, HTTPS 443, video id only</text>
<text x="620" y="871.5" font-size="11.5" fill="#222" text-anchor="start">13  Background worker uses the same service and data paths as SIMF.Api</text>
</svg>