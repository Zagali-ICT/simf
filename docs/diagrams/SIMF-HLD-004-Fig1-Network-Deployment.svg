<rect x="40" y="772" width="1120" height="120" fill="#FBFCFD" stroke="#9AA6B2" stroke-width="1.3"/>
<text x="52" y="790" font-size="13" fill="#1F3864" font-weight="bold" text-anchor="start">Connector legend, protocol and port</text>
<text x="52" y="810" font-size="11.5" fill="#222" text-anchor="start">1   Attendees and administrators inbound, HTTPS 443, terminated at the WAF and load balancer</text>
<text x="52" y="825" font-size="11.5" fill="#222" text-anchor="start">2   Load balancer to each application tier, HTTPS 443, re-encrypted to the backend</text>
<text x="52" y="840" font-size="11.5" fill="#222" text-anchor="start">3   Website and Control Panel reach data only through the API, typed client, HTTPS 443</text>
<text x="52" y="855" font-size="11.5" fill="#222" text-anchor="start">4   SIMF.Api to the on-premises AI host, HTTPS 443, internal to the SSA zone. This is the only path to AI</text>
<text x="52" y="870" font-size="11.5" fill="#222" text-anchor="start">5   Worker host to the internal SMTP relay, SMTP with STARTTLS, TCP 587</text>
<text x="52" y="885" font-size="11.5" fill="#222" text-anchor="start">6   SIMF.Api to the controlled egress point, HTTPS 443. Only that host has an outbound route</text>
<text x="620" y="810" font-size="11.5" fill="#222" text-anchor="start">7   Egress point to the YouTube caption API through the edge firewall, HTTPS 443, video id only</text>
<text x="620" y="825" font-size="11.5" fill="#222" text-anchor="start">8   Every SSA host to the SIEM collector, syslog over TLS, TCP 6514, sent by a host log shipper</text>
<text x="620" y="840" font-size="11.5" fill="#222" text-anchor="start">9   SSA to HSA through the internal firewall, TCP 1433 to SQL Server. The worker uses the same path</text>
<text x="620" y="855" font-size="11.5" fill="#222" text-anchor="start">10  SSA to HSA through the internal firewall, TCP 445 SMB to the file store</text>
<text x="620" y="870" font-size="11.5" fill="#222" text-anchor="start">11  Live video, attendee device direct to YouTube, HTTPS 443. It never traverses any SIMF server</text>
</svg>