<rect width="1200" height="900" fill="#FFFFFF"/>
<rect x="20" y="12" width="1160" height="34" fill="#1F3864"/>
<text x="600" y="35" font-size="17" font-weight="bold" fill="#FFF" text-anchor="middle">Figure 1. SIMF deployment and network architecture. One box per hosting server, with zone, gateway, protocol and port</text>
<rect x="20" y="56" width="1160" height="134" fill="none" stroke="#5A6472" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="32" y="76" font-size="15" font-weight="bold" text-anchor="start" fill="#5A6472">Internet zone (no SIMF server runs here)</text>
<rect x="40" y="84" width="225" height="62" fill="#F4FBF6" stroke="#2E7D46" stroke-width="1.6"/>
<rect x="40" y="84" width="225" height="22" fill="#2E7D46"/>
<text x="152" y="100" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Attendee mobile device</text>
<text x="152" y="122" font-size="11.5" fill="#222" text-anchor="middle">SIMF app, Android + iOS</text>
<rect x="285" y="84" width="225" height="62" fill="#F4FBF6" stroke="#2E7D46" stroke-width="1.6"/>
<rect x="285" y="84" width="225" height="22" fill="#2E7D46"/>
<text x="397" y="100" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Public website browser</text>
<text x="397" y="122" font-size="11.5" fill="#222" text-anchor="middle">attendees, anonymous public</text>
<rect x="530" y="84" width="225" height="62" fill="#FBF3F3" stroke="#C0504D" stroke-width="1.6"/>
<rect x="530" y="84" width="225" height="22" fill="#C0504D"/>
<text x="642" y="100" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Administrator browser</text>
<text x="642" y="122" font-size="11.5" fill="#222" text-anchor="middle">Control Panel users</text>
<rect x="920" y="84" width="240" height="62" fill="#FFFFFF" stroke="#6B2FA0" stroke-width="1.6"/>
<rect x="920" y="84" width="240" height="22" fill="#6B2FA0"/>
<text x="1040" y="100" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">YouTube (public Internet)</text>
<text x="1040" y="122" font-size="11.5" fill="#222" text-anchor="middle">live playback + caption API</text>
<rect x="20" y="200" width="1160" height="24" fill="#FBE9E7" stroke="#C0504D" stroke-width="1.6"/>
<text x="600" y="216" font-size="12" font-weight="bold" fill="#C0504D" text-anchor="middle">EDGE FIREWALL / PERIMETER GATEWAY      inbound: HTTPS 443 only      outbound: FQDN allow-list, from the egress point host only</text>
<rect x="20" y="234" width="1160" height="366" fill="none" stroke="#3B6EA5" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="32" y="254" font-size="15" font-weight="bold" text-anchor="start" fill="#3B6EA5">SSA zone (application servers, Windows Server 2022)</text>
<rect x="40" y="264" width="250" height="58" fill="#EAF6EE" stroke="#1E6E36" stroke-width="1.6"/>
<rect x="40" y="264" width="250" height="22" fill="#1E6E36"/>
<text x="165" y="280" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">WAF + load balancer</text>
<text x="165" y="302" font-size="11.5" fill="#222" text-anchor="middle">active / standby, TLS terminates</text>
<rect x="560" y="264" width="280" height="58" fill="#FFF6F6" stroke="#C00000" stroke-width="1.3"/>
<text x="570" y="282" font-size="11.5" fill="#C00000" font-weight="bold">No load-balancer path to the AI host.</text>
<text x="570" y="297" font-size="11.5" fill="#C00000" font-weight="bold">SIMF.Api is the only caller of AI,</text>
<text x="570" y="312" font-size="11.5" fill="#C00000" font-weight="bold">and the AI host has no outbound route.</text>
<rect x="900" y="264" width="260" height="58" fill="#FDF3E6" stroke="#B26A00" stroke-width="1.6"/>
<rect x="900" y="264" width="260" height="22" fill="#B26A00"/>
<text x="1030" y="280" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Egress point host</text>
<text x="1030" y="302" font-size="11.5" fill="#222" text-anchor="middle">FQDN allow-list, request logging</text>
<rect x="40" y="358" width="250" height="72" fill="#F4F8FC" stroke="#3B6EA5" stroke-width="1.6"/>
<rect x="40" y="358" width="250" height="22" fill="#3B6EA5"/>
<text x="165" y="374" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">API hosts  x 4</text>
<text x="165" y="396" font-size="11.5" fill="#222" text-anchor="middle">SIMF.Api, stateless</text>
<text x="165" y="411" font-size="11.5" fill="#222" text-anchor="middle">serves app, website and CP</text>
<rect x="330" y="358" width="230" height="72" fill="#F4F8FC" stroke="#3B6EA5" stroke-width="1.6"/>
<rect x="330" y="358" width="230" height="22" fill="#3B6EA5"/>
<text x="445" y="374" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Web hosts  x 2</text>
<text x="445" y="396" font-size="11.5" fill="#222" text-anchor="middle">SIMF.Web, Blazor SSR</text>
<text x="445" y="411" font-size="11.5" fill="#222" text-anchor="middle">no database access</text>
<rect x="600" y="358" width="230" height="72" fill="#FBF3F3" stroke="#C0504D" stroke-width="1.6"/>
<rect x="600" y="358" width="230" height="22" fill="#C0504D"/>
<text x="715" y="374" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Admin hosts  x 2</text>
<text x="715" y="396" font-size="11.5" fill="#222" text-anchor="middle">SIMF.ControlPanel, Blazor Server</text>
<text x="715" y="411" font-size="11.5" fill="#222" text-anchor="middle">session affinity, no DB access</text>
<rect x="70" y="468" width="230" height="72" fill="#F1EAF8" stroke="#6B2FA0" stroke-width="1.6"/>
<rect x="70" y="468" width="230" height="22" fill="#6B2FA0"/>
<text x="185" y="484" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">AI inference host</text>
<text x="185" y="506" font-size="11.5" fill="#222" text-anchor="middle">on-premises inference service</text>
<text x="185" y="521" font-size="11.5" fill="#222" text-anchor="middle">no outbound route</text>
<rect x="330" y="468" width="230" height="72" fill="#FFF8EE" stroke="#B5860B" stroke-width="1.6"/>
<rect x="330" y="468" width="230" height="22" fill="#B5860B"/>
<text x="445" y="484" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Worker host  x 1</text>
<text x="445" y="506" font-size="11.5" fill="#222" text-anchor="middle">reminders, seat-hold expiry,</text>
<text x="445" y="521" font-size="11.5" fill="#222" text-anchor="middle">e-mail queue, NCA sweeps</text>
<rect x="590" y="468" width="230" height="72" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.6"/>
<rect x="590" y="468" width="230" height="22" fill="#5A6472"/>
<text x="705" y="484" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">SMTP relay host</text>
<text x="705" y="506" font-size="11.5" fill="#222" text-anchor="middle">internal transactional e-mail</text>
<rect x="850" y="468" width="310" height="72" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.6"/>
<rect x="850" y="468" width="310" height="22" fill="#5A6472"/>
<text x="1005" y="484" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Log collector / SIEM host</text>
<text x="1005" y="506" font-size="11.5" fill="#222" text-anchor="middle">fifteen Sigma 2.x detection rules</text>
<rect x="20" y="610" width="1160" height="24" fill="#EAF1FB" stroke="#1F3864" stroke-width="1.6"/>
<text x="600" y="626" font-size="12" font-weight="bold" fill="#1F3864" text-anchor="middle">INTERNAL FIREWALL      SSA to HSA only, TCP 1433 and TCP 445      no client route and no Internet route into the HSA zone</text>
<rect x="20" y="644" width="1160" height="116" fill="none" stroke="#1F3864" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="1168" y="664" font-size="15" font-weight="bold" text-anchor="end" fill="#1F3864">HSA zone (data, most protected)</text>
<rect x="40" y="668" width="240" height="80" fill="#F2F5FA" stroke="#1F3864" stroke-width="1.6"/>
<rect x="40" y="668" width="240" height="22" fill="#1F3864"/>
<text x="160" y="684" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Database host  x 1</text>
<text x="160" y="706" font-size="11.5" fill="#222" text-anchor="middle">SQL Server 2022, AG primary</text>
<text x="160" y="721" font-size="11.5" fill="#222" text-anchor="middle">SIMF_Identity + SIMF_App</text>
<rect x="310" y="668" width="240" height="80" fill="#F2F5FA" stroke="#1F3864" stroke-width="1.6"/>
<rect x="310" y="668" width="240" height="22" fill="#1F3864"/>
<text x="430" y="684" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Database host  x 2</text>
<text x="430" y="706" font-size="11.5" fill="#222" text-anchor="middle">readable secondaries,</text>
<text x="430" y="721" font-size="11.5" fill="#222" text-anchor="middle">AlwaysOn synchronous commit</text>
<rect x="580" y="668" width="240" height="80" fill="#EAF6F6" stroke="#1F8A8A" stroke-width="1.6"/>
<rect x="580" y="668" width="240" height="22" fill="#1F8A8A"/>
<text x="700" y="684" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">File store host</text>
<text x="700" y="706" font-size="11.5" fill="#222" text-anchor="middle">clustered SMB share</text>
<text x="700" y="721" font-size="11.5" fill="#222" text-anchor="middle">18 categories, 4 tiers</text>
<rect x="850" y="668" width="310" height="80" fill="#F5F6F8" stroke="#5A6472" stroke-width="1.6"/>
<rect x="850" y="668" width="310" height="22" fill="#5A6472"/>
<text x="1005" y="684" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">File-share witness host</text>
<text x="1005" y="706" font-size="11.5" fill="#222" text-anchor="middle">cluster quorum only,</text>
<text x="1005" y="721" font-size="11.5" fill="#222" text-anchor="middle">holds no application data</text>
