<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1330" viewBox="0 0 1560 1330">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F5D8C"/>
  </marker>
  <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
  </marker>
  <pattern id="brick" width="20" height="10" patternUnits="userSpaceOnUse">
    <rect width="20" height="10" fill="#E3E6EA"/>
    <path d="M0 0 H20 M0 5 H20 M10 0 V5 M0 5 V10 M20 5 V10"
          stroke="#9CA3AF" stroke-width="0.9" fill="none"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1560" height="1330" fill="#FFFFFF"/>
<text x="40" y="46" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="25" fill="#1A1A1A" font-weight="600" text-anchor="start">SIMF API request and response pipeline</text>
<text x="40" y="74" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="15" fill="#6B7280" text-anchor="start">Every request descends the stack and every response ascends it. The stage order is the order section 2.1.4 lists.</text>
<line x1="40" y1="90" x2="1520" y2="90" stroke="#6B7280" stroke-width="1.2"/>
<rect x="430" y="116" width="470" height="70" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="137" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#6B7280" text-anchor="middle">«caller»</text>
<text x="665.0" y="156" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">Client</text>
<text x="665.0" y="173" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">Mobile application, mobile edge, Control Panel, badge desk</text>
<rect x="430" y="214" width="470" height="62" rx="4" fill="#E7EDF4" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="239" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">CorrelationIdMiddleware</text>
<text x="665.0" y="259" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">Read or generate X-Correlation-Id, enrich logs</text>
<rect x="430" y="292" width="470" height="62" rx="4" fill="#E7EDF4" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="317" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">SecurityHeadersMiddleware</text>
<text x="665.0" y="337" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">Apply the baseline security response headers</text>
<rect x="430" y="370" width="470" height="62" rx="4" fill="#E7EDF4" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="395" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">ErrorHandlingMiddleware</text>
<text x="665.0" y="415" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">Convert an exception to ApiResult.Fail with its status</text>
<rect x="430" y="448" width="470" height="62" rx="4" fill="#E7EDF4" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="473" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">EmailRateLimitKeyMiddleware</text>
<text x="665.0" y="493" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">Extract the e-mail from a credential body, to throttle per e-mail</text>
<rect x="430" y="526" width="470" height="62" rx="4" fill="#E7EDF4" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="551" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">SwaggerBasicAuthMiddleware</text>
<text x="665.0" y="571" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">Gate the OpenAPI user interface in production</text>
<rect x="430" y="604" width="470" height="62" rx="4" fill="#D8D2C8" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="629" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">Rate limiting</text>
<text x="665.0" y="649" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">Global per-IP cap, plus six named policies</text>
<rect x="430" y="682" width="470" height="62" rx="4" fill="#D8D2C8" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="707" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">Authentication</text>
<text x="665.0" y="727" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">JWT bearer (RS256), and a distinct StreamToken scheme</text>
<rect x="430" y="760" width="470" height="62" rx="4" fill="#D8D2C8" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="785" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">Authorisation</text>
<text x="665.0" y="805" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">Named policies, and a dynamic permission policy provider</text>
<rect x="430" y="838" width="470" height="62" rx="4" fill="#D8D2C8" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="863" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">Validation</text>
<text x="665.0" y="883" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">FluentValidation, a failure becomes HTTP 400 VALIDATION_FAILED</text>
<rect x="430" y="924" width="470" height="60" rx="3" fill="#E7EDF4" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="945" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#6B7280" text-anchor="middle">«FastEndpoints»</text>
<text x="665.0" y="964" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">Endpoint</text>
<text x="665.0" y="981" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">The feature handler for the route</text>
<rect x="430" y="1008" width="470" height="70" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="1029" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#6B7280" text-anchor="middle">«use case»</text>
<text x="665.0" y="1048" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">SIMF.Application</text>
<text x="665.0" y="1065" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">Service abstractions, no ASP.NET and no EF Core</text>
<rect x="430" y="1100" width="470" height="70" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="665.0" y="1121" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#6B7280" text-anchor="middle">«adapter»</text>
<text x="665.0" y="1140" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">SIMF.Infrastructure</text>
<text x="665.0" y="1157" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="middle">EF Core contexts, storage, e-mail, identity, tokens</text>
