<text x="986" y="700" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">response, as an</text>
<text x="986" y="717" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">ApiResult envelope</text>
<path d="M 974 410 H 904" fill="none" stroke="#2F5D8C" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#ar)"/>
<rect x="830.975" y="394.8" width="212.05" height="10.8" fill="#FFFFFF" stroke="none"/>
<text x="937.0" y="403" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">an exception becomes ApiResult.Fail</text>
<rect x="58" y="214" width="300" height="361" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2"/>
<text x="72" y="235" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" fill="#1A1A1A" font-weight="600" text-anchor="start">Host configuration</text>
<text x="72" y="255" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">Applied by the host rather than traversed</text>
<text x="72" y="272" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">as a stage in sequence:</text>
<text x="72" y="289" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start"></text>
<text x="72" y="306" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">Two authentication schemes, JWT bearer</text>
<text x="72" y="323" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">as the default and StreamToken for</text>
<text x="72" y="340" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">recording playback.</text>
<text x="72" y="357" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start"></text>
<text x="72" y="374" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">Named authorisation policies and a</text>
<text x="72" y="391" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">dynamic permission policy provider over</text>
<text x="72" y="408" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">the permission catalogue.</text>
<text x="72" y="425" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start"></text>
<text x="72" y="442" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">An explicit CORS allow-list.</text>
<text x="72" y="459" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start"></text>
<text x="72" y="476" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">Per-IP rate limiting and six named</text>
<text x="72" y="493" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">policies: auth, auth-email, ai-test,</text>
<text x="72" y="510" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">ai-assistant, operational and lookup.</text>
<text x="72" y="527" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start"></text>
<text x="72" y="544" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">GET /health, which is unauthenticated</text>
<text x="72" y="561" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1A1A1A" text-anchor="start">and is the probe the load balancer uses.</text>
