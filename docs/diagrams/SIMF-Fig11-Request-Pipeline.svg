<text x="118" y="772" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">A gate applied from host configuration</text>
<path d="M 74 789 H 102" stroke="#2F5D8C" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="118" y="793" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">Request, descending</text>
<path d="M 74 810 H 102" stroke="#2F5D8C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="118" y="814" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">Response, ascending</text>
</svg>
