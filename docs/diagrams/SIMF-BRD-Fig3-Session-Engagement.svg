<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1060" viewBox="0 0 1180 1060">
<rect width="1180" height="1060" fill="#FBFBFB"/>
<rect width="1180" height="46" fill="#0D5341"/>
<text x="590.0" y="30" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">Process 3: Session engagement</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9A95"/></marker></defs>
<circle cx="430" cy="100" r="26" fill="#E3F0EC" stroke="#0C5240" stroke-width="1.6"/>
<text x="430" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="middle">Start</text>
<path d="M 430 126 L 430 162" stroke="#8A9A95" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="240.0" y="168.0" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#0C5240" stroke-width="1.6"/>
<text x="430" y="201" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#1A1A1A" font-weight="400" text-anchor="middle">Attendee checks in; session questions open</text>
<path d="M 430 224 L 430 264" stroke="#8A9A95" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="240.0" y="270.0" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#0C5240" stroke-width="1.6"/>
<text x="430" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="middle">Attendee submits a question to the moderator,</text>
<text x="430" y="314" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="middle">addressed to the speaker or the host</text>
<path d="M 430 326 L 430 372" stroke="#8A9A95" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M 430 372.0 L 580.0 440 L 430 508.0 L 280.0 440 Z" fill="#FFF6E0" stroke="#D9A441" stroke-width="1.6"/>
<text x="430" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="middle">Hall carries a geofence?</text>
<path d="M 580 440 L 780 440" stroke="#8A9A95" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="658.0" y="429.0" width="44" height="22" rx="3" fill="#FFFFFF" stroke="#8A9A95" stroke-width="1"/>
<text x="680.0" y="445.0" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1A1A1A" font-weight="600" text-anchor="middle">No</text>
<rect x="780.0" y="405.0" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#0C5240" stroke-width="1.6"/>
<text x="930" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="middle">Question accepted;</text>
<text x="930" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="middle">presence cannot be verified</text>
<path d="M 430 508 L 430 552" stroke="#8A9A95" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="408.0" y="519.0" width="44" height="22" rx="3" fill="#FFFFFF" stroke="#8A9A95" stroke-width="1"/>
<text x="430.0" y="535.0" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1A1A1A" font-weight="600" text-anchor="middle">Yes</text>
<rect x="240.0" y="558.0" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#0C5240" stroke-width="1.6"/>
<text x="430" y="591" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#1A1A1A" font-weight="400" text-anchor="middle">Attendee's hall check-in record required</text>
<path d="M 430 614 L 430 654" stroke="#8A9A95" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="240.0" y="660.0" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#0C5240" stroke-width="1.6"/>
<text x="430" y="693" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#1A1A1A" font-weight="400" text-anchor="middle">An AI filter tags the question</text>
<path d="M 430 716 L 430 756" stroke="#8A9A95" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="240.0" y="762.0" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#0C5240" stroke-width="1.6"/>
<text x="430" y="795" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#1A1A1A" font-weight="400" text-anchor="middle">Moderator reviews, reorders or hides</text>
<path d="M 430 818 L 430 858" stroke="#8A9A95" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="240.0" y="864.0" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#0C5240" stroke-width="1.6"/>
<text x="430" y="897" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#1A1A1A" font-weight="400" text-anchor="middle">Selected questions put to the speaker</text>
<path d="M 430 920 L 430 952" stroke="#8A9A95" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<circle cx="430" cy="978" r="26" fill="#373737" stroke="#0C5240" stroke-width="1.6"/>
<text x="430" y="983" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">End</text>
<path d="M 930 475 L 930 688 L 620 688" stroke="#8A9A95" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="80" y="1000" width="1020" height="44" rx="8" fill="#F1F6F4" stroke="#D7E3DF" stroke-width="1"/>
<text x="590" y="1028" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" fill="#4E5B58" font-weight="400" text-anchor="middle">The session is presented by embedding the broadcast at the address an administrator records in the Control Panel.</text>
</svg>
