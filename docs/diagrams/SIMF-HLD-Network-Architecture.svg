<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="880" viewBox="0 0 1780 880" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#000"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C00000"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F6FB2"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7030A0"/></marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F8A8A"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E07B00"/></marker>
    <pattern id="brick" width="14" height="10" patternUnits="userSpaceOnUse">
      <rect width="14" height="10" fill="#B23A1E"/>
      <path d="M0 5 H14 M7 0 V5 M0 5 V10 M14 5 V10" stroke="#7A2410" stroke-width="1.2"/>
    </pattern>
    <g id="srv">
      <rect x="0" y="0" width="40" height="26" rx="3" fill="#DCE6F1" stroke="#3B6EA5" stroke-width="1.2"/>
      <line x1="6" y1="8" x2="34" y2="8" stroke="#3B6EA5" stroke-width="1.1"/>
      <line x1="6" y1="14" x2="34" y2="14" stroke="#3B6EA5" stroke-width="1.1"/>
      <circle cx="33" cy="20" r="2.2" fill="#2E9E4F"/>
    </g>
  </defs>

  <rect width="1780" height="880" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="20" y="16" width="1740" height="34" fill="#1F3864"/>
  <text x="890" y="39" font-size="17" font-weight="bold" fill="#FFF" text-anchor="middle">SIMF Event-Day Production Architecture, SITE Private Cloud</text>

  <!-- ZONE FRAMES -->
  <rect x="20" y="64" width="360" height="796" fill="none" stroke="#9AA6B2" stroke-width="1.4"/>
  <rect x="20" y="64" width="360" height="30" fill="#2E75B6"/>
  <text x="200" y="85" font-size="15" font-weight="bold" fill="#FFF" text-anchor="middle">Internet</text>

  <rect x="408" y="64" width="944" height="796" fill="none" stroke="#9AA6B2" stroke-width="1.4"/>
  <rect x="408" y="64" width="944" height="30" fill="#4E7A2F"/>
  <text x="880" y="85" font-size="15" font-weight="bold" fill="#FFF" text-anchor="middle">SSA Zone (application servers)</text>

  <rect x="1380" y="64" width="380" height="796" fill="none" stroke="#9AA6B2" stroke-width="1.4"/>
  <rect x="1380" y="64" width="380" height="30" fill="#1F3864"/>
  <text x="1570" y="85" font-size="15" font-weight="bold" fill="#FFF" text-anchor="middle">HSA Zone (data)</text>

  <!-- FIREWALLS -->
  <rect x="386" y="104" width="18" height="712" fill="url(#brick)" stroke="#7A2410" stroke-width="1"/>
  <text x="395" y="620" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle" paint-order="stroke" stroke="#5A1B0C" stroke-width="2.2" transform="rotate(-90 395 620)">EDGE FIREWALL</text>
  <rect x="1356" y="104" width="18" height="712" fill="url(#brick)" stroke="#7A2410" stroke-width="1"/>
  <text x="1365" y="620" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle" paint-order="stroke" stroke="#5A1B0C" stroke-width="2.2" transform="rotate(-90 1365 620)">INNER FIREWALL</text>

  <!-- INTERNET -->
  <rect x="42" y="116" width="322" height="92" fill="#FFF" stroke="#2E9E4F" stroke-width="1.5"/>
  <rect x="42" y="116" width="322" height="26" fill="#00A651"/>
  <text x="203" y="135" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">Attendees</text>
  <text x="203" y="162" font-size="12" text-anchor="middle">Mobile app + public website</text>
  <text x="203" y="182" font-size="10.5" fill="#00792E" text-anchor="middle">50,000 registered, up to 30,000 concurrent</text>
  <text x="203" y="199" font-size="10.5" fill="#666" text-anchor="middle">live video streams client-direct from YouTube</text>

  <rect x="42" y="236" width="322" height="72" fill="#FFF" stroke="#C00000" stroke-width="1.5"/>
  <rect x="42" y="236" width="322" height="26" fill="#E8112D"/>
  <text x="203" y="255" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">Administrators</text>
  <text x="203" y="284" font-size="12" text-anchor="middle">Control Panel</text>
  <text x="203" y="301" font-size="10.5" fill="#666" text-anchor="middle">organiser / committee / PR</text>

  <rect x="42" y="336" width="322" height="104" fill="#FFF" stroke="#6B2FA0" stroke-width="1.5"/>
  <rect x="42" y="336" width="322" height="26" fill="#6B2FA0"/>
  <text x="203" y="355" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">External services (outbound)</text>
  <text x="58" y="382" font-size="12" text-anchor="start">•  AI provider: session summaries</text>
  <text x="58" y="404" font-size="12" text-anchor="start">•  YouTube caption API: subtitles</text>
  <text x="203" y="428" font-size="10.5" fill="#666" text-anchor="middle">reached through the controlled egress point</text>

  <!-- Legend -->
  <rect x="42" y="470" width="322" height="378" fill="#F5F6F8" stroke="#9AA6B2" stroke-width="1.2"/>
  <text x="58" y="494" font-size="13.5" font-weight="bold">Legend</text>
  <line x1="58" y1="518" x2="120" y2="518" stroke="#000" stroke-width="2.4" marker-end="url(#aBlack)"/>
  <text x="132" y="523" font-size="12">Users over HTTPS (TLS)</text>
  <line x1="58" y1="546" x2="120" y2="546" stroke="#1F6FB2" stroke-width="2.4" marker-end="url(#aBlue)"/>
  <text x="132" y="551" font-size="12">Internal API call (443)</text>
  <line x1="58" y1="574" x2="120" y2="574" stroke="#7030A0" stroke-width="2.4" marker-end="url(#aPurple)"/>
  <text x="132" y="579" font-size="12">Database (TCP 1433)</text>
  <line x1="58" y1="602" x2="120" y2="602" stroke="#1F8A8A" stroke-width="2.4" marker-end="url(#aTeal)"/>
  <text x="132" y="607" font-size="12">Files (SMB 445)</text>
  <line x1="58" y1="630" x2="120" y2="630" stroke="#E07B00" stroke-width="2.4" marker-end="url(#aOrange)"/>
  <text x="132" y="635" font-size="12">Outbound to external (egress)</text>
  <use href="#srv" x="58" y="654"/>
  <text x="132" y="672" font-size="12">Application-server node</text>
  <ellipse cx="72" cy="702" rx="13" ry="5" fill="#4472C4" stroke="#2E4E8F" stroke-width="1.1"/>
  <path d="M59 702 v12 a13 5 0 0 0 26 0 v-12" fill="#4472C4" stroke="#2E4E8F" stroke-width="1.1"/>
  <text x="132" y="708" font-size="12">SQL Server replica</text>
  <line x1="58" y1="726" x2="348" y2="726" stroke="#C9CFD6" stroke-width="1"/>
  <text x="58" y="748" font-size="11" fill="#444">The website and Control Panel reach data only</text>
  <text x="58" y="764" font-size="11" fill="#444">through the API; only the API and the worker</text>
  <text x="58" y="780" font-size="11" fill="#444">connect to the database.</text>
  <text x="58" y="804" font-size="11" fill="#444">xN = number of nodes (one is a spare for</text>
  <text x="58" y="820" font-size="11" fill="#444">high availability). Per-node sizing is in the</text>
  <text x="58" y="836" font-size="11" fill="#444">specification table.</text>

  <!-- SSA: WAF + LB -->
  <rect x="440" y="300" width="150" height="150" fill="#EAF6EE" stroke="#1E6E36" stroke-width="1.6"/>
  <rect x="440" y="300" width="150" height="26" fill="#1E6E36"/>
  <text x="515" y="319" font-size="12" font-weight="bold" fill="#FFF" text-anchor="middle">WAF + LB</text>
  <path d="M515 348 l24 14 v22 l-24 14 l-24 -14 v-22 z" fill="#2E9E4F" stroke="#1E6E36" stroke-width="1.8"/>
  <circle cx="515" cy="373" r="6" fill="#FFF"/>
  <text x="515" y="418" font-size="11" font-weight="bold" fill="#1E6E36" text-anchor="middle">HA pair</text>
  <text x="515" y="434" font-size="10.5" text-anchor="middle">TLS + OWASP WAF</text>

  <!-- SSA: Website -->
  <rect x="644" y="112" width="380" height="92" fill="#F4FBF6" stroke="#2E7D46" stroke-width="1.6"/>
  <rect x="644" y="112" width="380" height="26" fill="#2E7D46"/>
  <text x="834" y="131" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">Website: SIMF.Web x2</text>
  <use href="#srv" x="676" y="150"/>
  <use href="#srv" x="732" y="150"/>
  <text x="900" y="164" font-size="12" text-anchor="middle">Blazor SSR</text>
  <text x="900" y="182" font-size="12" text-anchor="middle">public site</text>

  <!-- SSA: API -->
  <rect x="644" y="238" width="380" height="150" fill="#F4F8FC" stroke="#3B6EA5" stroke-width="1.6"/>
  <rect x="644" y="238" width="380" height="26" fill="#3B6EA5"/>
  <text x="834" y="257" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">API: SIMF.Api x4</text>
  <use href="#srv" x="676" y="278"/>
  <use href="#srv" x="732" y="278"/>
  <use href="#srv" x="676" y="316"/>
  <use href="#srv" x="732" y="316"/>
  <text x="905" y="292" font-size="12" text-anchor="middle">.NET 10 / FastEndpoints</text>
  <text x="905" y="312" font-size="12" text-anchor="middle">REST + real-time (SignalR)</text>
  <text x="834" y="358" font-size="12" font-weight="bold" fill="#1F3864" text-anchor="middle">stateless, scales by adding nodes</text>
  <text x="834" y="376" font-size="11" fill="#00792E" text-anchor="middle">owns all data access</text>

  <!-- SSA: Control Panel -->
  <rect x="644" y="422" width="380" height="92" fill="#FBF3F3" stroke="#C0504D" stroke-width="1.6"/>
  <rect x="644" y="422" width="380" height="26" fill="#C0504D"/>
  <text x="834" y="441" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">Control Panel: SIMF.ControlPanel x2</text>
  <use href="#srv" x="676" y="460"/>
  <use href="#srv" x="732" y="460"/>
  <text x="905" y="474" font-size="12" text-anchor="middle">Blazor Server</text>
  <text x="905" y="492" font-size="12" text-anchor="middle">admin, session affinity</text>

  <!-- SSA: Worker -->
  <rect x="644" y="548" width="380" height="78" fill="#FFF8EE" stroke="#B5860B" stroke-width="1.6"/>
  <rect x="644" y="548" width="380" height="26" fill="#B5860B"/>
  <text x="834" y="567" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">Scheduled jobs</text>
  <use href="#srv" x="676" y="586"/>
  <text x="900" y="605" font-size="12" text-anchor="middle">single pinned instance (planned service)</text>

  <!-- SSA: Internal services -->
  <rect x="644" y="660" width="380" height="70" fill="#F5F6F8" stroke="#808080" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="834" y="683" font-size="12" font-weight="bold" fill="#555" text-anchor="middle">Internal services</text>
  <text x="834" y="706" font-size="12" text-anchor="middle">SMTP relay   |   Syslog / SIEM</text>

  <!-- HSA: Database -->
  <rect x="1400" y="112" width="336" height="292" fill="#F2F5FA" stroke="#1F3864" stroke-width="1.7"/>
  <rect x="1400" y="112" width="336" height="42" fill="#1F3864"/>
  <text x="1568" y="129" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">SQL Server 2022 Enterprise</text>
  <text x="1568" y="146" font-size="11.5" fill="#FFF" text-anchor="middle">AlwaysOn Availability Group</text>
  <ellipse cx="1466" cy="196" rx="28" ry="9" fill="#4472C4" stroke="#2E4E8F" stroke-width="1.4"/>
  <path d="M1438 196 v46 a28 9 0 0 0 56 0 v-46" fill="#4472C4" stroke="#2E4E8F" stroke-width="1.4"/>
  <ellipse cx="1466" cy="196" rx="28" ry="9" fill="#5B7FCA" stroke="#2E4E8F" stroke-width="1.1"/>
  <text x="1466" y="266" font-size="10.5" font-weight="bold" text-anchor="middle">Primary</text>
  <ellipse cx="1568" cy="196" rx="28" ry="9" fill="#4472C4" stroke="#2E4E8F" stroke-width="1.4"/>
  <path d="M1540 196 v46 a28 9 0 0 0 56 0 v-46" fill="#4472C4" stroke="#2E4E8F" stroke-width="1.4"/>
  <ellipse cx="1568" cy="196" rx="28" ry="9" fill="#8FA9DA" stroke="#2E4E8F" stroke-width="1.1"/>
  <text x="1568" y="266" font-size="10.5" text-anchor="middle">Readable</text>
  <ellipse cx="1670" cy="196" rx="28" ry="9" fill="#4472C4" stroke="#2E4E8F" stroke-width="1.4"/>
  <path d="M1642 196 v46 a28 9 0 0 0 56 0 v-46" fill="#4472C4" stroke="#2E4E8F" stroke-width="1.4"/>
  <ellipse cx="1670" cy="196" rx="28" ry="9" fill="#8FA9DA" stroke="#2E4E8F" stroke-width="1.1"/>
  <text x="1670" y="266" font-size="10.5" text-anchor="middle">Readable</text>
  <text x="1568" y="298" font-size="11.5" font-weight="bold" fill="#1F3864" text-anchor="middle">SIMF_Identity  +  SIMF_App</text>
  <text x="1568" y="318" font-size="11" text-anchor="middle">writes to primary, reads from secondaries</text>
  <text x="1568" y="336" font-size="11" text-anchor="middle">synchronous commit, automatic failover</text>
  <text x="1568" y="360" font-size="10.5" fill="#666" text-anchor="middle">Dev / Test: a single SQL Server Standard node.</text>
  <text x="1568" y="384" font-size="10.5" fill="#666" text-anchor="middle">Scheduled backups support recovery and rollback.</text>

  <!-- HSA: File store -->
  <rect x="1400" y="440" width="336" height="96" fill="#EAF6F6" stroke="#1F8A8A" stroke-width="1.6"/>
  <rect x="1400" y="440" width="336" height="26" fill="#1F8A8A"/>
  <text x="1568" y="459" font-size="12.5" font-weight="bold" fill="#FFF" text-anchor="middle">Shared file store</text>
  <text x="1568" y="486" font-size="12" text-anchor="middle">photos, media, presentations, ID documents</text>
  <text x="1568" y="506" font-size="11" fill="#177070" text-anchor="middle">every file encrypted at rest</text>
  <text x="1568" y="524" font-size="10.5" fill="#666" text-anchor="middle">reached only from the application servers</text>

  <!-- FLOWS -->
  <!-- Attendees -> WAF/LB -->
  <polyline points="364,158 405,158 438,360" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#aBlack)"/>
  <text x="398" y="150" font-size="10.5" font-weight="bold" text-anchor="middle">HTTPS</text>
  <!-- Administrators -> WAF/LB -->
  <polyline points="364,272 405,272 438,400" fill="none" stroke="#C00000" stroke-width="2.4" marker-end="url(#aRed)"/>
  <text x="398" y="264" font-size="10.5" font-weight="bold" fill="#C00000" text-anchor="middle">HTTPS</text>

  <!-- WAF -> Website / API / CP -->
  <polyline points="590,352 618,352 618,158 642,158" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#aBlack)"/>
  <polyline points="590,375 642,313" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#aBlack)"/>
  <polyline points="590,398 618,398 618,468 642,468" fill="none" stroke="#C00000" stroke-width="2.4" marker-end="url(#aRed)"/>

  <!-- Website -> API (443) -->
  <polyline points="770,204 770,236" fill="none" stroke="#1F6FB2" stroke-width="2.4" marker-end="url(#aBlue)"/>
  <text x="812" y="224" font-size="10" font-weight="bold" fill="#1F6FB2" text-anchor="middle">443</text>
  <!-- CP -> API (443) -->
  <polyline points="770,422 770,390" fill="none" stroke="#1F6FB2" stroke-width="2.4" marker-end="url(#aBlue)"/>
  <text x="812" y="414" font-size="10" font-weight="bold" fill="#1F6FB2" text-anchor="middle">443</text>

  <!-- API -> External (egress) -->
  <polyline points="644,252 420,252 420,392 405,392 366,392" fill="none" stroke="#E07B00" stroke-width="2.4" marker-end="url(#aOrange)"/>
  <text x="470" y="244" font-size="10.5" font-weight="bold" fill="#E07B00" text-anchor="middle">egress (AI, captions)</text>

  <!-- API + worker -> Database (1433) -->
  <polyline points="1024,300 1220,300" fill="none" stroke="#7030A0" stroke-width="2.4"/>
  <polyline points="1024,588 1220,588 1220,220" fill="none" stroke="#7030A0" stroke-width="2.4"/>
  <polyline points="1220,300 1220,220 1356,220 1398,220" fill="none" stroke="#7030A0" stroke-width="2.4" marker-end="url(#aPurple)"/>
  <text x="1290" y="212" font-size="10.5" font-weight="bold" fill="#7030A0" text-anchor="middle">TCP 1433</text>
  <text x="1140" y="604" font-size="10" fill="#7030A0" text-anchor="middle">worker</text>

  <!-- API -> File store (445) -->
  <polyline points="1024,340 1180,340 1180,488 1398,488" fill="none" stroke="#1F8A8A" stroke-width="2.4" marker-end="url(#aTeal)"/>
  <text x="1250" y="332" font-size="10.5" font-weight="bold" fill="#1F8A8A" text-anchor="middle">SMB 445</text>
</svg>
