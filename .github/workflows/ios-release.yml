name: iOS release

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the IPA to TestFlight after the build
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_IDENTIFIER: com.simrsnf.simf
  FLUTTER_APP: src/Mobile/simf_app
  FLUTTER_VERSION: 3.44.0

jobs:
  build-ios:
    name: Build signed IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort -r | head -n 1)"
          if [ -z "${xcode_path}" ]; then
            echo 'Xcode 26 was not found on the GitHub-hosted macOS image.'
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort
            exit 1
          fi

          sudo xcode-select -s "${xcode_path}/Contents/Developer"
          xcodebuild -version

      - name: Install Flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter_home="${RUNNER_TEMP}/flutter"
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "${flutter_home}"
          echo "${flutter_home}/bin" >> "${GITHUB_PATH}"
          "${flutter_home}/bin/flutter" --version
          "${flutter_home}/bin/flutter" precache --ios

      - name: Install code signing tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user codemagic-cli-tools
          echo "$(python3 -m site --user-base)/bin" >> "${GITHUB_PATH}"

      - name: Fetch Apple signing assets
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          : "${APP_STORE_CONNECT_API_KEY_ID:?Missing GitHub secret APP_STORE_CONNECT_API_KEY_ID}"
          : "${APP_STORE_CONNECT_API_KEY_P8_BASE64:?Missing GitHub secret APP_STORE_CONNECT_API_KEY_P8_BASE64}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing GitHub secret APP_STORE_CONNECT_ISSUER_ID}"

          asc_key_path="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          certificate_key_path="${RUNNER_TEMP}/simf-apple-certificate.key"

          export ASC_KEY_PATH="${asc_key_path}"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["ASC_KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["APP_STORE_CONNECT_API_KEY_P8_BASE64"])
          )
          PY

          openssl genrsa -out "${certificate_key_path}" 2048
          chmod 600 "${asc_key_path}" "${certificate_key_path}"

          keychain initialize
          app-store-connect fetch-signing-files "${APP_IDENTIFIER}" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create \
            --key-id "${APP_STORE_CONNECT_API_KEY_ID}" \
            --issuer-id "${APP_STORE_CONNECT_ISSUER_ID}" \
            --private-key "@file:${asc_key_path}" \
            --certificate-key "@file:${certificate_key_path}"
          keychain add-certificates

          export_options_plist="${RUNNER_TEMP}/ExportOptions.plist"
          cd "${FLUTTER_APP}"
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --export-options-plist "${export_options_plist}" \
            --custom-export-options '{"method":"app-store-connect","uploadBitcode":false,"uploadSymbols":true}' \
            --code-signing-setup-verbose-logging

          echo "EXPORT_OPTIONS_PLIST=${export_options_plist}" >> "${GITHUB_ENV}"
          echo "ASC_KEY_PATH=${asc_key_path}" >> "${GITHUB_ENV}"
          echo "CERTIFICATE_KEY_PATH=${certificate_key_path}" >> "${GITHUB_ENV}"

      - name: Write release configuration
        shell: bash
        env:
          SIMF_APP_KEY: ${{ secrets.SIMF_APP_KEY }}
          SIMF_SOCIAL_INSTAGRAM: ${{ vars.SIMF_SOCIAL_INSTAGRAM }}
          SIMF_SOCIAL_LINKEDIN: ${{ vars.SIMF_SOCIAL_LINKEDIN }}
          SIMF_SOCIAL_TIKTOK: ${{ vars.SIMF_SOCIAL_TIKTOK }}
          SIMF_SOCIAL_X: ${{ vars.SIMF_SOCIAL_X }}
          SIMF_SOCIAL_YOUTUBE: ${{ vars.SIMF_SOCIAL_YOUTUBE }}
          SIMF_SUPPORT_EMAIL: ${{ vars.SIMF_SUPPORT_EMAIL }}
          SIMF_SUPPORT_PHONE: ${{ vars.SIMF_SUPPORT_PHONE }}
        run: |
          set -euo pipefail

          : "${SIMF_APP_KEY:?Missing GitHub secret SIMF_APP_KEY}"

          cd "${FLUTTER_APP}"

          export DEFINES_FILE="${RUNNER_TEMP}/simf-defines.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          names = [
              "SIMF_BUILD",
              "SIMF_APP_KEY",
              "SIMF_SUPPORT_PHONE",
              "SIMF_SUPPORT_EMAIL",
              "SIMF_SOCIAL_X",
              "SIMF_SOCIAL_INSTAGRAM",
              "SIMF_SOCIAL_LINKEDIN",
              "SIMF_SOCIAL_YOUTUBE",
              "SIMF_SOCIAL_TIKTOK",
          ]
          data = {name: os.environ.get(name, "") for name in names}
          data["SIMF_BUILD"] = "prod"
          Path(os.environ["DEFINES_FILE"]).write_text(json.dumps(data), encoding="utf-8")
          PY

      - name: Resolve Flutter packages
        shell: bash
        run: |
          set -euo pipefail
          cd "${FLUTTER_APP}"
          for target in . packages/simf_auth_pkg packages/simf_data_pkg; do
            echo "flutter pub get -> ${target}"
            ( cd "${target}" && flutter pub get )
          done

      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail

          : "${EXPORT_OPTIONS_PLIST:?Missing ExportOptions.plist from signing step}"

          cd "${FLUTTER_APP}"
          flutter build ipa --release \
            --export-options-plist="${EXPORT_OPTIONS_PLIST}" \
            --dart-define-from-file="${RUNNER_TEMP}/simf-defines.json"

      - name: Package dSYMs
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="${FLUTTER_APP}/build/ios/archive/Runner.xcarchive"
          if [ -d "${archive_dir}/dSYMs" ]; then
            ( cd "${archive_dir}" && zip -qr "${RUNNER_TEMP}/dSYMs.zip" dSYMs )
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            ${{ env.FLUTTER_APP }}/build/ios/ipa/*.ipa
            ${{ runner.temp }}/dSYMs.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight }}
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          : "${APP_STORE_CONNECT_API_KEY_ID:?Missing GitHub secret APP_STORE_CONNECT_API_KEY_ID}"
          : "${APP_STORE_CONNECT_API_KEY_P8_BASE64:?Missing GitHub secret APP_STORE_CONNECT_API_KEY_P8_BASE64}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing GitHub secret APP_STORE_CONNECT_ISSUER_ID}"

          mkdir -p "${HOME}/.appstoreconnect/private_keys"
          export ASC_KEY_PATH="${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["ASC_KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["APP_STORE_CONNECT_API_KEY_P8_BASE64"])
          )
          PY

          ipa_path="$(find "${FLUTTER_APP}/build/ios/ipa" -name '*.ipa' -print | head -n 1)"
          if [ -z "${ipa_path}" ]; then
            echo 'No IPA was produced.'
            exit 1
          fi

          xcrun altool --upload-app \
            --type ios \
            --file "${ipa_path}" \
            --apiKey "${APP_STORE_CONNECT_API_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"

      - name: Clean signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/simf-defines.json" \
                "${EXPORT_OPTIONS_PLIST:-}" \
                "${ASC_KEY_PATH:-}" \
                "${CERTIFICATE_KEY_PATH:-}"
          if command -v keychain >/dev/null 2>&1; then
            keychain use-login || true
          fi
